// ドラッグ＆ドロップ（アプリ内の移動 + OS からのファイルドロップ）
function wireDropTarget(node, destDirFn) {
  node.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.add("dragover");
  });
  node.addEventListener("dragleave", () => node.classList.remove("dragover"));
  node.addEventListener("drop", async (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.remove("dragover");
    const destDir = destDirFn();
    const payload = e.dataTransfer.getData("text/u2a2a");
    if (payload) {
      const { src } = JSON.parse(payload);
      if (src === destDir || destDir.startsWith(src + "/")) return;
      return poolMove(src, destDir);
    }
    // Finder 等からの OS ファイルドロップはアップロードとして受ける
    for (const f of e.dataTransfer.files || []) {
      const buf = await f.arrayBuffer();
      let bin = "";
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      await api("/api/pool/upload", "POST", { origin: "user", filename: f.name, dataBase64: btoa(bin), dir: destDir, autoReview: false });
      toast("アップロードしました: " + f.name);
    }
  });
}

function wireDragSource(node, relPath) {
  node.setAttribute("draggable", "true");
  node.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/u2a2a", JSON.stringify({ src: relPath }));
    e.dataTransfer.effectAllowed = "copyMove";
  });
}

function fileRowEl(p, depth) {
  const pending = (state.reviewPending || {})[p.id] || [];
  const busy = pending.length || (state.fixPending || {})[p.id];
  const base = (p.file || p.title).split("/").pop();
  const row = el("div", {
    class: "pf-row" + (p.id === poolSelectedId ? " sel" : "") + (busy ? " glow-run" : ""),
    "data-file": p.file || "",
    style: "padding-left:" + (8 + depth * 14) + "px",
    onclick: () => {
      poolSelectedId = p.id;
      poolCurrentDir = (p.file || "").includes("/") ? p.file.slice(0, p.file.lastIndexOf("/")) : "";
      if (p.file) poolFocus = { kind: "file", path: p.file };
      if (document.body.classList.contains("pool-collapsed")) togglePool(false);
      renderPool();
    },
  }, [
    el("span", { class: "pf-dot", "data-s": p.status, title: POOL_STATUS_LABEL[p.status] || p.status }),
    el("span", { class: "pf-name", text: base + (busy ? " …" : ""), title: p.title }),
    el("span", { class: "pf-size", text: fmtSize(p.size) }),
  ]);
  if (p.file) wireDragSource(row, p.file);
  return row;
}

function renderPool() {
  const listBox = $("#pool-list");
  const detailBox = $("#pool-detail");
  const all = [...(state.pool || [])].reverse(); // 新しい順
  const q = $("#pool-search").value.trim().toLowerCase();
  const items = q
    ? all.filter((p) => (p.title + " " + (p.file || "") + " " + NAMES[p.origin]).toLowerCase().includes(q))
    : all;
  $("#pool-count").textContent = all.length ? (q ? items.length + "/" + all.length : all.length) + " 件" : "";
  // 移動などでフォルダが消えていたら作成先をルートへ戻す
  if (poolCurrentDir && !(state.poolDirs || []).includes(poolCurrentDir)) poolCurrentDir = "";
  $("#pool-cwd").textContent = "作成先: pool/" + (poolCurrentDir ? poolCurrentDir + "/" : "");
  renderClipBar();

  listBox.replaceChildren();
  const isTopicSel = typeof poolSelectedId === "string" && poolSelectedId.startsWith("topic:");
  if (!isTopicSel && !items.some((p) => p.id === poolSelectedId)) poolSelectedId = items.length ? items[0].id : null;

  // 🧵 スレッド履歴（トピック一覧を DAS の一部としてブラウズ）
  const topics = state.topics || [];
  const topicRow = (t, depth) => {
    const active = t.id === (currentTopic() || {}).id;
    return el("div", {
      class: "pf-row" + (poolSelectedId === "topic:" + t.id ? " sel" : ""),
      "data-topic": t.id,
      style: "padding-left:" + (8 + depth * 14) + "px",
      onclick: () => {
        poolSelectedId = "topic:" + t.id;
        if (document.body.classList.contains("pool-collapsed")) togglePool(false);
        renderPool();
      },
    }, [
      el("span", { class: "pf-dot", style: active ? "background:var(--user)" : "", title: active ? "表示中" : "" }),
      el("span", { class: "pf-name", text: "🧵 " + t.title }),
      el("span", { class: "pf-size", text: (state.messages || []).filter((m) => m.topicId === t.id).length + " msg" }),
    ]);
  };
  const qTopics = q ? topics.filter((t) => t.title.toLowerCase().includes(q)) : [];

  if (q) {
    // 検索中はフラット表示（パス付き・スレッドも横断）
    for (const t of qTopics) listBox.appendChild(topicRow(t, 0));
    if (!items.length && !qTopics.length) listBox.appendChild(el("div", { class: "empty", text: "検索に一致なし" }));
    for (const p of items) {
      const row = fileRowEl(p, 0);
      row.querySelector(".pf-name").textContent = p.file || p.title;
      listBox.appendChild(row);
    }
  } else {
    const thOpen = !closedDirs.has("threads");
    listBox.appendChild(el("div", {
      class: "pf-row folder",
      title: "スレッド履歴（自動生成ミラー: pool/threads/）",
      onclick: () => {
        thOpen ? closedDirs.add("threads") : closedDirs.delete("threads");
        renderPool();
      },
    }, [
      el("span", { class: "chev", text: thOpen ? "▾" : "▸" }),
      el("span", { class: "pf-name", text: "🧵 スレッド履歴" }),
      el("span", { class: "pf-size", text: topics.length + " 件" }),
    ]));
    if (thOpen) for (const t of topics) listBox.appendChild(topicRow(t, 1));
  }
  if (!q) {
    // Finder 風ツリー（フォルダ＋ファイル）
    const dirs = state.poolDirs || [];
    const byDir = (dir) => items.filter((p) => {
      const f = p.file || "";
      const parent = f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "";
      return parent === dir;
    });
    const childDirs = (dir) => dirs.filter((d) => {
      const parent = d.includes("/") ? d.slice(0, d.lastIndexOf("/")) : "";
      return parent === dir && d !== dir;
    });
    const renderDir = (dir, depth) => {
      for (const d of childDirs(dir)) {
        const open = !closedDirs.has(d);
        let name = d.split("/").pop();
        // topics/<id> はトピックタイトルで表示（パスは不変・表示だけ state から）
        if (d === "topics") name = "topics（トピック別成果物）";
        else if (/^topics\/[0-9a-f]{16}$/.test(d)) {
          const tp = (state.topics || []).find((x) => x.id === name);
          name = tp ? "🧵 " + tp.title : name.slice(0, 8) + "…（削除済みトピック）";
        }
        const folderRow = el("div", {
          class: "pf-row folder" + (poolCurrentDir === d ? " cwd" : ""),
          "data-dir": d,
          style: "padding-left:" + (8 + depth * 14) + "px",
          title: "クリックで作成先に指定 ／ ドロップで移動先に",
          onclick: () => {
            if (poolCurrentDir === d) {
              closedDirs.has(d) ? closedDirs.delete(d) : closedDirs.add(d);
            }
            poolCurrentDir = d;
            poolFocus = { kind: "dir", path: d };
            renderPool();
          },
        }, [
          el("span", { class: "chev", text: open ? "▾" : "▸" }),
          el("span", { class: "pf-name", text: "📁 " + name }),
        ]);
        wireDragSource(folderRow, d);
        wireDropTarget(folderRow, () => d);
        listBox.appendChild(folderRow);
        if (open) renderDir(d, depth + 1);
      }
      for (const p of byDir(dir)) listBox.appendChild(fileRowEl(p, depth));
    };
    renderDir("", 0);
    if (!items.length && !dirs.length) {
      listBox.appendChild(el("div", { class: "empty", text: "成果物なし — u2a2a/pool/ に置くか「＋持ち込み」" }));
    }
  }

  // 詳細
  detailBox.replaceChildren();
  const selItem = isTopicSel ? null : items.find((p) => p.id === poolSelectedId);
  updatePoolGlow(detailBox, selItem);
  if (isTopicSel) {
    const t = topics.find((x) => "topic:" + x.id === poolSelectedId);
    if (t) {
      renderTopicDetail(detailBox, t);
      return;
    }
  }
  const sel = selItem;
  if (!sel) {
    detailBox.appendChild(el("div", { class: "empty", text: "ファイルを選択してください" }));
    return;
  }
  renderPoolDetail(detailBox, sel);
}

// プール詳細パネルの発光。実行中は呼吸、レビュー判定・修正完了の着弾時は結果色を一瞬点灯
// 承認=青 / 条件付き承認=黄 / 差し戻し・エラー=赤
const poolRunSeen = {}; // itemId -> { r: レビュー件数, f: 修正件数 }
let poolSeenInit = false;
function updatePoolGlow(detailBox, sel) {
  let flash = "";
  for (const p of state.pool || []) {
    const seen = poolRunSeen[p.id] || { r: (p.reviews || []).length, f: (p.fixes || []).length };
    const r = (p.reviews || []).length, f = (p.fixes || []).length;
    if (poolSeenInit && sel && p.id === sel.id) {
      if (r > seen.r) {
        const last = p.reviews[r - 1];
        flash = last.error || last.verdict === "差し戻し" ? "err" : last.verdict === "条件付き承認" ? "wait" : "ok";
      } else if (f > seen.f) {
        flash = p.fixes[f - 1].error ? "err" : "ok";
      }
    }
    poolRunSeen[p.id] = { r, f };
  }
  poolSeenInit = true;
  const busy = sel && (((state.reviewPending || {})[sel.id] || []).length || (state.fixPending || {})[sel.id]);
  detailBox.dataset.glow = busy ? "run" : "";
  if (flash) {
    detailBox.removeAttribute("data-flash");
    void detailBox.offsetWidth; // 再点灯できるようアニメーションをリセット
    detailBox.dataset.flash = flash;
  }
}
$("#pool-detail").addEventListener("animationend", (e) => {
  if (e.animationName.startsWith("flash-")) $("#pool-detail").removeAttribute("data-flash");
});

function renderTopicDetail(box, t) {
  const msgs = (state.messages || []).filter((m) => m.topicId === t.id);
  const active = t.id === (currentTopic() || {}).id;
  // トピック累計（コスト・トークン）
  const tot = msgs.reduce(
    (a, m) => {
      if (m.meta) {
        const u = m.meta.usage || m.meta;
        a.cost += (m.meta.billing && m.meta.billing.mode === "metered" ? m.meta.billing.usd : m.meta.costUsd) || 0;
        a.inTok += u.inTok || 0;
        a.outTok += u.outTok || 0;
      }
      return a;
    },
    { cost: 0, inTok: 0, outTok: 0 }
  );
  box.appendChild(el("div", { class: "p-head" }, [
    el("span", { class: "origin", text: "🧵 スレッド履歴" }),
    el("span", { class: "p-title", text: t.title }),
    el("span", { class: "pf-size", text: msgs.length + " メッセージ" }),
    el("span", {
      class: "pf-size",
      text: "累計 in " + fmtTok(tot.inTok) + " / out " + fmtTok(tot.outTok) + (tot.cost ? " / $" + tot.cost.toFixed(2) + "（Claude分）" : ""),
    }),
  ]));
  box.appendChild(projectDetailsEl(t.projectId));
  if (t.mirrorFile) {
    const url = "/api/pool/file/" + encodeURIComponent(t.mirrorFile);
    box.appendChild(el("div", { class: "p-file" }, [
      el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + t.mirrorFile }),
      el("span", { class: "p-size", text: "自動生成ミラー（エージェントもこのパスで参照可）" }),
    ]));
  }
  if (t.branchedFrom) {
    const src = (state.topics || []).find((x) => x.id === t.branchedFrom.topicId);
    box.appendChild(el("div", { class: "p-file" }, [
      el("a", {
        href: "#",
        text: "🌿 分岐元: " + (src ? src.title : "（削除済みトピック）"),
        onclick: (e) => {
          e.preventDefault();
          if (src) switchTopic(src.id);
        },
      }),
    ]));
  }
  const actions = el("div", { class: "actions" }, [
    el("button", { class: "small", text: active ? "表示中のスレッドです" : "このスレッドを開く", onclick: () => { if (!active) switchTopic(t.id); } }),
    el("button", {
      class: "small",
      text: "履歴をコピー",
      onclick: async () => {
        if (!t.mirrorFile) return;
        const r = await fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile));
        copy(await r.text());
      },
    }),
    el("button", {
      class: "small",
      text: "📌 要約を更新",
      onclick: () => api("/api/topics/" + t.id + "/summarize", "POST", {})
        .then(() => toast("要約を生成中…（完了するとミラーの📌概要が更新されます）")),
    }),
  ]);
  box.appendChild(actions);
  // 履歴プレビュー（ミラーファイルを取得して Markdown 表示）
  const body = el("div", { class: "p-body mdview" });
  box.appendChild(body);
  if (!t.mirrorFile) return;
  const key = t.mirrorFile + ":" + msgs.length + ":" + (msgs.length ? msgs[msgs.length - 1].ts : 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    body.innerHTML = renderMarkdown(cached.text);
    return;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile)).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
}

      const fixBlock = fixer ? "修正が完了してから修正できます"
        : pending.length ? "レビューが完了してから修正できます" : null;
      for (const agent of ["claude", "codex"]) {
        actions.appendChild(el("button", {
          class: "small",
          text: NAMES[agent] + " に修正依頼",
          ...(fixBlock ? { disabled: "", title: fixBlock } : {}),
          onclick: () => poolAction("/api/pool/" + p.id + "/fix", "POST", { agent }, NAMES[agent] + " が修正を開始しました（完了後、自動で再レビュー）"),
        }));
      }
    }
    if (p.status !== "approved")
      actions.appendChild(el("button", { class: "small", text: "承認", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "approved" }) }));
    if (p.status !== "rejected")
      actions.appendChild(el("button", { class: "small", text: "差し戻し", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "rejected" }) }));
    actions.appendChild(el("button", {
      class: "small",
      text: "コピー",
      onclick: async () => {
        if (p.body) return copy(p.body);
        if (p.file && isTextExt(p.file)) {
          const r = await fetch("/api/pool/file/" + encodeURIComponent(p.file));
          return copy(await r.text());
        }
        copy("u2a2a/pool/" + (p.file || ""));
      },
    }));
    actions.appendChild(el("button", {
      class: "small",
      text: "削除",
      ...(fixer || pending.length ? { disabled: "", title: "修正・レビューが完了してから削除できます" } : {}),
      onclick: (e) => armedDelete(e.target, () => poolAction("/api/pool/" + p.id, "DELETE", undefined, ".trash へ退避しました")),
    }));
    kids.push(actions);
    for (const k of kids) box.appendChild(k);
  }
}

          .then(() => toast(NAMES[agent] + " の中断セッションを再開設定しました"));
      },
    });

    resumeBtn.remove();
  }

  if (a.model && ![...dl.options].some((o) => o.value === a.model)) {
    dl.appendChild(el("option", { value: a.model }));
  }

    status.dataset.s = "running";
    status.textContent = "応答中…";

    status.dataset.s = "error";

    status.dataset.s = "";
    status.textContent = a.auto ? "CLI 自動応答" : "手動（貼り付け）";
    status.title = "";

}

// スレッド枠の状態発光。実行中 > エラー > 対応待ち（上限停止・中断・手動対応待ち）> 正常完了
function applyThreadGlow(agent, a, ta) {
  const col = document.querySelector('.thread-col[data-agent="' + agent + '"]');
  const topic = currentTopic();
  if (!col || !topic) return;
  const msgs = state.messages.filter((m) => m.thread === agent && m.topicId === topic.id);
  const last = msgs[msgs.length - 1];
  // 相手（ユーザー・他スレッド）からの発言に未応答のままか
  const unseen = msgs.some((m) => m.author !== agent && m.ts > (ta.lastSeenTs || 0));
  let glow = "";
  if (isRunning(agent)) glow = "run";
  else if ((topic.relay || {}).active) glow = "relay"; // 質疑リレー中は流線と律動を揃えて明滅
  else if (a.lastError) glow = "err";
  else if ((state.budgetHalt && a.auto) || ta.interruptedSessionId || (last && last.cancelled)) glow = "wait";
  else if (unseen && !a.auto) glow = "wait";
  else if (last && last.author === agent && last.meta && last.meta.status === "completed") glow = "ok";
  col.dataset.glow = glow;
}

function renderThread(agent) {
  const box = $("#messages-" + agent);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const topic = currentTopic();
  const msgs = state.messages.filter((m) => m.thread === agent && topic && m.topicId === topic.id);
  $("#count-" + agent).textContent = msgs.length ? msgs.length + " 件" : "";
  box.replaceChildren();
  if (!msgs.length) {
    if (isRunning(agent)) {
      const act = threadActivity(agent);
      box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
    } else {
      box.appendChild(el("div", { class: "empty", text: "まだメッセージがありません" }));
    }
    return;
  }
  for (const m of msgs) {
    const meta = el("div", { class: "meta" }, [
      el("span", { class: "who", text: NAMES[m.author] }),
      el("span", { text: fmtTime(m.ts) }),
    ]);
    const pv = provOf(m);
    if (pv.source)
      meta.appendChild(el("span", {
        text: pv.delivery === "handoff"
          ? "（" + NAMES[pv.source.agent] + " から引き継ぎ）"
          : "（" + NAMES[pv.source.agent] + "スレッドから転送）",
      }));
    if (m.taskId) meta.appendChild(el("span", { text: "（タスク結果）" }));
    if (m.test) meta.appendChild(el("span", { text: "（🧪テスト）" }));
    if (pv.trigger === "auto" && !m.cancelled && !m.budget) meta.appendChild(el("span", { text: "（自動応答）" }));
    if (pv.delivery === "qa-relay") meta.appendChild(el("span", { text: "（質疑）" }));
    if (pv.ingress === "cli-sync") meta.appendChild(el("span", { text: "（外部セッションから同期）" }));
    if (m.cancelled) meta.appendChild(el("span", { text: "（キャンセル）" }));

    const isRaw = rawView.has(m.id);
    const actions = el("div", { class: "actions" }, [
      el("button", {
        class: "small", text: "⋯", title: "コンテキストメニュー",
        onclick: (e) => {
          e.stopPropagation();
          const r = e.target.getBoundingClientRect();
          openCtxMenu(r.left, r.bottom + 2, ctxItems({ type: "message", m }));
        },
      }),
      el("button", { class: "small", text: "タスク化", onclick: () => openTaskDialog(agent, m) }),
      el("button", {
        class: "small",
        text: NAMES[OTHER[agent]] + " へ転送",
        onclick: () => relay(agent, m),
      }),
      el("button", { class: "small", text: "コピー", onclick: () => copy(m.text) }),
      el("button", { class: "small", text: "プールへ", onclick: () => openPoolDialog(m.author, m.text, m.id) }),
      el("button", {
        class: "small",
        text: isRaw ? "MD表示" : "生表示",
        onclick: () => {
          rawView.has(m.id) ? rawView.delete(m.id) : rawView.add(m.id);
          renderThread(agent);
        },
      }),
    ]);

    // 転送・質疑中継で届いた内容は送信元に原文があるため、受信側では折りたたみ表示
    let body;
    if (isRelayCopy(m) && !expandedRelays.has(m.id)) {
      body = el("div", {
        class: "relay-collapsed",
        text: (pv.delivery === "handoff" ? "🤝 " + NAMES[pv.source.agent] + " からの引き継ぎ" : "📨 " + NAMES[pv.source.agent] + " 側からの送信テキスト") + "（" + m.text.length + " 文字）— クリックで展開",
        onclick: () => {
          expandedRelays.add(m.id);
          renderThread(agent);
        },
      });
    } else {
      body = el("div", { class: "mdview" + (isRaw ? " raw" : "") });
      if (isRaw) body.textContent = m.text;
      else body.innerHTML = renderMarkdown(m.text, { author: m.author });
      if (isRelayCopy(m)) {
        meta.appendChild(el("span", {
          class: "relay-fold",
          text: "（折りたたむ）",
          onclick: () => {
            expandedRelays.delete(m.id);
            renderThread(agent);
          },
        }));
      }
    }

    const kids = [meta, body];
    // 本文中の pool パスを検出し、画像はインライン・その他はリンクで自動プレビュー
    if (!(isRelayCopy(m) && !expandedRelays.has(m.id))) {
      const paths = [...new Set(m.text.match(/u2a2a\/pool\/[^\s)"'`」()）]+/g) || [])].slice(0, 4);
      const mediaKids = [];
      for (const full of paths) {
        const rel = full.slice("u2a2a/pool/".length);
        // Markdown 記法で既に本文中に埋め込まれているものは重複させない
        if (new RegExp("\\]\\([^)]*" + rel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\)").test(m.text)) continue;
        const url = "/api/pool/file/" + encodeURI(rel);
        if (mediaFailed.has(rel)) {
          mediaKids.push(el("span", { class: "pf-size", text: "⚠ ファイルが見つかりません: " + full }));
        } else if (isImageExt(rel)) {
          const img = el("img", { src: url, alt: rel, loading: "lazy" });
          img.addEventListener("error", () => { mediaFailed.add(rel); renderThread(agent); });
          mediaKids.push(img);
        } else if (isVideoExt(rel)) {
          const v = el("video", { src: url, controls: "", preload: "metadata", style: "max-width:100%;max-height:260px;border-radius:6px;" });
          v.addEventListener("error", () => { mediaFailed.add(rel); renderThread(agent); });
          mediaKids.push(v);
        } else if (isAudioExt(rel)) {
          const au = el("audio", { src: url, controls: "", preload: "metadata", style: "width:100%;" });
          au.addEventListener("error", () => { mediaFailed.add(rel); renderThread(agent); });
          mediaKids.push(au);
        } else {
          mediaKids.push(el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 " + full }));
        }
      }
      if (mediaKids.length) kids.push(el("div", { class: "msg-media" }, mediaKids));
    }
    if (m.meta && !(isRelayCopy(m) && !expandedRelays.has(m.id))) kids.push(metaEl(m.meta));
    kids.push(actions);
    box.appendChild(el("div", { class: "msg" + (pv.ingress === "cli-sync" ? " external" : ""), "data-author": m.author, "data-mid": m.id }, kids));
  }
  if (isRunning(agent)) {
    const act = threadActivity(agent);
    box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function taskPrompt(t) {
  return [
    "【U2A2A タスク】" + t.title,
    t.detail ? "\n" + t.detail : "",
    "\n\n完了したら結果テキストを U2A2A アプリのタスク「" + t.title + "」に再入力してください。",
  ].join("");
}

// タスクキューの開閉。null = 自動（未完了タスクがあれば開く）
const taskZoneOpen = { claude: null, codex: null };

function renderTasks(agent) {
  const box = $("#tasks-" + agent);
  const head = $("#tasks-head-" + agent);
  box.replaceChildren();
  const topic = currentTopic();
  const tasks = state.tasks.filter((t) => t.agent === agent && topic && (t.topicId === topic.id || !t.topicId));
  const active = tasks.filter((t) => t.status !== "done").length;
  const open = taskZoneOpen[agent] != null ? taskZoneOpen[agent] : active > 0;
  head.textContent =
    (open ? "▾ " : "▸ ") + agent.toUpperCase() + " タスクキュー" +
    (tasks.length ? `（${active} 件${tasks.length - active ? " / 完了 " + (tasks.length - active) : ""}）` : "（なし）") +
    " — " + NAMES[agent] + " アプリ内で作業";
  head.onclick = () => {
    taskZoneOpen[agent] = !open;
    renderTasks(agent);
  };
  box.hidden = !open;
  if (!open) return;
  if (!tasks.length) {
    box.appendChild(el("div", { class: "empty", text: "タスクなし" }));
    return;
  }
  for (const t of tasks) {
    const actions = el("div", { class: "actions" });
    actions.appendChild(el("button", { class: "small", text: "プロンプトをコピー", onclick: () => copy(taskPrompt(t)) }));
    if (t.status === "queued")
      actions.appendChild(el("button", { class: "small", text: "作業開始", onclick: () => patchTask(t.id, "working") }));
    if (t.status === "queued" || t.status === "working")
      actions.appendChild(el("button", { class: "small", text: "結果を入力", onclick: () => openResultDialog(t) }));
    if (t.status === "returned")
      actions.appendChild(el("button", { class: "small", text: "完了にする", onclick: () => patchTask(t.id, "done") }));
    if (t.result)
      actions.appendChild(el("button", {
        class: "small",
        text: "プールへ",
        onclick: () => openPoolDialog(t.agent, t.result, null, t.title),
      }));
    actions.appendChild(el("button", { class: "small", text: "削除", onclick: (e) => armedDelete(e.target, () => delTask(t)) }));

    const kids = [
      el("div", { class: "t-head" }, [
        el("span", { class: "status", "data-s": t.status, text: STATUS_LABEL[t.status] }),
        el("span", { class: "t-title", text: t.title }),
      ]),
    ];
    if (t.detail) kids.push(el("div", { class: "t-detail", text: t.detail }));
    if (t.result) kids.push(el("div", { class: "t-result", text: "結果: " + t.result }));
    kids.push(actions);
    box.appendChild(el("div", { class: "task" }, kids));
  }
}

function armedDelete(btn, action) {

    action();
    return;

  btn.dataset.armed = "1";
  const orig = btn.textContent;
  btn.textContent = "本当に削除？";

    btn.classList.remove("danger");
  }, 2500);
}

async function fileToBase64(f) {
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function closeCtxMenu() {

}

function openCtxMenu(x, y, items) {
  if (!items || !items.length) return;
  ctxMenuEl.replaceChildren();
  for (const [label, action] of items) {
    ctxMenuEl.appendChild(el("button", {
      class: "ctx-item",
      text: label,
      onclick: () => {
        closeCtxMenu();
        action();

    }));
  }
  ctxMenuEl.hidden = false;

  ctxMenuEl.style.left = "0px";
  ctxMenuEl.style.top = "0px";
  const r = ctxMenuEl.getBoundingClientRect();

// 対象ごとの操作 allowlist（対象外はブラウザ標準メニューを維持）
function ctxItems(t) {
  if (t.type === "run") {
    return [["⏹ 実行を中断", () => api("/api/runs/" + t.runId + "/cancel", "POST", {}).then(() => toast("停止を要求しました"))]];
  }
  if (t.type === "message") {
    const m = t.m;
    return [
      ["コピー", () => copy(m.text)],
      ["引用して入力欄へ", () => quoteToInput(m.text)],
      ["タスク化", () => openTaskDialog(m.thread, m)],
      ["🤝 " + NAMES[OTHER[m.thread]] + " へ引き継ぎ", () =>
        api("/api/handoff", "POST", { messageId: m.id })
          .then(() => toast(NAMES[OTHER[m.thread]] + " へ引き継ぎました（相手が作業を引き取ります）")),
      ],
      ["🌿 ここから分岐", () => openProjectChoice("branch", (state.topics || []).find((topic) => topic.id === m.topicId), m.id)],
      ["✍ " + NAMES[m.thread] + " の発言を手動追加", () => showAgentInput(m.thread)],
    ];
  }
  if (t.type === "thread") {
    return [["✍ " + NAMES[t.agent] + " の発言を手動追加（貼り付け）", () => showAgentInput(t.agent)]];
  }
  if (t.type === "poolfile") {
    const p = t.p;
    const dir = parentDirOf(p.file);
    const items = [
      ["⧉ コピー", () => { poolClipboard = { path: p.file, isDir: false }; renderClipBar(); toast("コピー: " + p.file); }],
    ];
    if (poolClipboard)
      items.push(["📋 ここへ貼り付け（" + (dir || "ルート") + "）", () => api("/api/pool/copy", "POST", { src: poolClipboard.path, destDir: dir }).then((r) => toast("複製: " + r.dest))]);
    items.push(["パスを入力欄へ挿入", () => insertToInput("u2a2a/pool/" + p.file)]);
    items.push(["Claude にレビュー依頼", () => poolAction("/api/pool/" + p.id + "/review", "POST", { reviewer: "claude" })]);
    items.push(["Codex にレビュー依頼", () => poolAction("/api/pool/" + p.id + "/review", "POST", { reviewer: "codex" })]);
    return items;
  }
  if (t.type === "pooldir") {
    const items = [
      ["⧉ フォルダをコピー", () => { poolClipboard = { path: t.dir, isDir: true }; renderClipBar(); toast("コピー: " + t.dir + "/"); }],
    ];
    if (poolClipboard)
      items.push(["📋 このフォルダへ貼り付け", () => api("/api/pool/copy", "POST", { src: poolClipboard.path, destDir: t.dir }).then((r) => toast("複製: " + r.dest))]);
    items.push(["パスを入力欄へ挿入", () => insertToInput("u2a2a/pool/" + t.dir + "/")]);
    return items;
  }
  if (t.type === "topic") {
    const topic = (state.topics || []).find((x) => x.id === t.id);
    if (!topic) return [];
    return [
      ["📌 要約を更新", () => api("/api/topics/" + topic.id + "/summarize", "POST", {}).then(() => toast("要約を生成中…"))],
      ["履歴をコピー", async () => {
        if (!topic.mirrorFile) return;
        const r = await fetch("/api/pool/file/" + encodeURIComponent(topic.mirrorFile));
        copy(await r.text());
      }],
      ["名前を変更", () => { renamingTopicId = topic.id; renderTopicBar(); }],
      ["質疑リレーを停止", () => api("/api/qa/stop", "POST", { topicId: topic.id })],
    ];
  }
  return [];
}

function resolveCtxTarget(elx) {
  if (!elx || !elx.closest) return null;
  const act = elx.closest(".activity[data-runid]");
  if (act && act.dataset.runid) {
    const run = (state.runs || []).find((r) => r.runId === act.dataset.runid);
    if (run && run.kind === "thread") return { type: "run", runId: run.runId };
  }
  const msg = elx.closest(".msg[data-mid]");
  if (msg) {
    const m = state.messages.find((x) => x.id === msg.dataset.mid);
    if (m) return { type: "message", m };
  }
  const row = elx.closest(".pf-row");
  if (row) {
    if (row.dataset.topic) return { type: "topic", id: row.dataset.topic };
    if (row.dataset.dir) return { type: "pooldir", dir: row.dataset.dir };
    if (row.dataset.file) {
      const p = (state.pool || []).find((x) => x.file === row.dataset.file);
      if (p) return { type: "poolfile", p };
    }
  }
  const tab = elx.closest(".topic-tab[data-topic]");
  if (tab) return { type: "topic", id: tab.dataset.topic };
  const detail = elx.closest("#pool-detail");
  if (detail) {
    if (typeof poolSelectedId === "string" && poolSelectedId.startsWith("topic:"))
      return { type: "topic", id: poolSelectedId.slice(6) };
    const p = (state.pool || []).find((x) => x.id === poolSelectedId);
    if (p) return { type: "poolfile", p };
  }
  // スレッド列の残り領域（入力欄内はブラウザ標準のコピー/ペーストメニューを維持）
  if (!elx.closest("input, textarea")) {
    const col = elx.closest(".thread-col[data-agent]");
    if (col) return { type: "thread", agent: col.dataset.agent };
  }
  return null;
}

document.addEventListener("contextmenu", (e) => {
  const t = resolveCtxTarget(e.target);
  if (!t) return; // 対象外はブラウザ標準メニュー
  const items = ctxItems(t);
  if (!items.length) return;
  e.preventDefault();
  openCtxMenu(e.clientX, e.clientY, items);
});
document.addEventListener("keydown", (e) => {

    const t = resolveCtxTarget(document.activeElement);
    if (!t) return;
    const items = ctxItems(t);
    if (!items.length) return;
    e.preventDefault();
    const r = document.activeElement.getBoundingClientRect();
    openCtxMenu(r.left + 8, r.bottom + 2, items);
  }
  if (e.key === "Escape") closeCtxMenu();
});

    if (v === cur) return;
    api("/api/agents/" + agent, "PATCH", { model: v })
      .then(() => toast(v ? "モデルを " + v + " に設定しました" : "モデルを CLI 既定に戻しました"));
  };
  modelInput.addEventListener("change", () => commitModel());
  modelInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { commitModel(); modelInput.blur(); } });
  // クリックでモデル一覧メニューを表示（datalist は環境によって候補が出ないため）
  modelInput.addEventListener("click", async (e) => {
    e.stopPropagation();
    const models = await api("/api/models");
    const cur = ((state.agents || {})[agent] || {}).modelOverride || "";
    const mark = (v) => (v === cur ? "✓ " : "　");
    const items = [[mark("") + "CLI 既定", () => { modelInput.value = ""; commitModel(""); }]];
    for (const name of models[agent] || []) {
      items.push([mark(name) + name, () => { modelInput.value = name; commitModel(name); }]);
    }
    items.push(["✏ 手入力（このまま入力して Enter）", () => modelInput.focus()]);
    const r = modelInput.getBoundingClientRect();
    openCtxMenu(r.left, r.bottom + 4, items);
  });
}
for (const btn of document.querySelectorAll("[data-agent-send]")) {
  const agent = btn.getAttribute("data-agent-send");
  btn.addEventListener("click", () => sendAgent(agent));
  $("#input-" + agent).addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendAgent(agent);
    if (e.key === "Escape") hideAgentInput(agent);
  });
}

// ---- live sync ----
const es = new EventSource("/api/events");
es.onmessage = (e) => {
  state = JSON.parse(e.data);
  render();
};
render();
</script>
</body>
</html>
