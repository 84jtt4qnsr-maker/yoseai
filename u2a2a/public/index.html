<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U2A2A Orchestration</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c232e;
    --line: #2a3341;
    --text: #dce3ec;
    --dim: #8a96a6;
    --user: #7bd88f;
    --claude: #ffab5e;
    --codex: #6fd7ff;
    --grok: #b99aff;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  header {
    flex-wrap: wrap;
    padding: 6px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--dim); font-size: 12px; }

  /* トピックタブバー */
  #topic-bar {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 5px 14px 0;
    background: var(--panel);
    overflow-x: auto;
    flex: none;
  }
  .topic-tab {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
    background: var(--bg);
    user-select: none;
  }
  .topic-tab.active { color: var(--text); background: var(--panel-2); font-weight: 600; }
  /* 実行中トピックの緑パルスドット（別トピックの活動もタブで分かる） */
  .topic-tab .run-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--user); animation: dot-pulse 1.6s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.35; box-shadow: 0 0 0 0 rgba(123, 216, 143, 0); }
    50% { opacity: 1; box-shadow: 0 0 6px 1px rgba(123, 216, 143, 0.4); }
  }
  .topic-tab .t-btn {
    border: none;
    background: none;
    color: var(--dim);
    cursor: pointer;
    padding: 0 2px;
    font-size: 11px;
  }
  .topic-tab .t-btn:hover { color: var(--text); }
  .topic-tab input {
    padding: 0 4px;
    font-size: 12px;
    width: 110px;
    border-radius: 4px;
  }
  #topic-add {
    border: 1px dashed var(--line);
    background: none;
    border-radius: 8px 8px 0 0;
    padding: 4px 10px;
    font-size: 12.5px;
    color: var(--dim);
  }

  /* ユーザー帯（Canvas 上段・緑） */
  #user-band {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-band .role-dot { background: var(--user); }
  #user-band textarea {
    flex: 1;
    min-height: 38px;
    max-height: 140px;
    resize: vertical;
  }
  #qa-hops { width: 64px; }
  #qa-bar[hidden] { display: none; }
  #budget-bar[hidden] { display: none; }
  #budget-bar {
    border-bottom: 1px solid #ff7b7b55;
    background: #2a1518;
    color: var(--danger);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
  }
  #qa-bar {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    color: var(--codex);
  }
  .role-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; flex: none;
    align-self: center;
  }
  textarea, select, input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: 1px solid var(--dim); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--dim); }
  button.small { padding: 2px 8px; font-size: 11.5px; color: var(--dim); border-radius: 6px; }
  button.small:hover { color: var(--text); }

  /* 左=会話系（スレッド2列） / 右=共有タスクプール */
  #content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  body.pool-collapsed #content { grid-template-columns: 1fr auto; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 0;
    min-width: 0;
    position: relative;
  }
  /* 転送ペア（原文⇄折りたたみ）をつなぐ対応線 */
  #link-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: visible;
  }
  #link-layer path {
    stroke: rgba(123, 216, 143, 0.55);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 7 5;
    stroke-linecap: round;
    animation: relay-flow 0.8s linear infinite;
  }
  /* 破線が送り元 → 受け取り側へ流れる（パスは常に送り元始点で描かれる） */
  @keyframes relay-flow {
    to { stroke-dashoffset: -12; }
  }
  #link-layer circle { fill: rgba(123, 216, 143, 0.7); }
  .thread-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .thread-col + .thread-col { border-left: 1px solid var(--line); }
  .thread-head {
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 4px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .thread-head .count { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .thread-head .auto-ctl {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .thread-head .auto-ctl input { accent-color: var(--user); }
  .agent-status { font-size: 11.5px; margin-left: 10px; font-weight: 400; }
  .model-chip {
    font-size: 11px;
    font-weight: 400;
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 10px;
    width: 92px;
    transition: width 0.15s;
  }
  .model-chip::placeholder { color: var(--dim); }
  .model-chip:focus { outline: 1px solid var(--dim); width: 180px; }
  .agent-status[data-s="running"] { color: var(--codex); }
  .agent-status[data-s="error"] { color: var(--danger); cursor: help; }
  .typing {
    color: var(--dim);
    font-size: 12.5px;
    padding: 2px 4px;
  }
  /* CLI 実況 */
  .activity {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--dim);
    margin-top: 6px;
  }
  .activity .a-head { display: flex; gap: 8px; align-items: baseline; }
  .activity .a-label { color: var(--codex); font-weight: 600; }
  .activity .elapsed { font-family: ui-monospace, monospace; }
  .activity .a-step { color: var(--text); margin-top: 2px; }
  .activity .a-log { margin-top: 2px; opacity: 0.65; font-size: 11px; }
  .typing::after {
    content: "…";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    transition: box-shadow 0.8s ease;
  }
  /* 状態発光: 実行中=淡緑の呼吸グラデ、正常完了=青、対応待ち=黄、エラー等=赤（1pxリング＋内側グラデ）*/
  .thread-col[data-glow="run"] .messages { animation: glow-breath 2.6s ease-in-out infinite; }
  @keyframes glow-breath {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.22), inset 0 0 10px rgba(123, 216, 143, 0.08), inset 0 0 34px rgba(123, 216, 143, 0.04); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.75), inset 0 0 22px rgba(123, 216, 143, 0.35), inset 0 0 64px rgba(123, 216, 143, 0.12); }
  }
  .thread-col[data-glow="ok"] .messages { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.55), inset 0 0 16px rgba(110, 168, 254, 0.28), inset 0 0 48px rgba(110, 168, 254, 0.08); }
  .thread-col[data-glow="wait"] .messages { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0.55), inset 0 0 16px rgba(231, 200, 107, 0.28), inset 0 0 48px rgba(231, 200, 107, 0.08); }
  .thread-col[data-glow="err"] .messages { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0.6), inset 0 0 16px rgba(255, 123, 123, 0.3), inset 0 0 48px rgba(255, 123, 123, 0.1); }
  /* 質疑リレー中: 流線（relay-flow 0.8s）の2倍周期・同色で枠を明滅させ、光の律動を揃える */
  .thread-col[data-glow="relay"] .messages { animation: relay-pulse 1.6s linear infinite; }
  @keyframes relay-pulse {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.5), inset 0 0 12px rgba(123, 216, 143, 0.16); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.18), inset 0 0 12px rgba(123, 216, 143, 0.05); }
  }
  /* プール側も同じ発光言語: レビュー/修正の実行中は緑の呼吸、判定確定時は色を一瞬点灯して減衰 */
  .pf-row.glow-run { animation: row-breath 2.6s ease-in-out infinite; border-radius: 6px; }
  @keyframes row-breath {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.10); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.55), inset 0 0 10px rgba(123, 216, 143, 0.16); }
  }
  #pool-detail { transition: box-shadow 0.8s ease; }
  #pool-detail[data-glow="run"] { animation: glow-breath 2.6s ease-in-out infinite; }
  #pool-detail[data-flash="ok"] { animation: flash-ok 2.2s ease-out 1; }
  #pool-detail[data-flash="wait"] { animation: flash-wait 2.2s ease-out 1; }
  #pool-detail[data-flash="err"] { animation: flash-err 2.2s ease-out 1; }
  @keyframes flash-ok {
    0% { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.85), inset 0 0 24px rgba(110, 168, 254, 0.45), inset 0 0 64px rgba(110, 168, 254, 0.14); }
    100% { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0), inset 0 0 24px rgba(110, 168, 254, 0), inset 0 0 64px rgba(110, 168, 254, 0); }
  }
  @keyframes flash-wait {
    0% { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0.85), inset 0 0 24px rgba(231, 200, 107, 0.45), inset 0 0 64px rgba(231, 200, 107, 0.14); }
    100% { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0), inset 0 0 24px rgba(231, 200, 107, 0), inset 0 0 64px rgba(231, 200, 107, 0); }
  }
  @keyframes flash-err {
    0% { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0.9), inset 0 0 24px rgba(255, 123, 123, 0.5), inset 0 0 64px rgba(255, 123, 123, 0.16); }
    100% { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0), inset 0 0 24px rgba(255, 123, 123, 0), inset 0 0 64px rgba(255, 123, 123, 0); }
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 8px;
    padding: 6px 11px;
    position: relative;
  }
  .msg[data-author="user"] { border-left-color: var(--user); }
  .msg[data-author="claude"] { border-left-color: var(--claude); }
  .msg[data-author="codex"] { border-left-color: var(--codex); }
  .msg.external { border-style: dashed; border-left-style: solid; }
  .relay-collapsed {
    color: var(--dim);
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  .relay-collapsed:hover { color: var(--text); }
  .relay-fold { cursor: pointer; }
  .relay-fold:hover { color: var(--text); }
  .msg .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .msg .meta .who { font-weight: 600; }
  .msg[data-author="user"] .who { color: var(--user); }
  .msg[data-author="claude"] .who { color: var(--claude); }
  .msg[data-author="codex"] .who { color: var(--codex); }
  .mdview { word-break: break-word; overflow-x: auto; }
  .mdview.raw { white-space: pre-wrap; }
  .mdview p { margin: 0.35em 0; }
  .mdview h1, .mdview h2, .mdview h3, .mdview h4 {
    margin: 0.6em 0 0.3em;
    font-size: 1.05em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .mdview h1 { font-size: 1.15em; }
  .mdview h2 { font-size: 1.1em; }
  .mdview ul, .mdview ol { margin: 0.35em 0; padding-left: 1.5em; }
  .mdview li { margin: 0.15em 0; }
  .mdview code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.92em;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
  .mdview pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0.4em 0;
  }
  .mdview pre code { background: none; border: none; padding: 0; }
  .mdview blockquote {
    margin: 0.4em 0;
    padding: 2px 10px;
    border-left: 3px solid var(--dim);
    color: var(--dim);
  }
  .mdview table {
    border-collapse: collapse;
    margin: 0.4em 0;
    font-size: 0.95em;
  }
  .mdview th, .mdview td {
    border: 1px solid var(--line);
    padding: 3px 9px;
    text-align: left;
  }
  .mdview th { background: var(--panel-2); }
  .mdview a { color: var(--codex); }
  .mdview img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin: 4px 0; }
  .cb-bar {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    margin: 6px 0 2px;
  }
  .cb-svg {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    max-width: 100%;
    max-height: 280px;
    display: block;
    margin: 6px 0 0;
  }
  .msg-meta {
    margin-top: 5px;
    font-size: 10.5px;
    color: var(--dim);
    font-family: ui-monospace, "SF Mono", monospace;
    border-top: 1px solid var(--line);
    padding-top: 3px;
  }
  .r-head .msg-meta { border: none; margin: 0; padding: 0; margin-left: auto; }
  .msg-media { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .msg-media img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid var(--line); }
  .msg-media a {
    color: var(--codex);
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
    text-decoration: none;
    word-break: break-all;
  }
  .msg-media a:hover { text-decoration: underline; }
  .mdview hr { border: none; border-top: 1px solid var(--line); margin: 0.6em 0; }
  /* メッセージのアクションはホバー時のみ右上にオーバーレイ表示（縦の圧迫を防ぐ） */
  .msg .actions {
    display: none;
    position: absolute;
    top: 4px;
    right: 6px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 5px;
    z-index: 2;
  }
  .msg:hover .actions, .msg:focus-within .actions { display: flex; }
  .empty { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 24px; }

  /* エージェント返答入力 */
  /* 手動貼り付け欄は普段使わないため既定は非表示（スレッドの右クリック→手動で発言を追加）*/
  .agent-input[hidden] { display: none; }
  .agent-input {
    border-top: 1px solid var(--line);
    padding: 7px 14px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
  }
  .agent-input textarea { flex: 1; min-height: 32px; max-height: 120px; resize: vertical; }

  /* タスクキュー（Canvas 下段）: 折りたたみ式 */
  .task-zone {
    border-top: 1px solid var(--line);
    padding: 4px 16px 8px;
    max-height: 30vh;
    overflow-y: auto;
    flex: none;
  }
  .task-zone h2 {
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 4px 0 6px;
    cursor: pointer;
    user-select: none;
  }
  .task-zone h2:hover { color: var(--text); }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
  }
  .task .t-head { display: flex; gap: 8px; align-items: center; }
  .task .t-title { font-weight: 600; flex: 1; word-break: break-word; }
  .task .t-detail { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .task .t-result { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .task .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .status {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .status[data-s="queued"]   { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="working"]  { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="returned"] { color: var(--claude); border-color: #ffab5e55; }
  .status[data-s="done"]     { color: var(--user); border-color: #7bd88f55; }

  /* 共有タスクプール（右半分・縦フル） */
  #pool-zone {
    border-left: 2px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  body.pool-collapsed #pool-zone .sub { display: none; }
  #pool-head {
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
    row-gap: 4px;
    flex: none;
  }
  #pool-head .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  #pool-head button { margin-left: auto; }
  /* ファイルビューワー: 左リスト + 右詳細 */
  #pool-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #pool-list-wrap {
    width: 270px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    padding: 4px 6px 0;
    min-height: 0;
  }
  #pool-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  body.pool-collapsed #pool-list-wrap { border-right: none; }
  body.pool-collapsed #pool-detail { display: none; }
  #pool-tools { display: flex; gap: 4px; align-items: center; margin-bottom: 2px; }
  #pool-search {
    flex: 1;
    min-width: 0;
    padding: 4px 10px;
    font-size: 12.5px;
    border-radius: 6px;
  }
  #pool-clip { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); padding: 1px 8px 3px; }
  #pool-clip[hidden] { display: none; }
  #pool-clip #pool-clip-name {
    font-family: ui-monospace, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  .pf-row.dragover { background: var(--panel-2); outline: 1px solid var(--user); }
  #pool-list.dragover { outline: 1px dashed var(--user); outline-offset: -2px; border-radius: 6px; }
  #pool-create-row { display: flex; gap: 4px; align-items: center; margin: 2px 0 4px; }
  #pool-create-row[hidden] { display: none; }
  #pool-create-row input { flex: 1; min-width: 0; padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  button.small.danger { color: var(--danger); border-color: #ff7b7b55; }
  #pool-cwd {
    font-size: 10.5px;
    color: var(--dim);
    font-family: ui-monospace, monospace;
    padding: 1px 8px 3px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #pool-cwd:hover { color: var(--text); }
  .pf-row.folder .pf-name { font-family: inherit; color: var(--dim); font-weight: 600; }
  .pf-row.folder.cwd .pf-name { color: var(--user); }
  .pf-row .chev { flex: none; width: 10px; color: var(--dim); font-size: 10px; }
  .pf-row {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .pf-row:hover { background: var(--panel-2); }
  .pf-row.sel { background: var(--panel-2); outline: 1px solid var(--line); }
  .pf-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .pf-dot[data-s="submitted"] { background: #d8c56f; }
  .pf-dot[data-s="reviewing"] { background: var(--codex); }
  .pf-dot[data-s="approved"] { background: var(--user); }
  .pf-dot[data-s="rejected"] { background: var(--danger); }
  .pf-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
  }
  .pf-size { color: var(--dim); font-size: 10.5px; flex: none; }
  #pool-detail {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 10px 14px 14px;
  }
  #pool-detail .p-body { max-height: none; }
  /* 狭い画面では従来の上下配置に戻す */
  @media (max-width: 1100px) {
    #content { display: flex; flex-direction: column; }
    #pool-widen { display: none; } /* 縦積みでは幅比が効かないため列の「広げる」と同様に隠す */
    main { flex: 1; }
    #pool-zone { border-left: none; border-top: 2px solid var(--line); flex: none; max-height: 40vh; }
    #pool-list-wrap { width: 210px; }
    #pool-detail .p-body { max-height: 180px; }
  }
  .p-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .p-title { font-weight: 600; flex: 1; min-width: 120px; word-break: break-word; }
  .origin {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .origin[data-o="user"] { color: var(--user); border-color: #7bd88f55; }
  .origin[data-o="claude"] { color: var(--claude); border-color: #ffab5e55; }
  .origin[data-o="codex"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="submitted"] { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="reviewing"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="approved"] { color: var(--user); border-color: #7bd88f55; }
  .status[data-s="rejected"] { color: var(--danger); border-color: #ff7b7b55; }
  .p-file {
    margin-top: 5px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .p-file a { color: var(--codex); text-decoration: none; word-break: break-all; }
  .p-file a:hover { text-decoration: underline; }
  .p-file .p-size { color: var(--dim); flex: none; }
  .p-body {
    margin-top: 6px;
    overflow-y: auto;
    word-break: break-word;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .p-body:empty { display: none; }
  .p-body img { max-width: 100%; max-height: 340px; border-radius: 6px; }
  .review {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--panel);
  }
  .review .r-head {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .review .r-head:hover .reviewer { text-decoration: underline; }
  .review .r-head .chev { flex: none; }
  .review .r-body { margin-top: 4px; }
  .review .r-head .reviewer { font-weight: 600; }
  .review .r-head .reviewer[data-o="claude"] { color: var(--claude); }
  .review .r-head .reviewer[data-o="codex"] { color: var(--codex); }
  .verdict {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    flex: none;
  }
  .verdict[data-v="承認"] { color: var(--user); border-color: #7bd88f55; }
  .verdict[data-v="条件付き承認"] { color: #d8c56f; border-color: #d8c56f55; }
  .verdict[data-v="差し戻し"] { color: var(--danger); border-color: #ff7b7b55; }
  .review .r-body { max-height: 200px; overflow-y: auto; word-break: break-word; font-size: 13px; }

  /* 成果物の版履歴 */
  .p-history { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .history-head, .history-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .history-head { justify-content: space-between; }
  .history-note { margin: 8px 0; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .history-warning { color: #e7c86b; font-size: 12px; overflow-wrap: anywhere; }
  .history-list { list-style: none; margin: 8px 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .history-row { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .history-row strong { color: var(--text); }
  .history-row button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
  .history-diff-title { display: block; margin-top: 10px; font-size: 12px; }
  .history-diff { margin: 8px 0 0; padding: 8px; max-height: 320px; overflow: auto; white-space: pre; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  /* 行はブロック要素。横スクロール時も背景が行末まで届くよう内容幅に合わせて伸ばす */
  .diff-line { display: block; width: fit-content; min-width: 100%; }
  .diff-line:empty::before { content: " "; white-space: pre; }
  .history-diff .diff-add { color: #a0e5ad; background: #7bd88f15; }
  .history-diff .diff-remove { color: #ffabab; background: #ff7b7b15; }
  #pool-detail .review .r-head { flex-wrap: wrap; }
  .review-version { font-size: 11px; color: var(--dim); }
  #pool-detail .actions button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* コンテキストメニュー */
  #ctx-menu[hidden] { display: none; }
  #ctx-menu {
    position: fixed;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    min-width: 200px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 8px 24px #000a;
  }
  .ctx-item {
    background: none;
    border: none;
    text-align: left;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    white-space: nowrap;
  }
  .ctx-item:hover { background: var(--panel); border: none; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    width: min(520px, 92vw);
  }
  dialog::backdrop { background: #0009; }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog .field { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  dialog label { font-size: 12px; color: var(--dim); }
  dialog input, dialog textarea { width: 100%; }
  dialog textarea { min-height: 90px; resize: vertical; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  /* プロジェクトの登録・対象選択 */
  #project-context { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
  #project-context[hidden], #project-stop[hidden], #project-topic-title-field[hidden] { display: none; }
  .project-chip { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .project-unregistered { color: var(--dim); }
  .project-hint, .project-probe { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .project-error, #project-stop { color: var(--danger); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #project-stop { padding: 7px 14px; border-bottom: 1px solid #ff7b7b55; }
  #projects-dialog { width: min(720px, 92vw); max-height: 85vh; overflow-y: auto; }
  #projects-list { max-height: 40vh; overflow-y: auto; margin: 10px 0; }
  .project-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .project-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .project-card-head input { flex: 1 1 150px; width: auto; min-width: 0; padding: 4px 8px; }
  .project-path { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; margin: 6px 0; }
  .project-details { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
  .project-details button { margin-left: 8px; }
  #projects-add-fields { border: 0; padding: 0; margin: 0; min-width: 0; }
  #project-choice-select { width: 100%; min-width: 0; }
  #projects-dialog button:disabled, #project-choice-dialog button:disabled { opacity: 0.45; cursor: not-allowed; }

  #toast {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--dim);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* 参加者列はDOMを保ち、折りたたみは表示だけを変更する。 */
  main { grid-template-columns: var(--thread-tracks, 1fr 1fr); }
  body.three-agents #content { grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); }
  body.three-agents.pool-collapsed #content { grid-template-columns: minmax(0, 1fr) auto; }
  /* プール拡幅（列の「広げる」と同じ流儀: 手動・折りたたみで解除・記憶はメモリのみ）。2名/3名共通で最後に勝つ */
  body.pool-widened:not(.pool-collapsed) #content { grid-template-columns: minmax(0, 1fr) minmax(300px, 2fr); }
  .thread-head { flex-wrap: wrap; }
  .widen-column { display: none; }
  body.three-agents .widen-column { display: inline-block; }
  .thread-col .thread-head .role-dot, .thread-rail .role-dot { background: var(--agent-color); }
  .thread-rail { flex: 1; display: flex; align-items: center; flex-direction: column; gap: 12px; border-radius: 0; padding: 10px 4px; min-height: 0; }
  .thread-rail[hidden] { display: none; }
  .rail-name, .rail-unread { writing-mode: vertical-rl; }
  .thread-col.is-folded > :not(.thread-rail) { display: none !important; }
  .thread-col.is-folded[data-glow="run"] .thread-rail { animation: glow-breath 2.6s ease-in-out infinite; }
  .thread-col.is-folded[data-glow="relay"] .thread-rail { animation: relay-pulse 1.6s linear infinite; }
  .thread-col.is-folded[data-glow="err"] .thread-rail { box-shadow: inset 0 0 16px #ff7b7b66; }
  .thread-col.is-folded[data-glow="wait"] .thread-rail { box-shadow: inset 0 0 16px #e7c86b66; }
  .thread-col.is-folded[data-glow="ok"] .thread-rail { box-shadow: inset 0 0 16px #6ea8fe66; }
  .msg[data-author="grok"] { border-left-color: var(--grok); }
  .msg[data-author="grok"] .who, .origin[data-o="grok"], .reviewer[data-o="grok"] { color: var(--grok); }
  #agent-access, #qa-participants { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #agent-access { padding: 4px 16px; font-size: 12px; }
  #agent-access:empty { display: none; }
  .agent-status[data-s="wait"] { color: #e7c86b; }
  #qa-participants { padding: 6px 16px; border-bottom: 1px solid var(--line); }
  #qa-participants[hidden], #topic-participants[hidden] { display: none; }
  .agent-choice { display: inline-flex; align-items: center; gap: 6px; margin: 4px 10px 4px 0; font-size: 12px; }
  .agent-choice input { width: auto; }
  #qa-status[data-reason="agreed"] { color: #7bd88f; }
  #qa-status[data-reason]:not([data-reason="agreed"]):not([data-reason=""]) { color: var(--danger); }
  .stopped-note { color: var(--danger); }
  @media (max-width: 1100px) {
    body.three-agents .widen-column { display: none; }
    body.three-agents main { display: flex; flex-direction: column; overflow-y: auto; }
    body.three-agents main .thread-col { flex: 1 0 260px; min-height: 260px; border-left: none; border-top: 1px solid var(--line); }
    body.three-agents main .thread-col.is-folded { flex: 0 0 44px; min-height: 44px; }
    body.three-agents .thread-rail { flex-direction: row; justify-content: flex-start; padding: 6px 12px; }
    body.three-agents .rail-name, body.three-agents .rail-unread { writing-mode: horizontal-tb; }
  }
  /* フロー表示。列の幅・プールの配分は既存の設定を保持する。 */
  #view-controls { position: sticky; right: 0; z-index: 8; background: var(--panel); margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; padding-bottom: 4px; }
  #view-controls button[aria-pressed="true"] { color: var(--text); border-color: var(--codex); background: var(--panel-2); }
  #flow-load-note { font-size: 11px; color: var(--dim); max-width: 220px; white-space: normal; }
  #flow-zone[hidden], #flow-new[hidden], #flow-empty[hidden], #flow-warnings[hidden], .flow-episode-body[hidden], .flow-detail[hidden] { display: none !important; }
  body.flow-view main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  body.flow-view main > .thread-col, body.flow-view #link-layer { display: none !important; }
  #flow-zone { grid-column: 1; grid-row: 1; min-height: 0; min-width: 0; width: 100%; overflow: auto; position: relative; overflow-anchor: none; }
  #flow-canvas { position: relative; min-height: 100%; padding: 18px; }
  #flow-links { position: absolute; top: 0; left: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .flow-edge { fill: none; stroke: var(--dim); stroke-width: 1.5; opacity: .65; }
  .flow-edge.is-dashed { stroke-dasharray: 5 5; }
  .flow-edge.is-gray { stroke: var(--dim); opacity: .4; }
  #flow-episodes { position: relative; }
  .flow-episode { position: relative; margin: 0 0 20px; padding: 0 0 0 12px; border-left: 2px solid var(--line); }
  .flow-episode.is-inferred { border-left-style: dashed; }
  .flow-episode-toggle { max-width: 100%; text-align: left; white-space: normal; overflow-wrap: anywhere; font-size: 12px; padding: 6px 10px; color: var(--dim); }
  .flow-episode-toggle:hover { color: var(--text); }
  .flow-episode-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 24px; padding-top: 12px; align-items: start; }
  .flow-origin, .flow-responses { min-width: 0; display: grid; gap: 18px; align-items: start; }
  .flow-responses { grid-template-columns: repeat(var(--flow-agents, 3), minmax(0, 1fr)); }
  .flow-card-slot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; align-items: start; }
  .flow-card-slot:has(> .flow-branches:not(:empty)) { grid-template-columns: minmax(0, 1fr) minmax(0, 30%); }
  .flow-branches:empty { display: none; }
  .flow-expanded { grid-column: 1 / -1; min-width: 0; }
  .flow-expanded:empty { display: none; }
  .flow-branches { position: relative; z-index: 1; align-self: start; padding-top: 8px; }
  .flow-card { position: relative; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; }
  .flow-card.is-inferred { border-style: dashed; }
  .flow-card-toggle { display: block; width: 100%; border: none; border-radius: 0; background: transparent; text-align: left; white-space: normal; overflow-wrap: anywhere; padding: 10px 12px; font-size: 13px; }
  .flow-card-toggle:hover { background: var(--panel-2); }
  .flow-card button:focus-visible, .flow-episode-toggle:focus-visible, #view-controls button:focus-visible { outline: 2px solid var(--codex); outline-offset: -2px; }
  .flow-badges, .flow-marks { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px; }
  .flow-badges:not(:empty), .flow-marks:not(:empty) { padding-bottom: 8px; }
  .flow-badge { font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
  .flow-terminal { font-size: 11px; color: var(--text); white-space: normal; }
  .flow-terminal.is-gray { color: var(--dim); }
  .flow-branch { display: block; width: 100%; margin-bottom: 6px; white-space: normal; overflow-wrap: anywhere; text-align: left; }
  .flow-detail { min-width: 0; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px; overflow-wrap: anywhere; }
  .flow-detail pre { max-width: 100%; overflow-x: auto; }
  .flow-message { margin-bottom: 12px; min-width: 0; position: relative; }
  .flow-message:last-child { margin-bottom: 0; }
  .flow-message-origin { color: var(--dim); font-size: 10px; overflow-wrap: anywhere; margin-bottom: 5px; }
  .flow-detail .msg { margin: 0; }
  .flow-detail .actions { flex-wrap: wrap; }
  .flow-detail .actions button { white-space: normal; }
  .flow-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #flow-empty, #flow-warnings { color: var(--dim); padding: 12px; position: relative; }
  #flow-new { position: absolute; bottom: 12px; right: 20px; z-index: 6; border-color: var(--codex); box-shadow: 0 2px 10px #0008; }
  .flow-card[data-glow="run"] { animation: glow-breath 2.6s ease-in-out infinite; }
  .flow-card[data-glow="ok"] { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.55), inset 0 0 16px rgba(110, 168, 254, 0.28), inset 0 0 48px rgba(110, 168, 254, 0.08); }
  .flow-card[data-glow="wait"] { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0.55), inset 0 0 16px rgba(231, 200, 107, 0.28), inset 0 0 48px rgba(231, 200, 107, 0.08); }
  .flow-card[data-glow="err"] { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0.6), inset 0 0 16px rgba(255, 123, 123, 0.3), inset 0 0 48px rgba(255, 123, 123, 0.1); }
  .flow-card.flow-highlight { outline: 2px solid var(--user); outline-offset: 2px; }
  @media (max-width: 1100px) {
    #flow-canvas { padding: 10px; }
    .flow-episode-body, .flow-responses { grid-template-columns: minmax(0, 1fr) !important; }
    .flow-responses > .flow-card-slot { grid-column: 1 !important; }
    .flow-card-slot:has(> .flow-branches:not(:empty)) { grid-template-columns: minmax(0, 1fr) minmax(80px, 25%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .flow-card[data-glow="run"] { animation: none; box-shadow: inset 0 0 0 1px var(--user); }
  }
</style>
</head>
<body>
<header>
  <h1>U2A2A Orchestration</h1>
  <span class="sub">ユーザー ⇄ 参加エージェント ／ やり取りから生まれたタスクを各アプリで作業し、結果を再入力する</span>
  <button id="budget-btn" class="small" style="margin-left:auto" title="実行の上限設定（コスト・回数・時間）">⚙ 上限</button>
  <button id="projects-btn" class="small">📁 プロジェクト</button>
  <button id="health-btn" class="small" title="運用イベント（失敗ログ）とストレージ計測">🩺</button>
</header>

<div id="agent-access" aria-live="polite"></div>

<!-- トピック（スレッド）タブ -->
<div id="topic-bar"></div>
<div id="project-context" hidden></div>
<div id="project-stop" role="status" hidden></div>

<!-- ユーザー側（閲覧・回答・質問） -->
<div id="user-band">
  <span class="role-dot" title="ユーザー"></span>
  <textarea id="user-text" placeholder="ユーザーとして発言（回答・質問）— Cmd+Enter で送信"></textarea>
  <select id="user-target" title="送信先スレッド"></select>
  <input id="qa-agenda" placeholder="今回決めること（空欄=先手が起案）" title="質疑の論点。空欄ならリレー開始側のエージェントが起案し、進行中にバーから修正できます" hidden style="width:220px" />

<script>
const NAMES = Object.assign(Object.create(null), { user: "ユーザー" });
const STATUS_LABEL = { queued: "キュー", working: "作業中", returned: "結果あり", done: "完了" };
let state = { messages: [], tasks: [], pool: [], topics: [], projects: [], agents: {}, running: {}, reviewPending: {}, fixPending: {}, activity: {}, runs: [], events: [], storageMetrics: {} };

// ---- トピック（スレッド）----
let currentTopicId = localStorage.getItem("u2a2a-topic") || null;
let renamingTopicId = null;

function currentTopic() {
  return (state.topics || []).find((t) => t.id === currentTopicId) || (state.topics || [])[0] || null;
}

function ensureTopic() {
  const t = currentTopic();
  if (t && t.id !== currentTopicId) {
    currentTopicId = t.id;
    try { localStorage.setItem("u2a2a-topic", t.id); } catch {}
  }
  return t;
}

function switchTopic(id) {
  currentTopicId = id;
  renamingTopicId = null;
  try { localStorage.setItem("u2a2a-topic", id); } catch {}
  render();
}

// 実行中ランが属するトピック集合（スレッド応答は topicId、レビュー/修正/要約は成果物経由で解決）
function busyTopicIds() {
  const ids = new Set();
  for (const r of state.runs || []) {
    if (r.topicId) ids.add(r.topicId);
    else if (r.itemId) {
      const p = (state.pool || []).find((x) => x.id === r.itemId);
      if (p && p.topicId) ids.add(p.topicId);
    }
  }
  return ids;
}

function renderTopicBar() {
  const bar = $("#topic-bar");
  bar.replaceChildren();
  const topics = state.topics || [];
  for (const t of topics) {
    const active = t.id === (currentTopic() || {}).id;
    const tab = el("div", { class: "topic-tab" + (active ? " active" : ""), "data-topic": t.id, onclick: () => { if (!active) switchTopic(t.id); } });
    // ブラウザライクなドラッグ入れ替え
    tab.setAttribute("draggable", "true");
    tab.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/u2a2a-topic", t.id));
    tab.addEventListener("dragover", (e) => {
      if ([...e.dataTransfer.types].includes("text/u2a2a-topic")) e.preventDefault();
    });
    tab.addEventListener("drop", (e) => {
      const src = e.dataTransfer.getData("text/u2a2a-topic");
      if (!src || src === t.id) return;
      e.preventDefault();
      const order = topics.map((x) => x.id).filter((tid) => tid !== src);
      order.splice(order.indexOf(t.id), 0, src);
      api("/api/topics/reorder", "POST", { order });
    });
    if (renamingTopicId === t.id) {
      const input = el("input", { value: t.title });
      const commit = () => {
        renamingTopicId = null;
        const v = input.value.trim();
        if (v && v !== t.title) api("/api/topics/" + t.id, "PATCH", { title: v });
        else render();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { renamingTopicId = null; render(); }
      });
      input.addEventListener("blur", commit);
      tab.appendChild(input);
      bar.appendChild(tab);
      setTimeout(() => input.focus(), 0);
      continue;
    }
    const count = (state.messages || []).filter((m) => m.topicId === t.id).length;
    if (busyTopicIds().has(t.id)) tab.appendChild(el("span", { class: "run-dot", title: "このトピックで実行中" }));
    tab.appendChild(el("span", { text: t.title + (count ? "（" + count + "）" : "") }));
    if (active) {
      tab.appendChild(el("button", {
        class: "t-btn", text: "✏", title: "名前を変更",
        onclick: (e) => { e.stopPropagation(); renamingTopicId = t.id; renderTopicBar(); },
      }));
      if (topics.length > 1) {
        tab.appendChild(el("button", {
          class: "t-btn", text: "✕", title: "スレッドを削除（メッセージも消えます）",
          onclick: (e) => { e.stopPropagation(); armedDelete(e.target, () => api("/api/topics/" + t.id, "DELETE").then(() => { currentTopicId = null; })); },
        }));
      }
    }
    bar.appendChild(tab);
  }
  bar.appendChild(el("button", {
    id: "topic-add", text: "＋ 新規スレッド",
    title: "Shift＋クリックで参加者・プロジェクトを選択",
    onclick: (event) => openProjectChoice("new", undefined, null, event.shiftKey),
  }));
  renderViewControls();
}
const POOL_STATUS_LABEL = { submitted: "持ち込み", reviewing: "レビュー", approved: "承認", rejected: "差し戻し" };

const $ = (s) => document.querySelector(s);

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

async function api(path, method = "GET", body, { silent = false } = {}) {
  const res = await fetch(path, {
    method,
    ...(silent ? { cache: "no-store" } : {}),
    headers: body === undefined ? undefined : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (!silent) toast(err.error || "エラーが発生しました");
    throw Object.assign(new Error(err.error || "取得に失敗しました（HTTP " + res.status + "）"), { status: res.status, data: err });
  }
  return silent ? res.json().catch(() => ({})) : res.json();
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// 実行中 CLI の実況ボックス
function activityEl(a) {
  const head = el("div", { class: "a-head" }, [
    el("span", { class: "a-label", text: "⏳ " + a.label + " 実行中" }),
    el("span", { class: "elapsed", "data-started": a.startedAt, text: fmtElapsed(Date.now() - a.startedAt) }),
  ]);
  const run = a.runId ? (state.runs || []).find((r) => r.runId === a.runId) : null;
  if (run && run.kind === "thread") {
    head.appendChild(el("button", {
      class: "small danger",
      text: "⏹ 停止",
      onclick: () => api("/api/runs/" + run.runId + "/cancel", "POST", {})
        .then(() => toast("停止を要求しました（SIGTERM→3秒でSIGKILL）")),
    }));
  }
  const box = el("div", { class: "activity", "data-runid": a.runId || "" }, [
    head,
    el("div", { class: "a-step", text: a.step || "" }),
  ]);
  const past = (a.steps || []).slice(0, -1).slice(-3);
  if (past.length) box.appendChild(el("div", { class: "a-log", text: past.join("　→　") }));
  return box;
}

// ---- 転送ペアの対応線 ----
// 原文（送信元スレッド）と折りたたみ表示（受信側）を薄緑の線でつなぎ、
// 左右スレッドのスクロール差をひと目で分かるようにする
let linkRaf = 0;

function scheduleLinks() {
  cancelAnimationFrame(linkRaf);
  linkRaf = requestAnimationFrame(updateRelayLinks);
}

function updateRelayLinks() {
  const svg = $("#link-layer");
  const mainEl = document.querySelector("main");
  if (!svg || !mainEl) return;
  if (document.body.classList.contains("flow-view")) { svg.replaceChildren(); return; }
  const mr = mainEl.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + mr.width + " " + mr.height);
  const t = currentTopic();
  if (!t) {
    svg.replaceChildren();
    return;
  }
  const parts = [];
  for (const m of state.messages) {
    const pvm = provOf(m);
    if (m.topicId !== t.id || !pvm.source) continue;
    const tgt = document.querySelector('main > .thread-col .msg[data-mid="' + m.id + '"]');
    if (!tgt) continue;
    let srcMsg = pvm.source.messageId ? state.messages.find((o) => o.id === pvm.source.messageId) : null;
    if (!srcMsg) {
      // ID なしの旧中継用フォールバック: 同一トピック・送信元スレッド・同著者・同文の直前メッセージ
      srcMsg = state.messages.find(
        (o) => o.topicId === t.id && o.thread === pvm.source.agent && o.author === m.author && o.text === m.text && o.ts <= m.ts
      );
    }
    const src = srcMsg && document.querySelector('main > .thread-col .msg[data-mid="' + srcMsg.id + '"]');
    if (!src || src.closest(".is-folded") || tgt.closest(".is-folded")) continue;
    // 各メッセージの中心Yを、所属スレッドの表示範囲内にクランプ
    // （画面外へスクロールした分は端に張り付き、線の傾きがズレ量を示す）
    const anchor = (el2) => {
      const cr = el2.closest(".messages").getBoundingClientRect();
      const r = el2.getBoundingClientRect();
      return {
        r,
        y: Math.min(Math.max(r.top + r.height / 2, cr.top + 6), cr.bottom - 6),
        visible: r.bottom > cr.top && r.top < cr.bottom, // 可読領域に一部でも見えているか
      };
    };
    const s = anchor(src);
    const g = anchor(tgt);
    if (!s.visible && !g.visible) continue; // 両方とも画面外のペアは描かない
    const leftFirst = s.r.left < g.r.left;
    const x1 = (leftFirst ? s.r.right : s.r.left) - mr.left;
    const x2 = (leftFirst ? g.r.left : g.r.right) - mr.left;
    const y1 = s.y - mr.top;
    const y2 = g.y - mr.top;
    const dx = (x2 - x1) / 2;
    parts.push(
      `<path d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}" />` +
      `<circle cx="${x1}" cy="${y1}" r="2" /><circle cx="${x2}" cy="${y2}" r="2" />`
    );
  }
  svg.innerHTML = parts.join("");
}

window.addEventListener("resize", scheduleLinks);

// ---- 応答メタ（コスト・トークン・所要時間）表示 ----
function fmtTok(n) {
  if (!n) return "0";
  if (n < 1000) return String(n);
  return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
}

function metaText(meta) {
  if (!meta) return "";
  const u = meta.usage || meta; // 旧フラット形式フォールバック
  const parts = ["⏱ " + fmtElapsed(meta.durationMs || 0)];
  parts.push("in " + fmtTok(u.inTok) + (u.cacheTok ? "（+cache " + fmtTok(u.cacheTok) + "）" : "") + " / out " + fmtTok(u.outTok));
  const usd = meta.billing && meta.billing.mode === "metered" ? meta.billing.usd : meta.costUsd;
  if (usd != null) parts.push("$" + usd.toFixed(4));
  else if (meta.billing?.mode === "unknown") parts.push("費用不明");
  if (meta.billing && meta.model) parts.push(meta.model);
  if (meta.status && meta.status !== "completed") parts.push("⚠ " + meta.status);
  return parts.join("　");
}

function metaEl(meta) {
  return el("div", { class: "msg-meta", text: metaText(meta) });
}

// 経過時間だけ毎秒更新（全再描画はしない）
setInterval(() => {
  for (const e2 of document.querySelectorAll(".elapsed[data-started]")) {
    e2.textContent = fmtElapsed(Date.now() - Number(e2.dataset.started));
  }
}, 1000);

// ---- 軽量 Markdown レンダラー（HTML はすべてエスケープ＝無害化した上で装飾のみ付与） ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineMd(raw) {
  let s = escapeHtml(raw);
  // 画像: ![alt](http(s)://… | u2a2a/pool/… | /api/pool/file/…)
  s = s.replace(
    /!\[([^\]]*)\]\((?:(https?:[^)\s]+)|(?:\/api\/pool\/file\/|u2a2a\/pool\/)([^)\s]+))\)/g,
    (_, alt, abs, rel) => {
      const src = abs || "/api/pool/file/" + rel;
      return '<img src="' + src + '" alt="' + alt + '" loading="lazy">';
    }
  );
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

// コードブロックの実体ストア（保存・コピー用。event delegation から参照）
const cbStore = {};
let cbSeq = 0;

function renderMarkdown(src, ctx) {
  const lines = src.split("\n");
  const out = [];
  let para = [];
  const flushPara = () => {
    if (para.length) out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>");
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // フェンス付きコードブロック（SVG はインライン描画＋プール保存ボタン付き）
    const fence = line.match(/^\s*```([\w+-]*)/);
    if (fence) {
      flushPara();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; // 閉じフェンス
      const code = buf.join("\n");
      const lang = (fence[1] || "").toLowerCase();
      const cid = "cb" + ++cbSeq;
      cbStore[cid] = { code, lang, author: (ctx || {}).author || "user" };
      const isSvg = lang === "svg" || code.trimStart().startsWith("<svg");
      let html = "";
      if (isSvg) {
        // <img> + data URI 描画なのでスクリプトは実行されない
        html += '<img class="cb-svg" alt="SVG" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(code) + '">';
      }
      html +=
        '<div class="cb-bar"><span>' + (lang || "code") + "</span>" +
        '<button class="small cb-save" data-cid="' + cid + '">プールへ保存</button>' +
        '<button class="small cb-copy" data-cid="' + cid + '">コピー</button></div>' +
        "<pre><code>" + escapeHtml(code) + "</code></pre>";
      out.push(html);
      continue;
    }
    // 見出し
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      const level = Math.min(h[1].length, 4);
      out.push(`<h${level}>` + inlineMd(h[2]) + `</h${level}>`);
      i++;
      continue;
    }
    // 水平線
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushPara();
      out.push("<hr>");
      i++;
      continue;
    }
    // 引用
    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + buf.map(inlineMd).join("<br>") + "</blockquote>");
      continue;
    }
    // 表（ヘッダ行 + 区切り行）
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara();
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => inlineMd(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
      out.push(
        "<table><thead><tr>" + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    // リスト（箇条書き／番号。ネストは1段のみ対応）
    const isUl = (l) => /^\s*[-*+]\s+/.test(l);
    const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
    if (isUl(line) || isOl(line)) {
      flushPara();
      const ordered = isOl(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length && (isUl(lines[i]) || isOl(lines[i]))) {
        let item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        i++;
        // 継続行（インデントされた通常行）を取り込む
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) {
          item += "\n" + lines[i++].trim();
        }
        items.push("<li>" + item.split("\n").map(inlineMd).join("<br>") + "</li>");
      }
      out.push(`<${tag}>` + items.join("") + `</${tag}>`);
      continue;
    }
    // 空行 = 段落区切り
    if (!line.trim()) {
      flushPara();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join("\n");
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function qaStopDismissed(topic) {
  if (!topic) return false;
  let saved = dismissedQaStops.get(topic.id);
  try { if (saved === undefined) saved = localStorage.getItem(qaStopStorageKey(topic.id)); } catch {}
  return saved === qaStopKey(topic.relay || {});
}
function rememberQaStop(topic, dismissed) {
  if (!topic) return;
  const key = qaStopKey(topic.relay || {});
  if (dismissed) dismissedQaStops.set(topic.id, key);
  else dismissedQaStops.delete(topic.id);
  // 保存禁止・容量超過でも、現在のページでは閉じられる。
  try {
    if (dismissed) localStorage.setItem(qaStopStorageKey(topic.id), key);
    else localStorage.removeItem(qaStopStorageKey(topic.id));
  } catch {}
}

function participantChecks(box, ids, selected, changed, busy = false) {
  // 選択・認証の更新ではDOMを交換せず、操作中のフォーカスを保つ。
  const key = JSON.stringify(ids);
  if (box.dataset.optionsKey !== key) {
    box.dataset.optionsKey = key;
    box.replaceChildren(...ids.map((id) => el("label", { class: "agent-choice" }, [
      el("input", { type: "checkbox", value: id }), el("span"),
    ])));
  }
  for (const label of box.children) {
    const input = label.querySelector("input"), id = input.value;
    input.checked = selected.includes(id);
    // 未認証を新たに選ぶことは不可。継承済みの選択は明示的に外せる。
    input.disabled = busy || (!agentReady(id) && !input.checked);

    input.onchange = () => changed(id, input.checked);
    label.querySelector("span").textContent = (NAMES[id] || id) + (!agentReady(id) ? " — " + authLabel(id) : "");
  }
}

function ensureAgentColumns() {
  const main = $("main"), topic = currentTopic();
  const ids = participantsOf(topic).filter((id) => agentIds().includes(id));
  const changedTopic = columnTopic !== (topic?.id || null);
  if (changedTopic) {
    for (const col of main.querySelectorAll(".thread-col")) {
      columnDrafts.set(columnTopic + ":" + col.dataset.agent, { text: col.querySelector("textarea").value, open: !col.querySelector(".agent-input").hidden });
    }
    columnTopic = topic?.id || null;
  }
  for (const col of main.querySelectorAll(".thread-col")) if (!ids.includes(col.dataset.agent)) col.remove();
  for (const id of ids) {
    let col = main.querySelector('[data-agent="' + id + '"]');
    const created = !col;
    if (created) { col = createThreadColumn(id); main.appendChild(col); wireAgent(id); }
    col.querySelector(".agent-title").textContent = NAMES[id] + " 側スレッド";
    col.querySelector(".rail-name").textContent = NAMES[id];
    col.style.setProperty("--agent-color", agentColor(id));
    if (changedTopic || created) {
      const draft = columnDrafts.get(columnTopic + ":" + id);
      col.querySelector("textarea").value = draft?.text || "";
      col.querySelector(".agent-input").hidden = !draft?.open;
    }
  }
  // 同じ列構成のSSE更新ではDOMを移動しない（フォーカス・選択を保持）。
  const order = [...main.querySelectorAll(".thread-col")].map((col) => col.dataset.agent);
  if (order.join() !== ids.join()) for (const id of ids) main.appendChild(main.querySelector('[data-agent="' + id + '"]'));
  applyColumnLayout();
}

// 幅が変わる前の末尾追従だけを保存する。別トピック・隠れた列は引き継がない。
function captureThreadBottoms() {
  const bottoms = new Map();
  if (document.body.classList.contains("flow-view") || participantsOf().length < 3 || narrowColumnLayout.matches || columnTopic !== currentTopic()?.id) return bottoms;
  for (const col of document.querySelectorAll(".thread-col:not(.is-folded)")) {
    const box = col.querySelector(".messages");
    if (!box) continue;
    bottoms.set(col.dataset.agent, box.scrollHeight - box.scrollTop - box.clientHeight < 60);
  }
  return bottoms;
}

function restoreThreadBottoms(bottoms) {
  for (const [agent, atBottom] of bottoms) {
    if (!atBottom) continue;
    const col = document.querySelector('.thread-col[data-agent="' + agent + '"]');
    if (!col || col.classList.contains("is-folded")) continue;
    const box = col.querySelector(".messages");
    if (box) box.scrollTop = box.scrollHeight;
  }
}

function toggleWideColumn(agent) {
  const topic = currentTopic();
  if (!topic || participantsOf(topic).length < 3 || !participantsOf(topic).includes(agent) || narrowColumnLayout.matches || foldedColumns.get(topic.id)?.has(agent)) return;
  const bottoms = captureThreadBottoms();
  if (widenedColumns.get(topic.id) === agent) widenedColumns.delete(topic.id);
  else widenedColumns.set(topic.id, agent);
  applyColumnLayout();
  restoreThreadBottoms(bottoms);
  scheduleLinks();
}

function toggleColumn(agent) {
  const key = currentTopic()?.id || "";
  const folded = foldedColumns.get(key) || new Set();
  const bottoms = captureThreadBottoms();
  if (folded.has(agent)) folded.delete(agent);
  else {
    if (participantsOf().filter((id) => !folded.has(id)).length <= 1) return toast("少なくとも1列は開いておきます");
    folded.add(agent);
    if (widenedColumns.get(key) === agent) widenedColumns.delete(key);
  }
  foldedColumns.set(key, folded);
  applyColumnLayout();
  const col = document.querySelector('.thread-col[data-agent="' + agent + '"]');
  col?.querySelector(folded.has(agent) ? ".thread-rail" : ".fold-column")?.focus();
  restoreThreadBottoms(bottoms);
  scheduleLinks();
}

function applyColumnLayout() {
  const topic = currentTopic(), folded = foldedColumns.get(topic?.id || "") || new Set();
  const threeAgents = participantsOf(topic).length >= 3;
  const widened = threeAgents ? widenedColumns.get(topic?.id || "") : null;
  const tracks = [];
  for (const col of document.querySelectorAll(".thread-col")) {
    const id = col.dataset.agent, closed = folded.has(id);
    col.classList.toggle("is-folded", closed);
    const rail = col.querySelector(".thread-rail");
    rail.hidden = !closed;
    const unseen = state.messages.filter((m) => m.topicId === topic?.id && m.thread === id && m.author !== id && m.ts > (topic?.agents?.[id]?.lastSeenTs || 0)).length;
    rail.querySelector(".rail-unread").textContent = "未読 " + unseen;
    rail.setAttribute("aria-label", NAMES[id] + " を展開・未読 " + unseen);
    col.querySelector(".fold-column").setAttribute("aria-expanded", String(!closed));
    const wideButton = col.querySelector(".widen-column");
    if (wideButton) wideButton.textContent = widened === id ? "等幅に戻す" : "広げる";
    tracks.push(closed ? "44px" : widened === id ? "minmax(0, 2fr)" : "minmax(0, 1fr)");
  }
  $("main").style.setProperty("--thread-tracks", tracks.join(" ") || "1fr");
  document.body.classList.toggle("three-agents", threeAgents);
}

async function checkAgentAuth() {
  if (authChecking.has("grok")) return;
  authChecking.add("grok"); renderAuthControls();
  try {
    const result = await api("/api/agents/grok/check-auth", "POST", {});
    state.agents.grok = { ...state.agents.grok, authed: result.authed, authCheckedTs: result.checkedTs };
    toast(result.message || authLabel("grok"));
  } catch (e) { toast(e.message); }
  finally { authChecking.delete("grok"); render(); }
}

function renderAuthControls() {
  const box = $("#agent-access");
  const hasGrok = agentIds().includes("grok");
  const inColumn = participantsOf().includes("grok");
  const key = JSON.stringify([hasGrok, inColumn, NAMES.grok, state.agents?.grok?.authed,
    state.agents?.grok?.auto, authChecking.has("grok"), authAutoSaving]);
  if (box.dataset.optionsKey === key) return;
  box.dataset.optionsKey = key;
  box.replaceChildren();
  // 参加列がない場合だけここにトグルを置き、列ヘッダとの重複を避ける。
  if (!hasGrok) return;
  const auto = el("input", { type: "checkbox", "aria-label": NAMES.grok + " 自動応答" });
  auto.checked = !!state.agents?.grok?.auto;
  auto.disabled = authAutoSaving;
  auto.addEventListener("change", async () => {
    authAutoSaving = true;
    auto.disabled = true;
    try {
      const value = auto.checked;
      await api("/api/agents/grok", "PATCH", { auto: value });
      state.agents.grok.auto = value;
    }
    catch (e) { toast(e.message); }
    finally { authAutoSaving = false; delete box.dataset.optionsKey; renderAuthControls(); }
  });
  const check = el("button", { type: "button", class: "small", text: authChecking.size ? "確認中…" : "再確認", onclick: checkAgentAuth });
  check.disabled = authChecking.size > 0;
  box.append(el("span", { class: "auth-badge", text: NAMES.grok + ": " + authLabel("grok") }), check);
  if (!inColumn) box.append(el("label", { class: "auto-ctl" }, [auto, document.createTextNode("自動応答")]));
}

function chooseDestination(kind, fromAgent, m, event) {
  event?.stopPropagation();
  const topic = (state.topics || []).find((t) => t.id === m.topicId);
  const peers = topic ? participantsOf(topic).filter((id) => id !== fromAgent) : [];
  const send = async (toAgent) => {
    if (!agentReady(toAgent)) return toast(NAMES[toAgent] + " は" + authLabel(toAgent));
    try {
      await api(kind === "handoff" ? "/api/handoff" : "/api/relay", "POST", { messageId: m.id, toAgent });
      toast(NAMES[toAgent] + (kind === "handoff" ? " へ引き継ぎました" : " へ転送しました"));
    } catch (e) { toast(e.message); }
  };
  if (peers.length === 1) return send(peers[0]);
  if (!peers.length) return toast("宛先となる参加者がいません");
  const r = event?.currentTarget?.getBoundingClientRect();
  const x = r ? r.left : parseFloat(ctxMenuEl.style.left) || 0;
  const y = r ? r.bottom : parseFloat(ctxMenuEl.style.top) || 0;
  const items = peers.map((id) => [NAMES[id] + (!agentReady(id) ? "（" + authLabel(id) + "）" : ""), () => send(id)]);
  // コンテキストメニュー内の操作から開く場合、元のclickで閉じられないようにする。
  if (event) openCtxMenu(x, y, items);
  else setTimeout(() => openCtxMenu(x, y, items), 0);
}

function syncPoolReviewers(reset = false) {
  const topic = (state.topics || []).find((t) => t.id === poolDialogTopicId);
  const ids = participantsOf(topic || null);
  const origin = $("#pool-origin").value;

  const selected = reset ? ids.filter((id) => id !== origin) : [...box.querySelectorAll("input:checked")].map((input) => input.value);

}

function syncAgentAction() {

$("#agent-action-form").addEventListener("submit", async (event) => {

$("#pool-origin").addEventListener("change", () => syncPoolReviewers(true));
