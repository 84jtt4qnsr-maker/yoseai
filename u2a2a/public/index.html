// ---- ローカルプロジェクト（実体は移動せず、参照先だけを登録）----
const projectProbes = new Map();
const projectProbeQueue = [];
let projectProbeRunning = 0;
let projectCatalogKey = "";
let projectCatalogEpoch = 0;
let projectListRequest = 0;
let projectListLoading = false;
let projectContextKey = "";
let projectExecutionErrorKey = "";
let projectChoice = null;
const projectNameDrafts = new Map();
const projectMutating = new Set();

const findProject = (id) => (state.projects || []).find((p) => p.id === id);
const projectName = (id) => !id ? "Kometa（既定）" : findProject(id)?.name || "登録解除済み";
const projectUrl = (id) => "/api/projects/" + encodeURIComponent(id);

const projectRequest = (url, method = "GET", body) => api(url, method, body, { silent: true });

function projectErrorText(error) {
  let text = error.message || "通信に失敗しました";
  for (const [key, label, collection] of [["topics", "参照トピック", state.topics], ["items", "参照成果物", state.pool]]) {
    const ids = error.data?.[key];
    if (Array.isArray(ids) && ids.length) {
      const names = ids.slice(0, 8).map((id) => (collection || []).find((x) => x.id === id)?.title || id);
      text += "\n" + label + ": " + names.join("、") + (ids.length > 8 ? " 他 " + (ids.length - 8) + " 件" : "");
    }
  }
  return text;
}

function projectProbeLabel(id) {
  if (!id) return { text: "既定の参照先", blocked: false };
  if (!findProject(id)) return { text: "登録解除済み — 対象を確認できません（実行不可）", blocked: true };
  const entry = projectProbes.get(id);
  if (!entry || entry.pending) return { text: "確認中…", blocked: false };
  if (entry.error) return { text: "確認不可: " + entry.error, blocked: false };
  const probe = entry.data;
  const notes = { missing: "フォルダが見つかりません", unreadable: "フォルダを読み取れません", unregistered: "登録解除済み" };
  if (notes[probe.status]) return { text: notes[probe.status] + "（実行不可）" + (probe.note ? " — " + probe.note : ""), blocked: true };
  if (probe.status === "not-git") return { text: "通常フォルダ（Git情報なし）", blocked: false };
  if (probe.status !== "ok") return { text: "確認不可" + (probe.note ? ": " + probe.note : ""), blocked: false };
  return { text: (probe.branch || "ブランチ不明") + "@" + (probe.head || "HEAD不明") + "・変更 " + (probe.dirty ?? "不明") + " 件", blocked: false };
}

function pumpProjectProbes() {
  // 管理一覧を開いても、登録件数分のGit確認を一斉に起動しない。
  while (projectProbeRunning < 3 && projectProbeQueue.length) {
    const { id, entry } = projectProbeQueue.shift();
    if (projectProbes.get(id) !== entry || findProject(id)?.path !== entry.path) continue;
    projectProbeRunning++;
    projectRequest(projectUrl(id) + "/probe")
      .then((data) => {
        if (typeof data.status !== "string") throw new Error("確認結果の形式が不正です");
        entry.data = data;
      })
      .catch((e) => { entry.error = e.message; })
      .finally(() => {
        entry.pending = false;
        projectProbeRunning--;
        if (projectProbes.get(id) === entry) {
          if (entry.recheck) ensureProjectProbe(id, true);
          refreshProjectProbeViews();
        }
        pumpProjectProbes();
      });
  }
}

function ensureProjectProbe(id, force = false) {
  const project = findProject(id);
  if (!project) return;
  const old = projectProbes.get(id);
  if (old?.path === project.path) {
    if (!force) return;
    // 実行状態が取得中に変わった場合も、完了後に最新の状態を確認する。
    if (old.pending) { old.recheck = true; return; }
  }
  const entry = { path: project.path, pending: true };
  projectProbes.set(id, entry);
  projectProbeQueue.push({ id, entry });
  pumpProjectProbes();
}

function projectProbeEl(id) {
  ensureProjectProbe(id);
  const label = projectProbeLabel(id);
  return el("span", { class: "project-probe" + (label.blocked ? " project-error" : ""), "data-project-probe": id || "", text: label.text });
}

function refreshProjectProbeViews() {
  for (const node of document.querySelectorAll("[data-project-probe]")) {
    const label = projectProbeLabel(node.dataset.projectProbe);
    node.textContent = label.text;
    node.classList.toggle("project-error", label.blocked);
  }
  renderProjectContext();
}

function projectBadge(id) {
  return el("span", {
    class: "project-chip" + (id && !findProject(id) ? " project-unregistered" : ""),
    text: "📁 " + projectName(id), title: findProject(id)?.path || (id ? "登録ID: " + id : "従来のKometaリポジトリ"),
  });
}

function projectRecheckButton(id) {
  return el("button", { class: "small", text: "再確認", onclick: () => { ensureProjectProbe(id, true); refreshProjectProbeViews(); } });
}

function projectDetailsEl(id) {
  const box = el("div", { class: "project-details" }, [projectBadge(id)]);
  if (findProject(id)) box.appendChild(el("div", { class: "project-path", text: findProject(id).path }));
  box.appendChild(projectProbeEl(id));
  if (findProject(id)) box.appendChild(projectRecheckButton(id));
  return box;
}

function renderProjectContext() {
  const topic = currentTopic();
  const row = $("#project-context");
  row.hidden = !topic || (!topic.projectId && !(state.projects || []).length);
  row.replaceChildren();
  const banner = $("#project-stop");
  banner.hidden = true;
  banner.textContent = "";
  if (row.hidden) { projectContextKey = ""; return; }
  const key = JSON.stringify([topic.id, topic.projectId]);
  if (projectContextKey !== key) { projectContextKey = key; ensureProjectProbe(topic.projectId, true); }
  const chip = el("button", {
    class: "small project-chip", text: "📁 " + projectName(topic.projectId),
    title: "対象プロジェクトを選択" + (findProject(topic.projectId) ? " — " + findProject(topic.projectId).path : ""),
    onclick: () => openProjectChoice("bind", topic),
  });
  row.append(chip, projectProbeEl(topic.projectId), el("span", { class: "project-hint", text: topic.projectLocked ? "🔒 実行済み・対象固定" : "閲覧のみ・実行前は対象変更可" }));
  if (topic.projectId) row.appendChild(projectRecheckButton(topic.projectId));
  const label = projectProbeLabel(topic.projectId);
  if (label.blocked) {
    banner.textContent = "対象プロジェクト「" + projectName(topic.projectId) + "」: " + label.text + "。参照先を確認してください。";
    banner.hidden = false;
  }
}

function renderProjectUI() {
  const key = JSON.stringify(state.projects || []);
  if (projectCatalogKey !== key) {
    projectCatalogKey = key;
    projectCatalogEpoch++;
    for (const [id, entry] of projectProbes) if (findProject(id)?.path !== entry.path) projectProbes.delete(id);
    if ($("#projects-dialog").open) renderProjectList();
  }
  const topic = currentTopic();
  const errors = participantsOf(topic).map((agent) => topic?.agents?.[agent]?.lastError ?? state.agents?.[agent]?.lastError ?? "");
  const blockedMessage = (state.messages || []).findLast((m) => m.topicId === topic?.id && m.blocked);
  const errorKey = JSON.stringify([topic?.id, topic?.projectId, errors, blockedMessage?.id]);
  if (projectExecutionErrorKey !== errorKey) {
    projectExecutionErrorKey = errorKey;
    // 停止通知とエラー解消のどちらでも更新する。サーバの文言には依存しない。
    // トピック切替時の確認は renderProjectContext に任せる。
    const project = findProject(topic?.projectId);
    if (project && projectContextKey === JSON.stringify([topic.id, topic.projectId])) ensureProjectProbe(project.id, true);
  }
  renderProjectContext();
  syncProjectChoice();
}

async function loadProjectList(forceProbe = false) {
  const request = ++projectListRequest, epoch = projectCatalogEpoch;
  projectListLoading = true;
  $("#projects-list-state").classList.remove("project-error");
  $("#projects-list-state").textContent = "登録一覧を読み込み中…";
  $("#projects-reload").disabled = true;
  try {
    const data = await projectRequest("/api/projects");
    if (!Array.isArray(data.projects)) throw new Error("登録一覧の形式が不正です");
    if (request !== projectListRequest) return;
    // 後から届いた一覧で、SSEや登録操作による新しい一覧を巻き戻さない。
    if (epoch === projectCatalogEpoch) { state.projects = data.projects; render(); }
    for (const p of state.projects || []) ensureProjectProbe(p.id, forceProbe);
    $("#projects-list-state").textContent = "";
    renderProjectList();
  } catch (e) {
    if (request === projectListRequest) {
      $("#projects-list-state").classList.add("project-error");
      $("#projects-list-state").textContent = "一覧の取得失敗: " + projectErrorText(e);
    }
  } finally {
    if (request === projectListRequest) { projectListLoading = false; $("#projects-reload").disabled = false; }
  }
}

function openProjects() {
  projectNameDrafts.clear();
  $("#projects-error").textContent = "";
  $("#projects-path").value = "";
  $("#projects-name").value = "";
  renderProjectList();
  $("#projects-dialog").showModal();
  void loadProjectList();
}

function renderProjectList() {
  const list = $("#projects-list");
  list.replaceChildren();
  if (!(state.projects || []).length) list.appendChild(el("p", { class: "project-hint", text: "登録プロジェクトはありません。下のフォームから追加できます。" }));
  for (const p of state.projects || []) {
    const input = el("input", { value: projectNameDrafts.get(p.id) ?? p.name, maxlength: "60", required: "", "aria-label": p.name + " の表示名", oninput: (e) => projectNameDrafts.set(p.id, e.target.value) });
    const error = el("div", { class: "project-error", role: "status", "data-project-row-error": p.id });
    const save = el("button", { class: "small", type: "button", text: "名前を保存", onclick: () => {
      if (!input.reportValidity()) return;
      const name = input.value.trim();
      if (!name) { error.textContent = "表示名を入力してください"; return; }
      void mutateProject(p, "PATCH", { name });
    } });
    const remove = el("button", { class: "small", type: "button", text: "登録解除", title: "ローカルのファイルは削除しません。参照中の登録は解除できません。", onclick: (e) => armedDelete(e.currentTarget, () => mutateProject(p, "DELETE")) });
    input.disabled = save.disabled = remove.disabled = projectMutating.has(p.id);
    list.appendChild(el("article", { class: "project-card" }, [
      el("div", { class: "project-card-head" }, [input, save, remove]),
      el("div", { class: "project-path", text: p.path }),
      el("span", { class: "project-hint", text: p.kind === "git" ? "Gitリポジトリ · " : "通常フォルダ · " }), projectProbeEl(p.id), error,
    ]));
  }
}

async function mutateProject(project, method, body) {
  if (projectMutating.has(project.id)) return;
  projectMutating.add(project.id);
  projectCatalogEpoch++;
  renderProjectList();
  let error;
  try {
    await projectRequest(projectUrl(project.id), method, body);
    if (method === "DELETE") state.projects = (state.projects || []).filter((p) => p.id !== project.id);
    else state.projects = (state.projects || []).map((p) => p.id === project.id ? { ...p, name: body.name } : p);
    projectNameDrafts.delete(project.id);
    toast(method === "DELETE" ? "登録を解除しました（ファイルは保持）" : "表示名を保存しました");
  } catch (e) { error = e; }
  finally { projectMutating.delete(project.id); projectCatalogEpoch++; render(); renderProjectList(); }
  if (error) {
    const row = [...$("#projects-list").querySelectorAll("[data-project-row-error]")].find((node) => node.dataset.projectRowError === project.id);
    if ($("#projects-dialog").open && row) row.textContent = projectErrorText(error);
    else toast(projectErrorText(error));
  }
}

async function openProjectChoice(mode, topic, messageId = null, forceSelection = false) {
  if (mode === "new" && topic === undefined) topic = currentTopic();
  if (mode === "bind" && topic?.projectLocked) return toast("実行後は変更できません。🌿 分岐で別プロジェクトのトピックを作れます");
  if (mode !== "new" && !topic) return toast("対象トピックが見つかりません");
  const participants = mode === "branch" ? [...participantsOf(topic)] : defaultParticipants();
  // 既定が従来の2名で、追加の認証済み候補がなければ1クリック作成を維持。
  // Grokが選べる場合、またはShift＋新規クリックでは参加者選択を開く。
  const legacyPair = participants.length === 2 && participants.includes("claude") && participants.includes("codex");
  if (mode !== "bind" && !forceSelection && !(state.projects || []).length && !topic?.projectId
      && legacyPair && participants.every(agentReady)
      && agentIds().filter(agentReady).every((id) => participants.includes(id))) {
    try {
      const path = mode === "new" ? "/api/topics" : "/api/topics/" + encodeURIComponent(topic.id) + "/branch";
      const created = await projectRequest(path, "POST", { ...(mode === "branch" ? { messageId } : {}), participants });
      if (!created.id) throw new Error("トピックの応答形式が不正です。再操作前に一覧を確認してください。");
      state.topics = [...(state.topics || []).filter((t) => t.id !== created.id), created];
      switchTopic(created.id);
      renamingTopicId = created.id;
      render();
      if (mode === "branch") toast("この地点までの履歴で分岐しました（セッションは新規・要約を引き継ぎ）");
    } catch (e) { toast(projectErrorText(e)); }
    return;
  }
  projectChoice = { mode, topicId: topic?.id, messageId, selected: topic?.projectId || "", busy: false, participants };
  $("#project-choice-title").textContent = mode === "new" ? "新規スレッド" : mode === "branch" ? "この地点から分岐" : "対象プロジェクトを選択";
  $("#project-topic-title-field").hidden = mode !== "new";
  $("#project-topic-title").value = "";
  delete $("#topic-participant-options").dataset.optionsKey;
  $("#project-choice-error").textContent = "";
  $("#project-choice-save").textContent = mode === "new" ? "作成" : mode === "branch" ? "分岐を作成" : "対象を保存";
  $("#project-choice-dialog").showModal();
  syncProjectChoice();
}

function syncProjectChoice() {
  const choice = projectChoice;
  if (!choice || !$("#project-choice-dialog").open) return;
  const topic = (state.topics || []).find((t) => t.id === choice.topicId);
  const select = $("#project-choice-select");
  const key = JSON.stringify([(state.projects || []).map((p) => [p.id, p.name]), choice.selected]);
  if (choice.optionsKey !== key) {
    choice.optionsKey = key;
    select.replaceChildren(el("option", { value: "", text: "Kometa（既定）" }));
    for (const p of state.projects || []) select.appendChild(el("option", { value: p.id, text: p.name }));
    if (choice.selected && !findProject(choice.selected)) select.appendChild(el("option", { value: choice.selected, text: "登録解除済み（別の対象を選択してください）", disabled: "" }));
    select.value = choice.selected;
  }
  const locked = choice.mode === "bind" && topic?.projectLocked;
  const missingTopic = choice.mode !== "new" && !topic;
  const invalidProject = choice.selected && !findProject(choice.selected);
  $("#project-choice-save").disabled = !!(choice.busy || locked || missingTopic || invalidProject);
  select.disabled = choice.busy || !!locked;
  $("#project-topic-title").disabled = choice.busy;
  $("#project-choice-cancel").disabled = choice.busy;
  const note = locked ? "実行後は変更できません。新規スレッドまたは分岐を作成してください。"
    : missingTopic ? "対象トピックが削除されました。"
    : choice.mode === "branch" ? "この地点までの履歴と要約を引き継ぎ、CLIセッションは新規で開始します。" + ((topic.projectId || "") !== choice.selected ? " 引き継ぐ履歴・要約は「" + projectName(topic.projectId) + "」を対象にした内容です。" : "")
    : "プロジェクトは閲覧のみです。最初の実行後は対象を変更できません。";
  $("#project-choice-note").textContent = note;
  const preview = $("#project-choice-preview");
  preview.replaceChildren();
  if (findProject(choice.selected)) preview.appendChild(el("div", { class: "project-path", text: findProject(choice.selected).path }));
  preview.appendChild(projectProbeEl(choice.selected));
  syncParticipantChoice();
}

async function submitProjectChoice(event) {
  event.preventDefault();
  const choice = projectChoice;
  if (!choice || choice.busy || $("#project-choice-save").disabled) return;
  choice.busy = true;
  $("#project-choice-error").textContent = "";
  syncProjectChoice();
  try {
    const projectId = choice.selected || null;
    const path = choice.mode === "new" ? "/api/topics" : "/api/topics/" + encodeURIComponent(choice.topicId) + (choice.mode === "branch" ? "/branch" : "");
    const body = choice.mode === "new" ? { title: $("#project-topic-title").value.trim() || undefined, projectId }
      : choice.mode === "branch" ? { messageId: choice.messageId, projectId } : { projectId };
    if (choice.mode !== "bind") body.participants = [...choice.participants];
    const topic = await projectRequest(path, choice.mode === "bind" ? "PATCH" : "POST", body);
    if (!topic.id) throw new Error("トピックの応答形式が不正です。再操作前に一覧を確認してください。");
    const old = (state.topics || []).find((t) => t.id === topic.id);
    state.topics = old ? state.topics.map((t) => t.id === topic.id ? { ...t, ...topic } : t) : [...(state.topics || []), topic];
    if (projectChoice === choice) {
      $("#project-choice-dialog").close();
      projectChoice = null;
      switchTopic(topic.id);
      if (choice.mode === "branch" || (choice.mode === "new" && !body.title)) {
        renamingTopicId = topic.id;
        render();
      }
    } else render();
    toast(choice.mode === "branch" ? "選択したプロジェクトで分岐しました" : choice.mode === "new" ? "スレッドを作成しました" : "対象プロジェクトを保存しました");
  } catch (e) {
    if (e.status === 409 && e.data?.reason === "locked") {
      const topic = (state.topics || []).find((t) => t.id === choice.topicId);
      if (topic) topic.projectLocked = true;
    }
    if (projectChoice === choice) $("#project-choice-error").textContent = projectErrorText(e);
    else toast(projectErrorText(e));
  } finally { choice.busy = false; renderProjectUI(); }
}

const columnScrollStates = new Map();
const flowViewStates = new Map();
const dirtyThreadTopics = new Set();
let displayedTopicId = null;
let displayedView = "columns";
let flowLoadState = "loading";
let flowLoadError = "";
let flowGraph = null;
let flowRenderTopic = null;
let flowMessageIndex = new Map();
let flowMemberIndex = new Map();
let flowNodeKeys = new Set();
let flowMarks = new Map();
let flowBranches = new Map();
let flowTasks = new Map();
let flowRenderError = "";
const flowCards = new Map();
const flowEpisodes = new Map();
let flowLinksRaf = 0;
let flowJump = null;
const flowKindLabels = { send: "ユーザー", reply: "応答", replies: "応答の束", relay: "質疑リレー", unrelayed: "未中継の応答", sync: "外部同期", system: "実行のお知らせ", artifact: "成果物", task: "タスク", pending: "応答中" };
const flowStatusLabels = { run: "実行中", ok: "処理完了", wait: "待ち", err: "エラー／停止" };

function flowStateFor(topicId) {
  if (!flowViewStates.has(topicId)) flowViewStates.set(topicId, { episodes: new Map(), cards: new Set(), scrollTop: 0, atBottom: true, unseen: false, nodeKeys: null, messageIds: null, anchor: null });
  return flowViewStates.get(topicId);
}

function requestedView(topic = currentTopic()) {
  return viewModes.get(topic?.id) || (participantsOf(topic).length >= 3 ? "flow" : "columns");
}

function saveDisplayedPosition() {
  if (!displayedTopicId) return;
  if (displayedView === "flow") {
    const box = $("#flow-zone"), saved = flowStateFor(displayedTopicId);
    saved.scrollTop = box.scrollTop;
    saved.anchor = captureFlowAnchor();
    saved.atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  } else {
    const saved = columnScrollStates.get(displayedTopicId) || new Map();

    columnScrollStates.set(displayedTopicId, saved);

function restoreColumnPosition(topicId) {
  const saved = columnScrollStates.get(topicId);

function setViewMode(mode) {

}

const flowViewControls = el("div", { id: "view-controls", role: "group", "aria-label": "表示切替" }, [

function renderViewControls() {

function failFlowGraph(error) {
  flowLoadState = "error";
  flowLoadError = error instanceof Error ? error.message : String(error || "読み込みに失敗しました");
  if (currentTopic()) viewModes.set(currentTopic().id, "columns");
}

const flowLoadTimer = setTimeout(() => {
  if (flowLoadState !== "loading") return;
  failFlowGraph("モジュールの読み込みがタイムアウトしました");
  render();
}, 15000);

window.addEventListener("flowgraph-ready", () => {
  clearTimeout(flowLoadTimer);
  if (typeof window.FlowGraph?.buildFlowGraph !== "function") failFlowGraph("buildFlowGraph がありません");
  else { flowLoadState = "ready"; flowLoadError = ""; }
  render();
});
window.addEventListener("flowgraph-error", (event) => { clearTimeout(flowLoadTimer); failFlowGraph(event.detail); render(); });

function deriveCurrentFlow() {
  const graph = window.FlowGraph.buildFlowGraph({ topicId: currentTopic()?.id, messages: state.messages, pool: state.pool, tasks: state.tasks, topics: state.topics, running: state.running, reviewPending: state.reviewPending, fixPending: state.fixPending }, { names: NAMES });
  if (!graph || !Array.isArray(graph.nodes) || !Array.isArray(graph.episodes) || !Array.isArray(graph.edges) || !graph.membership) throw new Error("フローのデータ形式が一致しません");
  return graph;
}

function reconcileFlowChildren(parent, children) {
  const wanted = new Set(children);
  for (const child of [...parent.children]) if (!wanted.has(child)) child.remove();
  children.forEach((child, index) => { if (parent.children[index] !== child) parent.insertBefore(child, parent.children[index] || null); });
}

function flowNodeKey(key, graph = flowGraph) {
  if (!key || !graph) return null;
  if (flowNodeKeys.has(key)) return key;
  return graph.membership[key] || (key.startsWith("msg:") ? graph.membership[key.slice(4)] : null) || null;
}

function flowMessagesFor(node) {
  const ids = node.kind === "relay" ? (node.hops || []).map((hop) => hop.messageId) : node.messageIds || [];
  // membership が、単独カードと複合カードのどちらにも使える本文の索引となる。
  const members = flowMemberIndex.get(node.key) || [];
  return [...new Set([...ids, ...members])].map((id) => flowMessageIndex.get(id)).filter(Boolean);
}

function refreshFlowDetails(topicId) {
  if (displayedView === "flow" && displayedTopicId === topicId && flowGraph) {
    try { renderFlow(flowGraph, true); }
    catch (error) { console.warn(error); render(); }
  }
}

function openFlowArtifact(node) {
  const item = (state.pool || []).find((p) => "art:" + p.id === node.key);

function jumpFlowTopic(topicId, messageId, anchorKey, useOrigin = false) {
  if (!(state.topics || []).some((topic) => topic.id === topicId)) return toast("分岐先のトピックが見つかりません");
  flowJump = requestedView((state.topics || []).find((topic) => topic.id === topicId)) === "flow"
    ? { topicId, messageId, anchorKey, useOrigin } : null;
  switchTopic(topicId);
}

function updateFlowCard(card, node, saved, origin) {
  const messages = flowMessagesFor(node), expanded = saved.cards.has(node.key);
  const marks = flowMarks.get(node.key) || [];
  const ownBranches = flowBranches.get(node.key) || [];
  const isOrigin = origin && flowNodeKey(origin.anchorKey) === node.key;
  const task = flowTasks.get(node.key);

  const preview = String(node.title || node.head || node.text || messages[0]?.text || "").slice(0, 100).replace(/\s+/g, " ");
  const signature = JSON.stringify([node.kind, node.agent, node.status, node.active, node.taskStatus, node.inferred,
    node.count, node.verdicts, preview, node.hops?.length, node.stopReason, node.branchPoint,
    messages.length, marks, ownBranches, isOrigin ? origin : null, expanded]);
  const summaryChanged = card.dataset.sig !== signature;
  const activitySig = JSON.stringify(activity ? [activity.label, activity.startedAt, activity.runId, activity.step, (activity.steps || []).slice(-4)] : null);
  if (card._activitySig !== activitySig) {
    card._flowParts.activity.replaceChildren(...(activity ? [activityEl(activity)] : []));
    card._activitySig = activitySig;
  }
  // 画像エラー・生表示・末尾だけの本文修正は、その展開カードだけを更新する。
  const detailState = expanded ? messages.flatMap((m) => {
    const hop = (node.hops || []).find((h) => h.messageId === m.id);
    const paths = [...new Set(m.text.match(/u2a2a\/pool\/[^\s)"'`」()）]+/g) || [])].slice(0, 4);
    return [m.id, m.text, JSON.stringify([m.author, m.thread, m.ts, provOf(m), m.taskId, m.test, m.cancelled, m.budget,
      m.meta ? metaText(m.meta) : null, m.meta?.status, hop?.seq, hop?.turn, rawView.has(m.id), expandedRelays.has(m.id),
      paths.map((path) => mediaFailed.has(path.slice("u2a2a/pool/".length)))])];
  }) : [];
  if (expanded) detailState.push(task?.title, task?.detail, task?.result, task?.status, task?.agent, node.text);
  const detailChanged = !card._detailState || detailState.length !== card._detailState.length || detailState.some((value, i) => value !== card._detailState[i]);
  card._detailState = detailState;
  if (!summaryChanged && !detailChanged) return;
  card.dataset.sig = signature;
  card.dataset.glow = node.status || (node.active ? "run" : "");
  card.classList.toggle("is-inferred", !!node.inferred);
  card.classList.toggle("is-expanded", expanded);
  const parts = card._flowParts;
  const label = flowKindLabels[node.kind] || node.kind;
  const agent = node.agent ? (NAMES[node.agent] || node.agent) + " · " : "";
  parts.toggle.textContent = agent + label + (preview ? " — " + preview : "");
  parts.toggle.setAttribute("aria-expanded", String(expanded));
  parts.toggle.onclick = () => {
    if (node.kind === "artifact") return openFlowArtifact(node);
    saved.cards.has(node.key) ? saved.cards.delete(node.key) : saved.cards.add(node.key);
    refreshFlowDetails(displayedTopicId);
  };
  if (node.kind === "artifact") parts.toggle.removeAttribute("aria-expanded");
  const badges = [];
  if (node.inferred) badges.push(el("span", { class: "flow-badge", text: "推定の送信束" }));
  if (node.status) badges.push(el("span", { class: "flow-badge", text: flowStatusLabels[node.status] || node.status }));
  if (node.taskStatus) badges.push(el("span", { class: "flow-badge", text: STATUS_LABEL[node.taskStatus] || node.taskStatus }));
  if (node.kind === "replies") badges.push(el("span", { class: "flow-badge", text: messages.length + "件の応答" }));
  if (node.kind === "relay") badges.push(el("span", { class: "flow-badge", text: (node.hops || []).length + "手" + (node.stopReason ? " · " + (STOP_LABELS[node.stopReason] || node.stopReason) : "") }));
  for (const verdict of node.verdicts || []) badges.push(el("span", { class: "flow-badge", text: (NAMES[verdict.reviewer] || verdict.reviewer) + ": " + verdict.label }));
  if (node.branchPoint) badges.push(el("span", { class: "flow-badge", text: "分岐点" }));
  parts.badges.replaceChildren(...badges);
  const terminals = marks.map((edge) => el("span", { class: "flow-terminal" + (edge.style === "gray" ? " is-gray" : ""), text: "● " + (edge.to.label || edge.to.mark) }));
  if (node.kind === "unrelayed" && !marks.some((edge) => edge.to.mark === "unrelayed")) terminals.push(el("span", { class: "flow-terminal is-gray", text: "● 中継なし" }));
  parts.marks.replaceChildren(...terminals);
  const links = ownBranches.map((branch) => el("button", { type: "button", class: "small flow-branch", "data-child-topic": branch.childTopicId, text: "↳ " + (branch.title || "分岐先"), onclick: () => jumpFlowTopic(branch.childTopicId, null, null, true) }));
  if (isOrigin) links.push(el("button", { type: "button", class: "small flow-branch", text: "↰ 分岐元へ", onclick: () => jumpFlowTopic(origin.parentTopicId, origin.parentMessageId, null) }));
  parts.branches.replaceChildren(...links);

}

function createFlowCard(key) {
  const toggle = el("button", { type: "button", class: "flow-card-toggle" });
  const badges = el("div", { class: "flow-badges" }), marks = el("div", { class: "flow-marks" });
  const branches = el("div", { class: "flow-branches" }), detail = el("div", { class: "flow-detail", id: "flow-detail-" + encodeURIComponent(key), hidden: "" });
  const activity = el("div", { class: "flow-activity" });
  const card = el("article", { class: "flow-card", "data-key": key, tabindex: "-1" }, [toggle, badges, marks, activity]);
  toggle.setAttribute("aria-controls", detail.id || detail.getAttribute("id"));
  const slot = el("div", { class: "flow-card-slot" }, [card, branches]);
  card._flowParts = { toggle, badges, marks, branches, activity, detail, slot };
  return card;
}

function captureFlowAnchor() {
  const top = $("#flow-zone").getBoundingClientRect().top;
  for (const section of flowEpisodes.values()) {
    if (section.getBoundingClientRect().bottom <= top) continue;
    for (const card of section.querySelectorAll(".flow-card")) {
      if (card.getClientRects().length && card.getBoundingClientRect().bottom > top) return { key: card.dataset.key, offset: card.getBoundingClientRect().top - top };
    }
    return { episode: section.dataset.episodeKey, offset: section.getBoundingClientRect().top - top };
  }
  return null;
}

function restoreFlowAnchor(anchor) {
  const target = anchor?.key ? flowCards.get(anchor.key) : flowEpisodes.get(anchor?.episode);
  if (!target?.getClientRects().length) return;
  const zone = $("#flow-zone");
  zone.scrollTop += target.getBoundingClientRect().top - zone.getBoundingClientRect().top - anchor.offset;
}

function renderFlow(graph, userAction = false, restoring = false) {
  const zone = $("#flow-zone"), saved = flowStateFor(graph.topicId);
  const switched = flowRenderTopic !== graph.topicId;
  const before = switched || restoring ? { scrollTop: saved.scrollTop, atBottom: saved.atBottom } : { scrollTop: zone.scrollTop, atBottom: zone.scrollHeight - zone.scrollTop - zone.clientHeight < 60 };
  const anchor = switched || restoring ? saved.anchor : captureFlowAnchor();
  if (switched) { flowCards.clear(); flowEpisodes.clear(); $("#flow-episodes").replaceChildren(); }
  flowRenderTopic = graph.topicId;
  flowGraph = graph;
  flowNodeKeys = new Set(graph.nodes.map((node) => node.key));
  flowMarks = new Map();
  flowBranches = new Map();
  flowTasks = new Map((state.tasks || []).filter((task) => task.topicId === graph.topicId).map((task) => ["task:" + task.id, task]));
  const add = (index, key, value) => { if (!index.has(key)) index.set(key, []); index.get(key).push(value); };
  for (const edge of graph.edges) if (["unrelayed", "forward", "handoff"].includes(edge.to?.mark)) add(flowMarks, flowNodeKey(edge.from?.nodeKey), edge);
  for (const branch of graph.branches || []) add(flowBranches, flowNodeKey(branch.anchorKey), branch);
  flowMessageIndex = new Map((state.messages || []).filter((m) => m.topicId === graph.topicId).map((m) => [m.id, m]));
  flowMemberIndex = new Map();
  for (const [id, key] of Object.entries(graph.membership)) {
    if (!flowMemberIndex.has(key)) flowMemberIndex.set(key, []);
    flowMemberIndex.get(key).push(id);
  }
  const nodes = new Map(graph.nodes.map((node) => [node.key, node]));
  if (flowJump?.topicId === graph.topicId) {
    const key = flowJump.useOrigin ? graph.origin?.anchorKey : flowJump.anchorKey || graph.membership[flowJump.messageId];
    const target = flowNodeKey(key);
    for (const episode of graph.episodes) if (episode.nodeKeys.includes(target)) saved.episodes.set(episode.key, true);
    if (target) saved.cards.add(target);
    flowJump.target = target;
  }
  for (const [key, card] of flowCards) if (!nodes.has(key)) { card._flowParts.slot.remove(); flowCards.delete(key); }
  const sections = [];
  for (const episode of graph.episodes) {
    let section = flowEpisodes.get(episode.key);
    if (!section) {
      const toggle = el("button", { type: "button", class: "flow-episode-toggle" });
      const origin = el("div", { class: "flow-origin" }), responses = el("div", { class: "flow-responses" });
      const expanded = el("div", { class: "flow-expanded" });
      const body = el("div", { class: "flow-episode-body" }, [origin, responses, expanded]);
      section = el("section", { class: "flow-episode", "data-episode-key": episode.key }, [toggle, body]);
      section._flowParts = { toggle, body, origin, responses, expanded };
      flowEpisodes.set(episode.key, section);
    }
    const open = saved.episodes.has(episode.key) ? saved.episodes.get(episode.key) : !episode.folded;
    const { toggle, body } = section._flowParts;
    const episodeNodes = episode.nodeKeys.map((key) => nodes.get(key)).filter(Boolean);
    const first = episodeNodes.find((node) => node.kind === "send") || episodeNodes[0];
    const title = episode.kind === "orphan" ? "起点なし" : String(first?.head || first?.title || first?.text || flowKindLabels[first?.kind] || "会話").replace(/\s+/g, " ").slice(0, 60);
    const count = episode.count || {};
    const relayHops = episodeNodes.filter((node) => node.kind === "relay").reduce((sum, node) => sum + (node.hops?.length || 0), 0);
    toggle.textContent = (open ? "▾ " : "▸ ") + title + " · 応答 " + (count.replies || 0) + (relayHops ? "／リレー " + relayHops + "手" : "") + "／成果物 " + (count.artifacts || 0) + "／タスク " + (count.tasks || 0) + "／外部同期 " + (count.syncs || 0);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.onclick = () => { saved.episodes.set(episode.key, !open); refreshFlowDetails(graph.topicId); };
    body.hidden = !open;
    section.classList.toggle("is-inferred", episodeNodes.some((node) => node.inferred));
    const responseAgents = participantsOf();
    section._flowParts.responses.style.setProperty("--flow-agents", Math.max(1, responseAgents.length));
    const cards = episodeNodes.map((node) => {
      let card = flowCards.get(node.key);
      if (!card) { card = createFlowCard(node.key); flowCards.set(node.key, card); }
      updateFlowCard(card, node, saved, graph.origin);
      const lane = responseAgents.indexOf(node.agent || node.origin);
      card._flowParts.slot.style.gridColumn = node.kind === "relay" ? "1 / -1" : String(lane >= 0 ? lane + 1 : Math.max(1, responseAgents.length));
      return card._flowParts.slot;
    });
    const originIndex = episodeNodes.findIndex((node) => node.kind === "send");
    // 起点なし（orphan）束は origin 列を空にして全件を responses へ（応答やリレーを起点列へ昇格させない）
    if (originIndex >= 0 && cards[originIndex]) cards[originIndex].style.gridColumn = "auto";
    reconcileFlowChildren(section._flowParts.origin, originIndex >= 0 ? cards.filter((_, i) => i === originIndex) : []);
    reconcileFlowChildren(section._flowParts.responses, originIndex >= 0 ? cards.filter((_, i) => i !== originIndex) : cards);
    reconcileFlowChildren(section._flowParts.expanded, episodeNodes.filter((node) => saved.cards.has(node.key)).map((node) => flowCards.get(node.key)._flowParts.detail));
    sections.push(section);
  }
  const episodeKeys = new Set(graph.episodes.map((episode) => episode.key));
  for (const [key, section] of flowEpisodes) if (!episodeKeys.has(key)) { section.remove(); flowEpisodes.delete(key); }
  reconcileFlowChildren($("#flow-episodes"), sections);
  $("#flow-empty").textContent = "まだ発言がありません";
  $("#flow-empty").hidden = sections.length > 0;
  const warnings = $("#flow-warnings");
  warnings.hidden = !(graph.warnings || []).length;
  warnings.querySelector("summary").textContent = "一部の参照を確認できません（" + (graph.warnings || []).length + "件）";
  warnings.querySelector(".flow-text").textContent = (graph.warnings || []).join("\n");
  const newKeys = new Set(graph.nodes.filter((node) => node.kind !== "pending").map((node) => node.key));
  const messageIds = new Set(Object.keys(graph.membership));
  const addedContent = saved.nodeKeys && ([...newKeys].some((key) => !saved.nodeKeys.has(key)) || [...messageIds].some((id) => !saved.messageIds?.has(id)));
  if (!userAction && addedContent && !before.atBottom) saved.unseen = true;
  saved.nodeKeys = newKeys;
  saved.messageIds = messageIds;
  saved.atBottom = before.atBottom;
  zone.scrollTop = before.atBottom ? zone.scrollHeight : before.scrollTop;
  if (!before.atBottom) restoreFlowAnchor(anchor);
  saved.anchor = captureFlowAnchor();
  saved.scrollTop = zone.scrollTop;
  if (userAction) saved.atBottom = zone.scrollHeight - zone.scrollTop - zone.clientHeight < 60;
  if (before.atBottom) saved.unseen = false;
  $("#flow-new").hidden = !saved.unseen;
  if (flowJump?.topicId === graph.topicId) {
    const jump = flowJump;
    flowJump = null;
    const card = flowCards.get(jump.target);
    if (card) {
      card.scrollIntoView({ block: "center" });
      card.focus({ preventScroll: true });
      card.classList.add("flow-highlight");
      setTimeout(() => card.classList.remove("flow-highlight"), 2000);
      saved.atBottom = zone.scrollHeight - zone.scrollTop - zone.clientHeight < 60;
      saved.scrollTop = zone.scrollTop;
      saved.anchor = captureFlowAnchor();
    } else toast("分岐点の参照が見つかりません");
  }
  scheduleFlowLinks();
}

function scheduleFlowLinks() {
  cancelAnimationFrame(flowLinksRaf);
  flowLinksRaf = requestAnimationFrame(() => {
    try {
      if (displayedView === "flow" && displayedTopicId) flowStateFor(displayedTopicId).anchor = captureFlowAnchor();
      drawFlowLinks();
    }
    catch (error) { $("#flow-links").replaceChildren(); console.warn(error); }
  });
}

function drawFlowLinks() {
  const svg = $("#flow-links");
  if (displayedView !== "flow" || !flowGraph) { svg.replaceChildren(); return; }
  const canvas = $("#flow-canvas"), rect = canvas.getBoundingClientRect(), viewport = $("#flow-zone").getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + Math.max(1, canvas.scrollWidth) + " " + Math.max(1, canvas.scrollHeight));
  svg.style.width = canvas.scrollWidth + "px";
  svg.style.height = canvas.scrollHeight + "px";
  const paths = [];
  const connect = (from, to, fromPort, toPort, style) => {
    if (!from?.getClientRects().length || !to?.getClientRects().length) return;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if ((a.bottom < viewport.top || a.top > viewport.bottom) && (b.bottom < viewport.top || b.top > viewport.bottom)) return;
    const point = (r, port) => ({ x: (port === "left" ? r.left : port === "right" ? r.right : r.left + r.width / 2) - rect.left, y: (port === "top" ? r.top : port === "bottom" ? r.bottom : r.top + r.height / 2) - rect.top });
    const start = point(a, fromPort), end = point(b, toPort);
    const curve = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const middle = (start.x + end.x) / 2;
    curve.setAttribute("d", "M " + start.x + " " + start.y + " C " + middle + " " + start.y + ", " + middle + " " + end.y + ", " + end.x + " " + end.y);
    curve.setAttribute("class", "flow-edge " + (style === "dashed" ? "is-dashed" : style === "gray" ? "is-gray" : ""));
    paths.push(curve);
  };
  for (const edge of flowGraph.edges) {
    if (edge.to?.mark || edge.kind === "relay-hop" || edge.kind === "branch") continue;
    const from = flowCards.get(flowNodeKey(edge.from?.nodeKey)), to = flowCards.get(flowNodeKey(edge.to?.nodeKey));
    if (from !== to) connect(from, to, edge.from?.port || "right", edge.to?.port || "left", edge.style);
  }
  for (const card of flowCards.values()) {
    const hops = [...card._flowParts.detail.querySelectorAll(".flow-hop")];
    for (let i = 1; i < hops.length; i++) connect(hops[i - 1], hops[i], "bottom", "top", "solid");
    for (const branch of card._flowParts.branches.querySelectorAll(".flow-branch")) connect(card, branch, "right", "left", "solid");
  }
  svg.replaceChildren(...paths);
}

$("#flow-zone").addEventListener("scroll", () => {
  if (displayedView !== "flow" || !displayedTopicId) return;
  const zone = $("#flow-zone"), saved = flowStateFor(displayedTopicId);

function render() {
  ensureTopic();
  const topicId = currentTopic()?.id || null;
  let nextView = flowLoadState === "ready" ? requestedView() : "columns";
  let graph = null;
  flowRenderError = "";
  if (nextView === "flow" && flowLoadState === "ready") {
    try { graph = deriveCurrentFlow(); }
    catch (error) { flowRenderError = "このトピックのフローを表示できません。次の更新で再試行します。"; nextView = "columns"; console.warn(error); }
  }
  const transition = displayedTopicId !== topicId || displayedView !== nextView;
  if (transition) saveDisplayedPosition();
  const bottoms = !transition && displayedView === "columns" ? captureThreadBottoms() : new Map();
  syncAgentDefinitions();
  ensureAgentColumns();
  displayedTopicId = topicId;
  displayedView = nextView;
  document.body.classList.toggle("flow-view", nextView === "flow");
  $("#flow-zone").hidden = nextView !== "flow";
  if (nextView === "flow") {
    dirtyThreadTopics.add(topicId);
    try {
      renderFlow(graph, false, transition);
    } catch (error) {
      flowRenderError = "このトピックのフローを表示できません。次の更新で再試行します。";
      console.warn(error);
      nextView = displayedView = "columns";
      flowGraph = null; flowRenderTopic = null;
      document.body.classList.remove("flow-view"); $("#flow-zone").hidden = true;
    }
  }
  if (nextView !== "flow") { $("#flow-new").hidden = true; flowJump = null; }
  else if (flowJump && flowJump.topicId !== topicId) flowJump = null;
  syncSendTargets();
  renderAuthControls();
  syncAgentAction();
  if ($("#pool-dialog").open) syncPoolReviewers();
  renderTopicBar();
  renderProjectUI();
  const restoringColumns = nextView === "columns" && (transition || dirtyThreadTopics.has(topicId));
  const saved = restoringColumns ? columnScrollStates.get(topicId) : null;
  for (const agent of participantsOf().filter((id) => agentIds().includes(id))) {
    if (nextView === "columns") renderThread(agent, saved?.get(agent)?.atBottom ?? bottoms.get(agent));
    if (nextView === "columns") renderTasks(agent);
    renderAgentStatus(agent);
  }
  renderQaBar();
  renderBudgetBar();
  renderHealth();
  renderPool();
  if (nextView === "columns") {
    if (restoringColumns) restoreColumnPosition(topicId);
    else restoreThreadBottoms(bottoms);
    dirtyThreadTopics.delete(topicId);
  }
  scheduleLinks();
}

const TEXT_EXTS_UI = ["md", "txt", "log", "json", "js", "mjs", "ts", "tsx", "jsx", "py", "rs", "html", "css", "csv", "yaml", "yml", "toml", "sh", "diff", "patch"];
const IMAGE_EXTS_UI = ["png", "jpg", "jpeg", "gif", "svg", "webp"];
const VIDEO_EXTS_UI = ["mp4", "webm", "mov"];
const AUDIO_EXTS_UI = ["mp3", "wav", "ogg", "m4a"];
const extOf = (name) => (name.split(".").pop() || "").toLowerCase();
const isTextExt = (name) => TEXT_EXTS_UI.includes(extOf(name));
const isImageExt = (name) => IMAGE_EXTS_UI.includes(extOf(name));
const isVideoExt = (name) => VIDEO_EXTS_UI.includes(extOf(name));

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

// ファイルプレビューのキャッシュ（file+mtime をキーに再取得を抑制）
const poolPreview = {};
// 存在しないメディア参照（再描画のたびに404を出さないための失敗キャッシュ）
const mediaFailed = new Set();
// 展開中のレビュー id（既定は折りたたみ・判定チップのみ表示）
const openReviews = new Set();

// 選択中の成果物だけを保持。SSE の再描画では再取得せず、履歴・実行状態の変化で更新する。
let poolHistory = null;
const VERSION_REASONS = { "fix-before": "修正前", "fix-after": "修正後", review: "レビュー開始" };
const HISTORY_UNSUPPORTED = { binary: "UTF-8テキスト以外", "too-large": "256 KiB超", "no-file": "ファイル実体なし" };

async function readPoolHistory(url) {
  const res = await fetch(url, { cache: "no-store" });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "履歴を取得できません（HTTP " + res.status + "）");
  return data;
}

function poolHistoryState(p) {
  const key = JSON.stringify([p.id, p.file, p.mtime, p.size, p.missing, p.versions, p.versionsUnsupported,
    (p.reviews || []).length, (p.fixes || []).length,
    (state.reviewPending || {})[p.id], (state.fixPending || {})[p.id]]);
  if (poolHistory && poolHistory.key === key) return poolHistory;
  const previous = poolHistory && poolHistory.itemId === p.id ? poolHistory : null;
  // 再取得中も保存済み一覧を維持し、SSEで届いた新しい版を補う。
  const versions = new Map((previous ? previous.versions : []).map((v) => [v.id, v]));
  for (const version of p.versions || []) versions.set(version.id, version);
  const history = poolHistory = {
    itemId: p.id, key, pending: true, versions: [...versions.values()].sort((a, b) => a.n - b.n),
    unsupportedReason: p.versionsUnsupported !== undefined ? p.versionsUnsupported : previous?.unsupportedReason,
    selectedToId: previous ? previous.selectedToId : null,
    diff: previous ? previous.diff : null,
  };
  // ファイル実体のない旧形式はサーバに聞くまでもなく対象外（選択のたびの往復を省く）
  if (!p.file) {
    history.pending = false;
    history.unsupportedReason = "no-file";
    return history;
  }
  readPoolHistory("/api/pool/" + encodeURIComponent(p.id) + "/versions")
    .then((data) => {
      if (!Array.isArray(data.versions)) throw new Error("履歴の応答形式を確認してください");
      history.versions = [...data.versions].sort((a, b) => a.n - b.n);
      history.unsupportedReason = data.unsupportedReason;
    })
    .catch((e) => { history.error = e.message; })
    .finally(() => {
      history.pending = false;
      if (poolHistory === history && poolSelectedId === p.id) renderPool();
    });
  return history;
}

function versionLabel(versions, id) {
  if (!id) return "版未記録";
  const version = versions.find((v) => v.id === id);
  return version ? "v" + version.n : "保存版（番号不明）";
}

function poolHistoryEl(p, history) {
  const section = el("section", { class: "p-history", "aria-label": "成果物の履歴" });
  section.appendChild(el("div", { class: "history-head" }, [
    el("strong", { text: "履歴" }),
    el("button", { class: "small", text: "再取得", onclick: () => {
      // 比較先の選択は維持する（失敗からの復旧のたびに選び直させない）
      history.key = null; history.diff = null; renderPool();
    } }),
  ]));
  const note = (text, warning = false) => el("div", { class: "history-note" + (warning ? " history-warning" : ""), text });
  if (history.pending) section.appendChild(note("履歴を読み込み中…"));
  if (history.error) section.appendChild(note("履歴の読み込み失敗: " + history.error + "。「再取得」で再試行できます。", true));
  if (history.unsupportedReason) {
    section.appendChild(note("履歴対象外（" + (HISTORY_UNSUPPORTED[history.unsupportedReason] || history.unsupportedReason) + "）"));
  }
  if (!history.versions.length) {
    if (!history.pending && !history.error && !history.unsupportedReason) section.appendChild(note("保存版はまだありません。レビュー開始・修正時に保存されます。"));
    return section;
  }
  section.appendChild(note("修正・レビュー開始時の保存版です。外部編集の全履歴は保存しません。"));
  const list = el("ol", { class: "history-list" });
  for (let i = history.versions.length - 1; i >= 0; i--) {
    const version = history.versions[i];
    const savedAt = new Date(version.ts);
    const row = el("li", { class: "history-row" }, [
      el("strong", { text: "v" + version.n }),
      el("span", { text: VERSION_REASONS[version.reason] || version.reason || "理由未記録" }),
      el("span", { text: NAMES[version.agent] || "担当未記録" }),
      el("time", { text: savedAt.toLocaleString("ja-JP"),
        ...(Number.isNaN(savedAt.getTime()) ? {} : { datetime: savedAt.toISOString() }) }),
      el("span", { text: fmtSize(version.size) }),
    ]);
    if (version.partial) row.appendChild(el("span", { class: "history-warning", text: "途中失敗", title: "修正は失敗しましたが、変更された内容を保存しました" }));
    if (i > 0) {
      const from = history.versions[i - 1];
      row.appendChild(el("button", {
        class: "small", text: "v" + from.n + " → v" + version.n + " の差分",
        "aria-pressed": String(history.selectedToId === version.id),
        onclick: () => { history.selectedToId = version.id; renderPool(); },
      }));
    }
    list.appendChild(row);
  }
  section.appendChild(list);
  const index = history.versions.findIndex((v) => v.id === history.selectedToId);
  if (index < 1) {
    section.appendChild(note(history.versions.length === 1 ? "比較には2版以上必要です。" : "一覧の「差分」から直前の版と比較できます。"));
    return section;
  }
  const from = history.versions[index - 1], to = history.versions[index];
  const diffKey = JSON.stringify([from.id, to.id]);
  if (!history.diff || history.diff.key !== diffKey) {
    const diff = history.diff = { key: diffKey, pending: true, scrollTop: 0, scrollLeft: 0 };
    const query = new URLSearchParams({ from: from.id, to: to.id });
    readPoolHistory("/api/pool/" + encodeURIComponent(p.id) + "/diff?" + query)
      .then((data) => {
        if (typeof data.diff !== "string") throw new Error("差分の応答形式を確認してください");
        diff.data = data;
      })
      .catch((e) => { diff.error = e.message; })
      .finally(() => {
        diff.pending = false;
        // 項目・比較先を切り替えた後に古い応答で表示を戻さない。
        if (poolHistory && poolHistory.itemId === p.id && poolHistory.diff === diff && poolSelectedId === p.id) renderPool();
      });
  }
  section.appendChild(el("strong", { class: "history-diff-title", text: "v" + from.n + " → v" + to.n + " の差分" }));
  const diff = history.diff;
  if (diff.pending) section.appendChild(note("差分を読み込み中…"));
  else if (diff.error) {
    section.appendChild(note("差分の読み込み失敗: " + diff.error, true));
    section.appendChild(el("button", { class: "small", text: "差分を再試行", onclick: () => { history.diff = null; renderPool(); } }));
  } else {
    if (diff.data.truncated) section.appendChild(note("差分は一部のみ表示しています（256 KiB上限）。全文ではありません。", true));
    if (!diff.data.diff) section.appendChild(note(diff.data.truncated ? "表示できる差分がありません。" : "内容の差分はありません。"));
    else {
      // 数千ノードになり得るため一度だけ構築し、SSE再描画では同じ要素を使い回す
      if (!diff.el) {
        const pre = diff.el = el("pre", {
          class: "history-diff", tabindex: "0", "aria-label": "v" + from.n + " から v" + to.n + " の差分",
          onscroll: (e) => { diff.scrollTop = e.target.scrollTop; diff.scrollLeft = e.target.scrollLeft; },
        });
        // 成果物由来の差分は必ず textContent 経由。HTML/Markdown として解釈しない。
        // 行は display:block（コピー時は要素境界が改行になる）
        const lines = diff.data.diff.split("\n");
        if (lines[lines.length - 1] === "") lines.pop();
        lines.forEach((line, i) => {
          const header = i < 2 && /^(---|\+\+\+) v\d+$/.test(line);
          const kind = !header && line.startsWith("+") ? " diff-add"
            : !header && line.startsWith("-") ? " diff-remove" : "";
          pre.appendChild(el("span", { class: "diff-line" + kind, text: line }));
        });
      }
      const pre = diff.el;
      section.appendChild(pre);
      requestAnimationFrame(() => { if (pre.isConnected) { pre.scrollTop = diff.scrollTop; pre.scrollLeft = diff.scrollLeft; } });
    }
  }
  return section;
}

// api() の409表示を維持し、失敗時に成功トーストや未処理のPromiseを残さない。
async function poolAction(path, method, body, successMessage) {
  try {
    await api(path, method, body);
    if (successMessage) toast(successMessage);
  } catch (e) {
    // HTTPエラーはapi()が通知済み。fetchのネットワーク例外だけ補う。
    if (e instanceof TypeError) toast(e.message || "通信に失敗しました");
  }
}

function poolPreviewEl(p) {
  const body = el("div", { class: "p-body mdview" });
  if (p.body) {
    body.innerHTML = renderMarkdown(p.body); // 旧形式
    return body;
  }
  if (!p.file || p.missing) {
    body.appendChild(el("div", { class: "empty", text: p.missing ? "ファイルが見つかりません" : "" }));
    return body;
  }
  const url = "/api/pool/file/" + encodeURIComponent(p.file);
  if (isImageExt(p.file)) {
    body.appendChild(el("img", { src: url + "?v=" + (p.mtime || 0), alt: p.title }));
    return body;
  }
  if (isVideoExt(p.file)) {
    body.appendChild(el("video", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;max-height:360px;border-radius:8px;" }));
    return body;
  }
  if (isAudioExt(p.file)) {
    body.appendChild(el("audio", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;" }));
    return body;
  }
  if (extOf(p.file) === "html" || extOf(p.file) === "htm") {
    // HTML は iframe でその場実行（ゲーム・デモ対応）。
    // allow-same-origin がないと localStorage 等で成果物側が停止するため付与
    // （ローカル単一ユーザーのツールで、プール内容は自分のエージェント由来という前提）
    body.appendChild(el("iframe", {
      src: url + "?v=" + (p.mtime || 0),
      sandbox: "allow-scripts allow-same-origin allow-pointer-lock",
      style: "width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#0e1116;",
    }));
    return body;
  }
  if (!isTextExt(p.file) || (p.size || 0) > 300_000) {
    body.appendChild(el("div", { class: "empty", text: "プレビューなし — リンクから開いてください" }));
    return body;
  }
  const key = p.file + ":" + (p.mtime || 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    if (extOf(p.file) === "md") body.innerHTML = renderMarkdown(cached.text);
    else body.innerHTML = "<pre><code>" + escapeHtml(cached.text) + "</code></pre>";
    return body;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch(url).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
  return body;
}

// ドラッグ＆ドロップ（アプリ内の移動 + OS からのファイルドロップ）
function wireDropTarget(node, destDirFn) {
  node.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.add("dragover");
  });
  node.addEventListener("dragleave", () => node.classList.remove("dragover"));
  node.addEventListener("drop", async (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.remove("dragover");
    const destDir = destDirFn();
    const payload = e.dataTransfer.getData("text/u2a2a");
    if (payload) {
      const { src } = JSON.parse(payload);
      if (src === destDir || destDir.startsWith(src + "/")) return;
      return poolMove(src, destDir);
    }
    // Finder 等からの OS ファイルドロップはアップロードとして受ける
    for (const f of e.dataTransfer.files || []) {
      const buf = await f.arrayBuffer();
      let bin = "";
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      await api("/api/pool/upload", "POST", { origin: "user", filename: f.name, dataBase64: btoa(bin), dir: destDir, autoReview: false });
      toast("アップロードしました: " + f.name);
    }
  });
}

function wireDragSource(node, relPath) {
  node.setAttribute("draggable", "true");
  node.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/u2a2a", JSON.stringify({ src: relPath }));
    e.dataTransfer.effectAllowed = "copyMove";
  });
}

function fileRowEl(p, depth) {
  const pending = (state.reviewPending || {})[p.id] || [];
  const busy = pending.length || (state.fixPending || {})[p.id];
  const base = (p.file || p.title).split("/").pop();
  const row = el("div", {
    class: "pf-row" + (p.id === poolSelectedId ? " sel" : "") + (busy ? " glow-run" : ""),
    "data-file": p.file || "",
    style: "padding-left:" + (8 + depth * 14) + "px",
    onclick: () => {
      poolSelectedId = p.id;
      poolCurrentDir = (p.file || "").includes("/") ? p.file.slice(0, p.file.lastIndexOf("/")) : "";
      if (p.file) poolFocus = { kind: "file", path: p.file };
      if (document.body.classList.contains("pool-collapsed")) togglePool(false);
      renderPool();
    },
  }, [
    el("span", { class: "pf-dot", "data-s": p.status, title: POOL_STATUS_LABEL[p.status] || p.status }),
    el("span", { class: "pf-name", text: base + (busy ? " …" : ""), title: p.title }),
    el("span", { class: "pf-size", text: fmtSize(p.size) }),
  ]);
  if (p.file) wireDragSource(row, p.file);
  return row;
}

function renderPool() {
  const listBox = $("#pool-list");
  const detailBox = $("#pool-detail");
  const all = [...(state.pool || [])].reverse(); // 新しい順
  const q = $("#pool-search").value.trim().toLowerCase();
  const items = q
    ? all.filter((p) => (p.title + " " + (p.file || "") + " " + NAMES[p.origin]).toLowerCase().includes(q))
    : all;
  $("#pool-count").textContent = all.length ? (q ? items.length + "/" + all.length : all.length) + " 件" : "";
  // 移動などでフォルダが消えていたら作成先をルートへ戻す
  if (poolCurrentDir && !(state.poolDirs || []).includes(poolCurrentDir)) poolCurrentDir = "";
  $("#pool-cwd").textContent = "作成先: pool/" + (poolCurrentDir ? poolCurrentDir + "/" : "");
  renderClipBar();

  listBox.replaceChildren();
  const isTopicSel = typeof poolSelectedId === "string" && poolSelectedId.startsWith("topic:");
  // 選択の有効性は検索フィルタ前の全件で判定する（フローの成果物カード等、検索に一致しない項目の選択を黙って先頭へ飛ばさない）
  if (!isTopicSel && !all.some((p) => p.id === poolSelectedId)) poolSelectedId = items.length ? items[0].id : null;

  // 🧵 スレッド履歴（トピック一覧を DAS の一部としてブラウズ）
  const topics = state.topics || [];
  const topicRow = (t, depth) => {
    const active = t.id === (currentTopic() || {}).id;
    return el("div", {
      class: "pf-row" + (poolSelectedId === "topic:" + t.id ? " sel" : ""),
      "data-topic": t.id,
      style: "padding-left:" + (8 + depth * 14) + "px",
      onclick: () => {
        poolSelectedId = "topic:" + t.id;
        if (document.body.classList.contains("pool-collapsed")) togglePool(false);
        renderPool();
      },
    }, [
      el("span", { class: "pf-dot", style: active ? "background:var(--user)" : "", title: active ? "表示中" : "" }),
      el("span", { class: "pf-name", text: "🧵 " + t.title }),
      el("span", { class: "pf-size", text: (state.messages || []).filter((m) => m.topicId === t.id).length + " msg" }),
    ]);
  };
  const qTopics = q ? topics.filter((t) => t.title.toLowerCase().includes(q)) : [];

  if (q) {
    // 検索中はフラット表示（パス付き・スレッドも横断）
    for (const t of qTopics) listBox.appendChild(topicRow(t, 0));
    if (!items.length && !qTopics.length) listBox.appendChild(el("div", { class: "empty", text: "検索に一致なし" }));
    for (const p of items) {
      const row = fileRowEl(p, 0);
      row.querySelector(".pf-name").textContent = p.file || p.title;
      listBox.appendChild(row);
    }
  } else {
    const thOpen = !closedDirs.has("threads");
    listBox.appendChild(el("div", {
      class: "pf-row folder",
      title: "スレッド履歴（自動生成ミラー: pool/threads/）",
      onclick: () => {
        thOpen ? closedDirs.add("threads") : closedDirs.delete("threads");
        renderPool();
      },
    }, [
      el("span", { class: "chev", text: thOpen ? "▾" : "▸" }),
      el("span", { class: "pf-name", text: "🧵 スレッド履歴" }),
      el("span", { class: "pf-size", text: topics.length + " 件" }),
    ]));
    if (thOpen) for (const t of topics) listBox.appendChild(topicRow(t, 1));
  }
  if (!q) {
    // Finder 風ツリー（フォルダ＋ファイル）
    const dirs = state.poolDirs || [];
    const byDir = (dir) => items.filter((p) => {
      const f = p.file || "";
      const parent = f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "";
      return parent === dir;
    });
    const childDirs = (dir) => dirs.filter((d) => {
      const parent = d.includes("/") ? d.slice(0, d.lastIndexOf("/")) : "";
      return parent === dir && d !== dir;
    });
    const renderDir = (dir, depth) => {
      for (const d of childDirs(dir)) {
        const open = !closedDirs.has(d);
        let name = d.split("/").pop();
        // topics/<id> はトピックタイトルで表示（パスは不変・表示だけ state から）
        if (d === "topics") name = "topics（トピック別成果物）";
        else if (/^topics\/[0-9a-f]{16}$/.test(d)) {
          const tp = (state.topics || []).find((x) => x.id === name);
          name = tp ? "🧵 " + tp.title : name.slice(0, 8) + "…（削除済みトピック）";
        }
        const folderRow = el("div", {
          class: "pf-row folder" + (poolCurrentDir === d ? " cwd" : ""),
          "data-dir": d,
          style: "padding-left:" + (8 + depth * 14) + "px",
          title: "クリックで作成先に指定 ／ ドロップで移動先に",
          onclick: () => {
            if (poolCurrentDir === d) {
              closedDirs.has(d) ? closedDirs.delete(d) : closedDirs.add(d);
            }
            poolCurrentDir = d;
            poolFocus = { kind: "dir", path: d };
            renderPool();
          },
        }, [
          el("span", { class: "chev", text: open ? "▾" : "▸" }),
          el("span", { class: "pf-name", text: "📁 " + name }),
        ]);
        wireDragSource(folderRow, d);
        wireDropTarget(folderRow, () => d);
        listBox.appendChild(folderRow);
        if (open) renderDir(d, depth + 1);
      }
      for (const p of byDir(dir)) listBox.appendChild(fileRowEl(p, depth));
    };
    renderDir("", 0);
    if (!items.length && !dirs.length) {
      listBox.appendChild(el("div", { class: "empty", text: "成果物なし — u2a2a/pool/ に置くか「＋持ち込み」" }));
    }
  }

  // 詳細
  detailBox.replaceChildren();
  const selItem = isTopicSel ? null : items.find((p) => p.id === poolSelectedId);
  updatePoolGlow(detailBox, selItem);
  if (isTopicSel) {
    const t = topics.find((x) => "topic:" + x.id === poolSelectedId);
    if (t) {
      renderTopicDetail(detailBox, t);
      return;
    }
  }
  const sel = selItem;
  if (!sel) {
    detailBox.appendChild(el("div", { class: "empty", text: "ファイルを選択してください" }));
    return;
  }
  renderPoolDetail(detailBox, sel);
}

// プール詳細パネルの発光。実行中は呼吸、レビュー判定・修正完了の着弾時は結果色を一瞬点灯
// 承認=青 / 条件付き承認=黄 / 差し戻し・エラー=赤
const poolRunSeen = {}; // itemId -> { r: レビュー件数, f: 修正件数 }
let poolSeenInit = false;
function updatePoolGlow(detailBox, sel) {
  let flash = "";
  for (const p of state.pool || []) {
    const seen = poolRunSeen[p.id] || { r: (p.reviews || []).length, f: (p.fixes || []).length };
    const r = (p.reviews || []).length, f = (p.fixes || []).length;
    if (poolSeenInit && sel && p.id === sel.id) {
      if (r > seen.r) {
        const last = p.reviews[r - 1];
        // stopped（権限要求または中断で停止）は成功色にしない
        flash = last.skipped || last.stopped ? "wait" : last.error || last.verdict === "差し戻し" ? "err" : last.verdict === "条件付き承認" ? "wait" : "ok";
      } else if (f > seen.f) {
        const lastFix = p.fixes[f - 1];
        flash = lastFix.error ? "err" : lastFix.stopped ? "wait" : "ok";
      }
    }
    poolRunSeen[p.id] = { r, f };
  }
  poolSeenInit = true;
  const busy = sel && (((state.reviewPending || {})[sel.id] || []).length || (state.fixPending || {})[sel.id]);
  detailBox.dataset.glow = busy ? "run" : "";
  if (flash) {
    detailBox.removeAttribute("data-flash");
    void detailBox.offsetWidth; // 再点灯できるようアニメーションをリセット
    detailBox.dataset.flash = flash;
  }
}
$("#pool-detail").addEventListener("animationend", (e) => {
  if (e.animationName.startsWith("flash-")) $("#pool-detail").removeAttribute("data-flash");
});

function renderTopicDetail(box, t) {
  const msgs = (state.messages || []).filter((m) => m.topicId === t.id);
  const active = t.id === (currentTopic() || {}).id;
  // トピック累計（コスト・トークン）
  const tot = msgs.reduce(
    (a, m) => {
      if (m.meta) {
        const u = m.meta.usage || m.meta;
        a.cost += (m.meta.billing && m.meta.billing.mode === "metered" ? m.meta.billing.usd : m.meta.costUsd) || 0;
        a.inTok += u.inTok || 0;
        a.outTok += u.outTok || 0;
      }
      return a;
    },
    { cost: 0, inTok: 0, outTok: 0 }
  );
  box.appendChild(el("div", { class: "p-head" }, [
    el("span", { class: "origin", text: "🧵 スレッド履歴" }),
    el("span", { class: "p-title", text: t.title }),
    el("span", { class: "pf-size", text: msgs.length + " メッセージ" }),
    el("span", {
      class: "pf-size",
      text: "累計 in " + fmtTok(tot.inTok) + " / out " + fmtTok(tot.outTok) + (tot.cost ? " / $" + tot.cost.toFixed(2) + "（実測分）" : ""),
    }),
  ]));
  box.appendChild(projectDetailsEl(t.projectId));
  for (const id of participantsOf(t)) box.appendChild(el("div", { class: "p-file", text: NAMES[id] + ": " + (t.agents?.[id]?.sessionId || "セッション未開始") }));
  if (t.mirrorFile) {
    const url = "/api/pool/file/" + encodeURIComponent(t.mirrorFile);
    box.appendChild(el("div", { class: "p-file" }, [
      el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + t.mirrorFile }),
      el("span", { class: "p-size", text: "自動生成ミラー（エージェントもこのパスで参照可）" }),
    ]));
  }
  if (t.branchedFrom) {
    const src = (state.topics || []).find((x) => x.id === t.branchedFrom.topicId);
    box.appendChild(el("div", { class: "p-file" }, [
      el("a", {
        href: "#",
        text: "🌿 分岐元: " + (src ? src.title : "（削除済みトピック）"),
        onclick: (e) => {
          e.preventDefault();
          if (src) switchTopic(src.id);
        },
      }),
    ]));
  }
  const actions = el("div", { class: "actions" }, [
    el("button", { class: "small", text: active ? "表示中のスレッドです" : "このスレッドを開く", onclick: () => { if (!active) switchTopic(t.id); } }),
    el("button", {
      class: "small",
      text: "履歴をコピー",
      onclick: async () => {
        if (!t.mirrorFile) return;
        const r = await fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile));
        copy(await r.text());
      },
    }),
    el("button", {
      class: "small",
      text: "📌 要約を更新",
      onclick: () => api("/api/topics/" + t.id + "/summarize", "POST", {})
        .then(() => toast("要約を生成中…（完了するとミラーの📌概要が更新されます）")),
    }),
  ]);
  box.appendChild(actions);
  // 履歴プレビュー（ミラーファイルを取得して Markdown 表示）
  const body = el("div", { class: "p-body mdview" });
  box.appendChild(body);
  if (!t.mirrorFile) return;
  const key = t.mirrorFile + ":" + msgs.length + ":" + (msgs.length ? msgs[msgs.length - 1].ts : 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    body.innerHTML = renderMarkdown(cached.text);
    return;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile)).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
}

function renderPoolDetail(box, p) {
  {
    const pending = (state.reviewPending || {})[p.id] || [];
    const head = el("div", { class: "p-head" }, [
      el("span", { class: "status", "data-s": p.status, text: POOL_STATUS_LABEL[p.status] || p.status }),
      el("span", {
        class: "origin",
        "data-o": p.origin || "",
        text: p.origin ? "持ち込み: " + NAMES[p.origin] : "作者未確定",
        title: p.origin ? "" : "実行が複数同時だったため確定できませんでした。レビュー依頼等で正しい作者が判明したら宣言で上書きされます",
      }),
      el("span", { class: "p-title", text: p.title }),
    ]);
    const VIA_LABEL = { folder: "フォルダ投入", upload: "アップロード", created: "新規作成", declared: "宣言", inferred: "推定", agent: "実行中推定" };
    if (VIA_LABEL[p.via]) head.appendChild(el("span", { class: "origin", text: VIA_LABEL[p.via] }));

    const kids = [head];
    if (p.projectId) kids.push(projectBadge(p.projectId));
    if (p.file) {
      const fileUrl = "/api/pool/file/" + encodeURIComponent(p.file);
      const fileRow = el("div", { class: "p-file" }, [
        el("a", { href: fileUrl, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + p.file }),
        el("span", { class: "p-size", text: fmtSize(p.size) + (p.missing ? "（ファイルが見つかりません）" : "") }),
      ]);
      kids.push(fileRow);
    }
    kids.push(poolPreviewEl(p));
    const history = poolHistoryState(p);
    kids.push(poolHistoryEl(p, history));
    if (Array.isArray(p.reviewers)) kids.push(el("div", { class: "project-hint", text: "保存された依頼先: " + (p.reviewers.map((id) => NAMES[id] || id).join("・") || "なし") }));
    for (const r of p.reviews || []) {
      if (r.skipped) {
        kids.push(el("div", { class: "review history-warning", text: (NAMES[r.reviewer] || r.reviewer) + " — 未実施: " + (r.reason || "理由未記録") + " ／ " + fmtTime(r.ts) }));
        continue;
      }
      const rOpen = openReviews.has(r.id);
      const rHead = el("div", {
        class: "r-head",
        onclick: () => {
          rOpen ? openReviews.delete(r.id) : openReviews.add(r.id);
          renderPool();
        },
      }, [
        el("span", { class: "chev", text: rOpen ? "▾" : "▸" }),
        el("span", { class: "reviewer", "data-o": r.reviewer, text: "🔎 " + NAMES[r.reviewer] + " のレビュー" }),
      ]);
      if (r.verdict) rHead.appendChild(el("span", { class: "verdict", "data-v": r.verdict, text: "【判定】" + r.verdict }));
      rHead.appendChild(el("span", {
        class: "review-version", text: "対象: " + versionLabel(history.versions, r.versionId),
        title: [r.versionId, r.sha256].filter(Boolean).join(" / "),
      }));
      if (r.stale) rHead.appendChild(el("span", {
        class: "history-warning", text: "⚠ レビュー中に変更あり",
        title: "レビュー開始時と終了時でファイル内容が異なります。この判定は現在の内容を保証しません。",
      }));
      if (r.meta) rHead.appendChild(metaEl(r.meta));
      const reviewKids = [rHead];
      if (rOpen) {
        const rBody = el("div", { class: "r-body mdview" });
        rBody.innerHTML = renderMarkdown(r.text);
        reviewKids.push(rBody);
      }
      kids.push(el("div", { class: "review" }, reviewKids));
    }
    // 修正履歴（レビューと同じ折りたたみ UI）
    for (const f of p.fixes || []) {
      const fOpen = openReviews.has(f.id);
      const fHead = el("div", {
        class: "r-head",
        onclick: () => {
          fOpen ? openReviews.delete(f.id) : openReviews.add(f.id);
          renderPool();
        },
      }, [
        el("span", { class: "chev", text: fOpen ? "▾" : "▸" }),
        el("span", { class: "reviewer", "data-o": f.agent, text: "🔧 " + NAMES[f.agent] + " の修正" + (f.error ? "（失敗）" : "") }),
        el("span", { class: "pf-size", text: fmtTime(f.ts) }),
      ]);
      if (f.meta) fHead.appendChild(metaEl(f.meta));
      if (f.beforeVersionId || f.afterVersionId) fHead.appendChild(el("span", {
        class: "review-version",
        // チップが出る＝履歴機能は動いていたので、片側の欠落は「未記録」ではなく保存失敗
        text: (f.beforeVersionId ? versionLabel(history.versions, f.beforeVersionId) : "保存失敗")
          + " → " + (f.afterVersionId ? versionLabel(history.versions, f.afterVersionId) : "保存失敗"),
      }));
      const fixKids = [fHead];
      if (f.historyError) fixKids.push(el("div", { class: "history-warning", text: "履歴保存失敗: " + f.historyError }));
      if (fOpen) {
        const fBody = el("div", { class: "r-body mdview" });
        fBody.innerHTML = renderMarkdown(f.text);
        fixKids.push(fBody);
      }
      kids.push(el("div", { class: "review" }, fixKids));
    }
    for (const r of pending) {
      const act = (state.activity || {})["review:" + p.id + ":" + r];
      kids.push(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[r] + " がレビュー中" }));
    }
    const fixer = (state.fixPending || {})[p.id];
    if (fixer) {
      const act = (state.activity || {})["fix:" + p.id];
      kids.push(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[fixer] + " が修正中" }));
    }

    const actions = el("div", { class: "actions" });
    actions.appendChild(el("button", {
      class: "small", text: "レビューを依頼…",
      ...(fixer ? { disabled: "", title: "修正が完了してからレビューできます" } : {}),
      onclick: () => openAgentAction(p, "review"),
    }));
    if (p.file) actions.appendChild(el("button", {
      class: "small", text: "修正を依頼…",
      ...(fixer || pending.length ? { disabled: "", title: "レビュー・修正が完了してから依頼できます" } : {}),
      onclick: () => openAgentAction(p, "fix"),
    }));
    if (p.status !== "approved")
      actions.appendChild(el("button", { class: "small", text: "承認", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "approved" }) }));
    if (p.status !== "rejected")
      actions.appendChild(el("button", { class: "small", text: "差し戻し", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "rejected" }) }));
    actions.appendChild(el("button", {
      class: "small",
      text: "コピー",
      onclick: async () => {
        if (p.body) return copy(p.body);
        if (p.file && isTextExt(p.file)) {
          const r = await fetch("/api/pool/file/" + encodeURIComponent(p.file));
          return copy(await r.text());
        }
        copy("u2a2a/pool/" + (p.file || ""));
      },
    }));
    actions.appendChild(el("button", {
      class: "small",
      text: "削除",
      ...(fixer || pending.length ? { disabled: "", title: "修正・レビューが完了してから削除できます" } : {}),
      onclick: (e) => armedDelete(e.target, () => poolAction("/api/pool/" + p.id, "DELETE", undefined, ".trash へ退避しました")),
    }));
    kids.push(actions);
    for (const k of kids) box.appendChild(k);
  }
}

function renderHealth() {
  const evs = state.events || [];
  const bad = evs.filter((e) => e.level !== "info").length;
  const btn = $("#health-btn");
  btn.textContent = bad ? "🩺 " + bad : "🩺";
  btn.style.color = evs.some((e) => e.level === "error") ? "var(--danger)" : bad ? "#d8c56f" : "";
  // ダイアログが開いていれば中身も更新
  if ($("#health-dialog").open) fillHealthDialog();
}

function fillHealthDialog() {
  const sm = state.storageMetrics || {};
  $("#health-storage").textContent =
    "state.json: " + fmtSize(sm.lastBytes || 0) + "　保存 " + (sm.saves || 0) + " 回　直近 " + (sm.lastMs || 0) + "ms　累計 " + (sm.totalMs || 0) + "ms";
  const box = $("#health-events");
  box.replaceChildren();
  const unknown = [
    ...state.messages.filter((m) => !provOf(m).source).map((m) => m.meta),
    ...state.pool.flatMap((p) => [...(p.reviews || []), ...(p.fixes || [])].map((r) => r.meta)),
  ].filter((meta) => meta?.billing?.mode === "unknown").length;
  if (unknown) box.appendChild(el("div", { class: "history-warning", text: "費用不明の実行: " + unknown + " 件（保存済み履歴。実測合計に含みません）" }));
  const evs = [...(state.events || [])].reverse();
  if (!evs.length) box.appendChild(el("div", { class: "empty", text: "イベントなし — 静かなのは良い知らせです" }));
  for (const e of evs) {
    const icon = e.level === "error" ? "🔴" : e.level === "warn" ? "🟡" : "🔵";

      el("span", { text: icon + " [" + e.area + "] " + e.message + (e.count > 1 ? "（×" + e.count + "）" : "") }),
    ]));
  }
}

function renderAgentStatus(agent) {

  const checkbox = $("#auto-" + agent);
  checkbox.checked = !!a.auto;
  // キャンセルで中断したセッションがあれば再開ボタンを出す
  const ta = ((currentTopic() || {}).agents || {})[agent] || {};
  const resetBtn = $("#reset-" + agent);
  let resumeBtn = document.getElementById("resume-int-" + agent);
  if (ta.interruptedSessionId && !resumeBtn) {
    resumeBtn = el("button", {
      id: "resume-int-" + agent,
      class: "small",
      text: "↩ 中断分を再開",
      title: "キャンセルで中断した CLI セッションを明示的に再開する",
      onclick: () => {
        const t = currentTopic();
        if (t) api("/api/topics/" + t.id, "PATCH", { resumeInterrupted: agent })
          .then(() => toast(NAMES[agent] + " の中断セッションを再開設定しました"));
      },
    });
    resetBtn.after(resumeBtn);
  } else if (!ta.interruptedSessionId && resumeBtn) {
    resumeBtn.remove();
  }
  const modelInput = $("#model-" + agent);
  modelInput.placeholder = a.model || "model（既定）";
  // 入力中に SSE 更新で上書きしない
  if (document.activeElement !== modelInput) modelInput.value = a.modelOverride || "";
  // 実使用モデルを候補に含める
  const dl = $("#models-" + agent);
  if (a.model && ![...dl.options].some((o) => o.value === a.model)) {
    dl.appendChild(el("option", { value: a.model }));
  }
  const error = ta.lastError || a.lastError;
  if (!agentReady(agent)) {
    status.dataset.s = a.authed === false ? "error" : "wait";
    status.textContent = authLabel(agent);
    status.title = "ヘッダの再確認で認証状態を更新できます";
  } else if (isRunning(agent)) {
    status.dataset.s = "running";
    status.textContent = "応答中…";
    status.title = "";
  } else if (state.budgetHalt && a.auto) {
    status.dataset.s = "error";
    status.textContent = "上限停止中";
    status.title = state.budgetHalt.reason;
  } else if (error) {
    status.dataset.s = "error";
    status.textContent = error.includes("権限") || error.includes("中断") ? error : "エラー（ホバーで詳細）";
    status.title = error;
  } else {
    status.dataset.s = "";
    status.textContent = a.auto ? "CLI 自動応答" : "手動（貼り付け）";
    status.title = "";
  }
  applyThreadGlow(agent, a, ta);
}

// スレッド枠の状態発光。実行中 > エラー > 対応待ち（上限停止・中断・手動対応待ち）> 正常完了
function applyThreadGlow(agent, a, ta) {
  const col = document.querySelector('.thread-col[data-agent="' + agent + '"]');
  const topic = currentTopic();
  if (!col || !topic) return;
  const msgs = state.messages.filter((m) => m.thread === agent && m.topicId === topic.id);
  const last = msgs[msgs.length - 1];
  // 相手（ユーザー・他スレッド）からの発言に未応答のままか
  const unseen = msgs.some((m) => m.author !== agent && m.ts > (ta.lastSeenTs || 0));
  let glow = "";
  if (isRunning(agent)) glow = "run";
  else if (topic.relay?.active && (topic.relay.participants || participantsOf(topic)).includes(agent)) glow = "relay"; // 質疑リレー中は流線と律動を揃えて明滅
  else if (!agentReady(agent)) glow = a.authed === false ? "err" : "wait";
  else if (ta.lastError || a.lastError) glow = "err";
  else if ((state.budgetHalt && a.auto) || ta.interruptedSessionId || (last && last.cancelled)) glow = "wait";
  else if (unseen && !a.auto) glow = "wait";
  else if (last && last.author === agent && last.meta && last.meta.status === "completed") glow = "ok";
  col.dataset.glow = glow;
}

  const isRaw = rawView.has(m.id);

      class: "small",
      text: isRaw ? "MD表示" : "生表示",
      onclick: () => {
        rawView.has(m.id) ? rawView.delete(m.id) : rawView.add(m.id);
        onChange();
      },
    }),
  ]);

  // 転送・質疑中継で届いた内容は送信元に原文があるため、受信側では折りたたみ表示
  let body;
  if (isRelayCopy(m) && !expandedRelays.has(m.id)) {
    body = el("div", {
      class: "relay-collapsed",
      text: (pv.delivery === "handoff" ? "🤝 " + NAMES[pv.source.agent] + " からの引き継ぎ" : "📨 " + NAMES[pv.source.agent] + " 側からの送信テキスト") + "（" + m.text.length + " 文字）— クリックで展開",
      onclick: () => {

        onChange();
      },
    });

        class: "relay-fold",
        text: "（折りたたむ）",
        onclick: () => {
          expandedRelays.delete(m.id);
          onChange();
        },
      }));
    }
  }

  const kids = [meta, body];
  // 本文中の pool パスを検出し、画像はインライン・その他はリンクで自動プレビュー
  if (!(isRelayCopy(m) && !expandedRelays.has(m.id))) {
    const paths = [...new Set(m.text.match(/u2a2a\/pool\/[^\s)"'`」()）]+/g) || [])].slice(0, 4);
    const mediaKids = [];
    for (const full of paths) {
      const rel = full.slice("u2a2a/pool/".length);
      // Markdown 記法で既に本文中に埋め込まれているものは重複させない
      if (new RegExp("\\]\\([^)]*" + rel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\)").test(m.text)) continue;
      const url = "/api/pool/file/" + encodeURI(rel);
      if (mediaFailed.has(rel)) {
        mediaKids.push(el("span", { class: "pf-size", text: "⚠ ファイルが見つかりません: " + full }));
      } else if (isImageExt(rel)) {
        const img = el("img", { src: url, alt: rel, loading: "lazy" });
        img.addEventListener("error", () => { mediaFailed.add(rel); onChange(); });
        mediaKids.push(img);
      } else if (isVideoExt(rel)) {
        const v = el("video", { src: url, controls: "", preload: "metadata", style: "max-width:100%;max-height:260px;border-radius:6px;" });
        v.addEventListener("error", () => { mediaFailed.add(rel); onChange(); });
        mediaKids.push(v);
      } else if (isAudioExt(rel)) {
        const au = el("audio", { src: url, controls: "", preload: "metadata", style: "width:100%;" });
        au.addEventListener("error", () => { mediaFailed.add(rel); onChange(); });
        mediaKids.push(au);
      } else {
        mediaKids.push(el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 " + full }));
      }
    }
    if (mediaKids.length) kids.push(el("div", { class: "msg-media" }, mediaKids));
  }
  if (m.meta && !(isRelayCopy(m) && !expandedRelays.has(m.id))) kids.push(metaEl(m.meta));
  kids.push(actions);
  return el("div", { class: "msg" + (pv.ingress === "cli-sync" ? " external" : ""), "data-author": m.author, "data-mid": m.id }, kids);
}

function renderThread(agent, savedAtBottom) {
  if (displayedView === "flow") { dirtyThreadTopics.add(currentTopic()?.id); return; }
  const box = $("#messages-" + agent);
  const atBottom = savedAtBottom ?? (box.scrollHeight - box.scrollTop - box.clientHeight < 60);
  const topic = currentTopic();
  const msgs = state.messages.filter((m) => m.thread === agent && topic && m.topicId === topic.id);
  $("#count-" + agent).textContent = msgs.length ? msgs.length + " 件" : "";
  box.replaceChildren();
  if (!msgs.length) {
    if (isRunning(agent)) {
      const act = threadActivity(agent);
      box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
    } else {
      box.appendChild(el("div", { class: "empty", text: "まだメッセージがありません" }));
    }
    return;
  }
  for (const m of msgs) box.appendChild(messageEl(m, { onChange: () => renderThread(agent) }));

  if (isRunning(agent)) {
    const act = threadActivity(agent);
    box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}
