// タスクキューの開閉。null = 自動（未完了タスクがあれば開く）
const taskZoneOpen = Object.create(null);

function taskEl(t) {
  const actions = el("div", { class: "actions" });
  actions.appendChild(el("button", { class: "small", text: "プロンプトをコピー", onclick: () => copy(taskPrompt(t)) }));
  if (t.status === "queued")
    actions.appendChild(el("button", { class: "small", text: "作業開始", onclick: () => patchTask(t.id, "working") }));
  if (t.status === "queued" || t.status === "working")
    actions.appendChild(el("button", { class: "small", text: "結果を入力", onclick: () => openResultDialog(t) }));
  if (t.status === "returned")
    actions.appendChild(el("button", { class: "small", text: "完了にする", onclick: () => patchTask(t.id, "done") }));
  if (t.result)
    actions.appendChild(el("button", {
      class: "small",
      text: "プールへ",
      onclick: () => openPoolDialog(t.agent, t.result, null, t.title),
    }));
  actions.appendChild(el("button", { class: "small", text: "削除", onclick: (e) => armedDelete(e.target, () => delTask(t)) }));

  const kids = [
    el("div", { class: "t-head" }, [
      el("span", { class: "status", "data-s": t.status, text: STATUS_LABEL[t.status] }),
      el("span", { class: "t-title", text: t.title }),
    ]),
  ];
  if (t.detail) kids.push(el("div", { class: "t-detail", text: t.detail }));
  if (t.result) kids.push(el("div", { class: "t-result", text: "結果: " + t.result }));
  kids.push(actions);
  return el("div", { class: "task" }, kids);
}

function renderTasks(agent) {
  const box = $("#tasks-" + agent);
  const head = $("#tasks-head-" + agent);
  box.replaceChildren();
  const topic = currentTopic();
  const tasks = state.tasks.filter((t) => t.agent === agent && topic && (t.topicId === topic.id || !t.topicId));
  const active = tasks.filter((t) => t.status !== "done").length;
  const open = taskZoneOpen[agent] != null ? taskZoneOpen[agent] : active > 0;
  head.textContent =
    (open ? "▾ " : "▸ ") + agent.toUpperCase() + " タスクキュー" +
    (tasks.length ? `（${active} 件${tasks.length - active ? " / 完了 " + (tasks.length - active) : ""}）` : "（なし）") +
    " — " + NAMES[agent] + " アプリ内で作業";
  head.onclick = () => {
    taskZoneOpen[agent] = !open;
    renderTasks(agent);
  };
  box.hidden = !open;
  if (!open) return;
  if (!tasks.length) {
    box.appendChild(el("div", { class: "empty", text: "タスクなし" }));
    return;
  }
  for (const t of tasks) box.appendChild(taskEl(t));
}

async function sendUser() {
  const input = $("#user-text"), original = input.value, text = original.trim();
  if (!text || $("#user-send").disabled) return;
  const target = $("#user-target").value, topicId = currentTopic()?.id;
  const isQa = target.startsWith("qa-");
  const recipients = isQa ? [...qaChoice.order] : target === "all" ? participantsOf() : [target];
  if (!topicId || recipients.some((id) => !participantsOf().includes(id))) return toast("送信先を選択してください");
  const unavailable = recipients.find((id) => !agentReady(id));
  if (unavailable) return toast(NAMES[unavailable] + " は" + authLabel(unavailable));
  if (isQa && (recipients.length < 2 || recipients[0] !== target.slice(3))) return toast("質疑は先手を含む2名以上を選択してください");
  if (isQa && recipients.some((id) => !state.agents[id]?.auto)) return toast("質疑の参加者全員の自動応答をONにしてください");
  // 旧2名への「両方」は旧サーバとも互換。その他の組み合わせは新APIの all。
  const thread = target === "all" && recipients.length === 2 && recipients.includes("claude") && recipients.includes("codex") ? "both" : target;
  const agenda = $("#qa-agenda").value;
  $("#user-send").disabled = true;
  try {
    await (isQa ? api("/api/qa/start", "POST", {
      first: recipients[0], participants: recipients, text, hops: Number($("#qa-hops").value) || 6, agenda, topicId,
    }) : api("/api/messages", "POST", { thread, author: "user", text, topicId, test: $("#test-mark").checked }));
    if (currentTopic()?.id === topicId && input.value === original) {
      input.value = "";
      if ($("#qa-agenda").value === agenda) $("#qa-agenda").value = "";
      $("#test-mark").checked = false;
    }
  } catch (e) { toast(e.message); }
  finally { $("#user-send").disabled = false; }
}

async function sendAgent(agent) {
  const input = $("#input-" + agent), topicId = currentTopic()?.id;
  if (!input || !topicId || input.disabled) return;
  if (!agentReady(agent)) return toast(NAMES[agent] + " は" + authLabel(agent));
  const original = input.value, text = original.trim();
  if (!text) return;
  input.disabled = true;
  try {
    await api("/api/messages", "POST", { thread: agent, author: agent, text, topicId });
    if (currentTopic()?.id === topicId && input.isConnected && input.value === original) {
      input.value = ""; hideAgentInput(agent);
    }
  } catch (e) { toast(e.message); }
  finally { input.disabled = false; }
}

  const { code, lang, author } = cbStore[cid];
  if (e.target.classList.contains("cb-copy")) copy(code);
  if (e.target.classList.contains("cb-save")) {
    const ext = CB_EXT[lang] || (code.trimStart().startsWith("<svg") ? "svg" : "txt");

    $("#pool-filename").value = "artifact." + ext;
  }
});
$("#pool-add").addEventListener("click", () => openPoolDialog("user", "", null));
$("#pool-cancel").addEventListener("click", () => $("#pool-dialog").close());
$("#pool-dialog").addEventListener("cancel", (event) => { if ($("#pool-create").disabled) event.preventDefault(); });
$("#pool-create").addEventListener("click", async () => {
  const title = $("#pool-title").value.trim();
  const body = $("#pool-text").value.trim();
  const file = $("#pool-file").files[0];
  const button = $("#pool-create");
  if (button.disabled) return;
  const reviewers = [...$("#pool-reviewers").querySelectorAll("input:checked")].map((input) => input.value);
  const origin = $("#pool-origin").value, filename = $("#pool-filename").value.trim();
  const registration = { topicId: poolDialogTopicId, reviewers, autoReview: $("#pool-autoreview").checked };
  const fields = [...$("#pool-dialog").querySelectorAll("input, textarea, select, button")];
  const disabled = fields.map((node) => node.disabled);
  fields.forEach((node) => { node.disabled = true; });
  try {
  if (file) {
    // ファイル添付はアップロードとして登録
    const buf = await file.arrayBuffer();
    let bin = "";
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    await api("/api/pool/upload", "POST", {
      origin,
      title: title || file.name,
      filename: file.name,
      dataBase64: btoa(bin),
      dir: poolDialogDir,
      ...registration,
    });
  } else {
    if (!title || !body) return toast("タイトルと成果物を入力してください");
    await api("/api/pool", "POST", {
      origin,
      title,
      body,
      dir: poolDialogDir,
      filename: filename || undefined,
      fromMessageId: poolSourceMessageId,
      ...registration,
    });
  }
  $("#pool-dialog").close();
  $("#pool-file").value = "";
  toast("プールへ登録しました");
  } catch (e) { toast(e.message); }
  finally { fields.forEach((node, i) => { node.disabled = disabled[i]; }); }
});
function togglePool(collapse) {
  const collapsed = collapse != null ? collapse : !document.body.classList.contains("pool-collapsed");
  document.body.classList.toggle("pool-collapsed", collapsed);
  if (collapsed) togglePoolWiden(false); // 列と同じ規則: 折りたたんだら拡幅は解除
  $("#pool-toggle").textContent = collapsed ? "展開する" : "折りたたむ";
}
$("#pool-toggle").addEventListener("click", () => togglePool());

  document.body.classList.toggle("pool-widened", on);

}

// prompt()/confirm() はアプリ内ブラウザ等で無効化されることがあるため、インライン UI で作成する
let poolCreateMode = null; // "dir" | "file"
function openPoolCreate(mode) {
  poolCreateMode = mode;

  row.hidden = false;
  input.placeholder = (mode === "dir" ? "📁 新規フォルダ名" : "📄 新規ファイル名（例: notes.md）") +

}
function closePoolCreate() {
  poolCreateMode = null;

}
async function submitPoolCreate() {
  const name = $("#pool-create-name").value.trim();
  if (!name || !poolCreateMode) return;

    const r = await api("/api/pool/mkdir", "POST", { dir: poolCurrentDir, name });

  renderPool();
}

document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;

  if (tag === "INPUT" || tag === "TEXTAREA") return;

});

// confirm() の代替: 1度目のクリックで「本当に削除？」に変わり、2.5秒以内の再クリックで実行
function armedDelete(btn, action) {
  if (btn.dataset.armed) {
    action();
    return;
  }
  btn.dataset.armed = "1";
  const orig = btn.textContent;
  btn.textContent = "本当に削除？";
  btn.classList.add("danger");
  setTimeout(() => {
    btn.dataset.armed = "";
    btn.textContent = orig;
    btn.classList.remove("danger");
  }, 2500);
}

// ---- 添付: プールの attachments/ に保存し、メッセージに参照を挿入 ----
async function fileToBase64(f) {
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

$("#user-attach").addEventListener("click", () => $("#attach-input").click());
$("#attach-input").addEventListener("change", async (e) => {

      origin: "user",
      filename: f.name,
      dataBase64: await fileToBase64(f),
      dir: "attachments",
      autoReview: false,
    });
    const refPath = "u2a2a/pool/" + item.file;
    const ta = $("#user-text");
    ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n" : "") +
      (isImageExt(item.file) ? "![" + f.name + "](" + refPath + ")" : refPath);
    toast("添付しました: " + item.file);

});

// ---- コンテキストメニュー（合意: 既存操作への別入口。右クリック / ⋯ / Shift+F10）----
const ctxMenuEl = el("div", { id: "ctx-menu", hidden: "" });
document.body.appendChild(ctxMenuEl);

function closeCtxMenu() {
  ctxMenuEl.hidden = true;
}

function openCtxMenu(x, y, items) {
  if (!items || !items.length) return;
  ctxMenuEl.replaceChildren();
  for (const [label, action] of items) {
    ctxMenuEl.appendChild(el("button", {
      class: "ctx-item",
      text: label,
      onclick: () => {
        closeCtxMenu();
        action();
      },
    }));
  }
  ctxMenuEl.hidden = false;
  // 画面外にはみ出さないようクランプ
  ctxMenuEl.style.left = "0px";
  ctxMenuEl.style.top = "0px";
  const r = ctxMenuEl.getBoundingClientRect();
  ctxMenuEl.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  ctxMenuEl.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
}

function insertToInput(text) {
  const ta = $("#user-text");
  ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + text;
  ta.focus();
}

function quoteToInput(text) {
  insertToInput(text.split("\n").map((l) => "> " + l).join("\n") + "\n");
}

const parentDirOf = (file) => (file.includes("/") ? file.slice(0, file.lastIndexOf("/")) : "");

// 対象ごとの操作 allowlist（対象外はブラウザ標準メニューを維持）
function ctxItems(t) {
  if (t.type === "run") {
    return [["⏹ 実行を中断", () => api("/api/runs/" + t.runId + "/cancel", "POST", {}).then(() => toast("停止を要求しました"))]];
  }
  if (t.type === "message") {
    const m = t.m;
    return [
      ["コピー", () => copy(m.text)],
      ["引用して入力欄へ", () => quoteToInput(m.text)],
      ["タスク化", () => openTaskDialog(m.thread, m)],
      ["🤝 引き継ぎ先を選択", () => chooseDestination("handoff", m.thread, m)],
      ["🌿 ここから分岐", () => openProjectChoice("branch", (state.topics || []).find((topic) => topic.id === m.topicId), m.id)],
      ["✍ " + NAMES[m.thread] + " の発言を手動追加", () => showAgentInput(m.thread)],
    ];
  }
  if (t.type === "thread") {
    return [["✍ " + NAMES[t.agent] + " の発言を手動追加（貼り付け）", () => showAgentInput(t.agent)]];
  }
  if (t.type === "poolfile") {
    const p = t.p;
    const dir = parentDirOf(p.file);
    const items = [
      ["⧉ コピー", () => { poolClipboard = { path: p.file, isDir: false }; renderClipBar(); toast("コピー: " + p.file); }],
    ];
    if (poolClipboard)
      items.push(["📋 ここへ貼り付け（" + (dir || "ルート") + "）", () => api("/api/pool/copy", "POST", { src: poolClipboard.path, destDir: dir }).then((r) => toast("複製: " + r.dest))]);
    items.push(["パスを入力欄へ挿入", () => insertToInput("u2a2a/pool/" + p.file)]);
    items.push(["レビューを依頼…", () => openAgentAction(p, "review")]);
    return items;
  }
  if (t.type === "pooldir") {
    const items = [
      ["⧉ フォルダをコピー", () => { poolClipboard = { path: t.dir, isDir: true }; renderClipBar(); toast("コピー: " + t.dir + "/"); }],
    ];
    if (poolClipboard)
      items.push(["📋 このフォルダへ貼り付け", () => api("/api/pool/copy", "POST", { src: poolClipboard.path, destDir: t.dir }).then((r) => toast("複製: " + r.dest))]);
    items.push(["パスを入力欄へ挿入", () => insertToInput("u2a2a/pool/" + t.dir + "/")]);
    return items;
  }
  if (t.type === "topic") {
    const topic = (state.topics || []).find((x) => x.id === t.id);
    if (!topic) return [];
    return [
      ["📌 要約を更新", () => api("/api/topics/" + topic.id + "/summarize", "POST", {}).then(() => toast("要約を生成中…"))],
      ["履歴をコピー", async () => {
        if (!topic.mirrorFile) return;
        const r = await fetch("/api/pool/file/" + encodeURIComponent(topic.mirrorFile));
        copy(await r.text());
      }],
      ["名前を変更", () => { renamingTopicId = topic.id; renderTopicBar(); }],
      ["質疑リレーを停止", () => api("/api/qa/stop", "POST", { topicId: topic.id })],
    ];
  }
  return [];
}

function resolveCtxTarget(elx) {
  if (!elx || !elx.closest) return null;
  const act = elx.closest(".activity[data-runid]");
  if (act && act.dataset.runid) {
    const run = (state.runs || []).find((r) => r.runId === act.dataset.runid);
    if (run && run.kind === "thread") return { type: "run", runId: run.runId };
  }
  const msg = elx.closest(".msg[data-mid]");
  if (msg) {
    const m = state.messages.find((x) => x.id === msg.dataset.mid);
    if (m) return { type: "message", m };
  }
  const row = elx.closest(".pf-row");
  if (row) {
    if (row.dataset.topic) return { type: "topic", id: row.dataset.topic };
    if (row.dataset.dir) return { type: "pooldir", dir: row.dataset.dir };
    if (row.dataset.file) {
      const p = (state.pool || []).find((x) => x.file === row.dataset.file);
      if (p) return { type: "poolfile", p };
    }
  }
  const tab = elx.closest(".topic-tab[data-topic]");
  if (tab) return { type: "topic", id: tab.dataset.topic };
  const detail = elx.closest("#pool-detail");
  if (detail) {
    if (typeof poolSelectedId === "string" && poolSelectedId.startsWith("topic:"))
      return { type: "topic", id: poolSelectedId.slice(6) };
    const p = (state.pool || []).find((x) => x.id === poolSelectedId);
    if (p) return { type: "poolfile", p };
  }
  // スレッド列の残り領域（入力欄内はブラウザ標準のコピー/ペーストメニューを維持）
  if (!elx.closest("input, textarea")) {
    const col = elx.closest(".thread-col[data-agent]");
    if (col) return { type: "thread", agent: col.dataset.agent };
  }
  return null;
}

document.addEventListener("contextmenu", (e) => {
  const t = resolveCtxTarget(e.target);
  if (!t) return; // 対象外はブラウザ標準メニュー
  const items = ctxItems(t);
  if (!items.length) return;
  e.preventDefault();
  openCtxMenu(e.clientX, e.clientY, items);
});
document.addEventListener("keydown", (e) => {
  if (e.shiftKey && e.key === "F10") {
    const t = resolveCtxTarget(document.activeElement);
    if (!t) return;
    const items = ctxItems(t);
    if (!items.length) return;
    e.preventDefault();
    const r = document.activeElement.getBoundingClientRect();
    openCtxMenu(r.left + 8, r.bottom + 2, items);
  }
  if (e.key === "Escape") closeCtxMenu();
});
document.addEventListener("click", (e) => {
  if (!ctxMenuEl.contains(e.target)) closeCtxMenu();
});
document.addEventListener("scroll", closeCtxMenu, true);

function wireAgent(agent) {
  $("#auto-" + agent).addEventListener("change", (e) => {
    api("/api/agents/" + agent, "PATCH", { auto: e.target.checked });
  });
  $("#reset-" + agent).addEventListener("click", (e) => {
    const t = currentTopic();
    if (!t) return;
    api("/api/topics/" + t.id, "PATCH", { resetAgent: agent })
      .then(() => toast(NAMES[agent] + " は次の応答から新しい CLI セッションになります（文脈はリセット）"));
  });
  const modelInput = $("#model-" + agent);
  const commitModel = (value) => {
    const v = (value !== undefined ? value : modelInput.value).trim();
    const cur = ((state.agents || {})[agent] || {}).modelOverride || "";
    if (v === cur) return;
    api("/api/agents/" + agent, "PATCH", { model: v })
      .then(() => toast(v ? "モデルを " + v + " に設定しました" : "モデルを CLI 既定に戻しました"));
  };
  modelInput.addEventListener("change", () => commitModel());
  modelInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { commitModel(); modelInput.blur(); } });
  // クリックでモデル一覧メニューを表示（datalist は環境によって候補が出ないため）
  modelInput.addEventListener("click", async (e) => {
    e.stopPropagation();
    const models = await api("/api/models");
    const cur = ((state.agents || {})[agent] || {}).modelOverride || "";
    const mark = (v) => (v === cur ? "✓ " : "　");
    const items = [[mark("") + "CLI 既定", () => { modelInput.value = ""; commitModel(""); }]];
    for (const name of models[agent] || []) {
      items.push([mark(name) + name, () => { modelInput.value = name; commitModel(name); }]);
    }
    items.push(["✏ 手入力（このまま入力して Enter）", () => modelInput.focus()]);
    const r = modelInput.getBoundingClientRect();
    openCtxMenu(r.left, r.bottom + 4, items);
  });
}
// ---- live sync ----
const es = new EventSource("/api/events");
es.onmessage = (e) => {
  state = JSON.parse(e.data);
  render();
};
