<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U2A2A Orchestration</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c232e;
    --line: #2a3341;
    --text: #dce3ec;
    --dim: #8a96a6;
    --user: #7bd88f;
    --claude: #ffab5e;
    --codex: #6fd7ff;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  header {
    padding: 6px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--dim); font-size: 12px; }

  /* トピックタブバー */
  #topic-bar {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 5px 14px 0;
    background: var(--panel);
    overflow-x: auto;
    flex: none;
  }
  .topic-tab {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
    background: var(--bg);
    user-select: none;
  }
  .topic-tab.active { color: var(--text); background: var(--panel-2); font-weight: 600; }
  .topic-tab .t-btn {
    border: none;
    background: none;
    color: var(--dim);
    cursor: pointer;
    padding: 0 2px;
    font-size: 11px;
  }
  .topic-tab .t-btn:hover { color: var(--text); }
  .topic-tab input {
    padding: 0 4px;
    font-size: 12px;
    width: 110px;
    border-radius: 4px;
  }
  #topic-add {
    border: 1px dashed var(--line);
    background: none;
    border-radius: 8px 8px 0 0;
    padding: 4px 10px;
    font-size: 12.5px;
    color: var(--dim);
  }

  /* ユーザー帯（Canvas 上段・緑） */
  #user-band {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-band .role-dot { background: var(--user); }
  #user-band textarea {
    flex: 1;
    min-height: 38px;
    max-height: 140px;
    resize: vertical;
  }
  #qa-hops { width: 64px; }
  #qa-bar[hidden] { display: none; }
  #qa-bar {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    color: var(--codex);
  }
  .role-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; flex: none;
    align-self: center;
  }
  textarea, select, input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: 1px solid var(--dim); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--dim); }
  button.small { padding: 2px 8px; font-size: 11.5px; color: var(--dim); border-radius: 6px; }
  button.small:hover { color: var(--text); }

  /* 左=会話系（スレッド2列） / 右=共有タスクプール */
  #content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  body.pool-collapsed #content { grid-template-columns: 1fr auto; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 0;
    min-width: 0;
    position: relative;
  }
  /* 転送ペア（原文⇄折りたたみ）をつなぐ対応線 */
  #link-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: visible;
  }
  #link-layer path {
    stroke: rgba(123, 216, 143, 0.55);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 7 5;
    stroke-linecap: round;
    animation: relay-flow 0.8s linear infinite;
  }
  /* 破線が送り元 → 受け取り側へ流れる（パスは常に送り元始点で描かれる） */
  @keyframes relay-flow {
    to { stroke-dashoffset: -12; }
  }
  #link-layer circle { fill: rgba(123, 216, 143, 0.7); }
  .thread-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .thread-col + .thread-col { border-left: 1px solid var(--line); }
  .thread-head {
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 4px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .thread-col[data-agent="claude"] .thread-head .role-dot { background: var(--claude); }
  .thread-col[data-agent="codex"] .thread-head .role-dot { background: var(--codex); }
  .thread-head .count { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .thread-head .auto-ctl {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .thread-head .auto-ctl input { accent-color: var(--user); }
  .agent-status { font-size: 11.5px; margin-left: 10px; font-weight: 400; }
  .model-chip {
    font-size: 11px;
    font-weight: 400;
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 10px;
    width: 92px;
    transition: width 0.15s;
  }
  .model-chip::placeholder { color: var(--dim); }
  .model-chip:focus { outline: 1px solid var(--dim); width: 180px; }
  .agent-status[data-s="running"] { color: var(--codex); }
  .agent-status[data-s="error"] { color: var(--danger); cursor: help; }
  .typing {
    color: var(--dim);
    font-size: 12.5px;
    padding: 2px 4px;
  }
  /* CLI 実況 */
  .activity {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--dim);
    margin-top: 6px;
  }
  .activity .a-head { display: flex; gap: 8px; align-items: baseline; }
  .activity .a-label { color: var(--codex); font-weight: 600; }
  .activity .elapsed { font-family: ui-monospace, monospace; }
  .activity .a-step { color: var(--text); margin-top: 2px; }
  .activity .a-log { margin-top: 2px; opacity: 0.65; font-size: 11px; }
  .typing::after {
    content: "…";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 8px;
    padding: 6px 11px;
    position: relative;
  }
  .msg[data-author="user"] { border-left-color: var(--user); }
  .msg[data-author="claude"] { border-left-color: var(--claude); }
  .msg[data-author="codex"] { border-left-color: var(--codex); }
  .msg.external { border-style: dashed; border-left-style: solid; }
  .relay-collapsed {
    color: var(--dim);
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  .relay-collapsed:hover { color: var(--text); }
  .relay-fold { cursor: pointer; }
  .relay-fold:hover { color: var(--text); }
  .msg .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .msg .meta .who { font-weight: 600; }
  .msg[data-author="user"] .who { color: var(--user); }
  .msg[data-author="claude"] .who { color: var(--claude); }
  .msg[data-author="codex"] .who { color: var(--codex); }
  .mdview { word-break: break-word; overflow-x: auto; }
  .mdview.raw { white-space: pre-wrap; }
  .mdview p { margin: 0.35em 0; }
  .mdview h1, .mdview h2, .mdview h3, .mdview h4 {
    margin: 0.6em 0 0.3em;
    font-size: 1.05em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .mdview h1 { font-size: 1.15em; }
  .mdview h2 { font-size: 1.1em; }
  .mdview ul, .mdview ol { margin: 0.35em 0; padding-left: 1.5em; }
  .mdview li { margin: 0.15em 0; }
  .mdview code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.92em;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
  .mdview pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0.4em 0;
  }
  .mdview pre code { background: none; border: none; padding: 0; }
  .mdview blockquote {
    margin: 0.4em 0;
    padding: 2px 10px;
    border-left: 3px solid var(--dim);
    color: var(--dim);
  }
  .mdview table {
    border-collapse: collapse;
    margin: 0.4em 0;
    font-size: 0.95em;
  }
  .mdview th, .mdview td {
    border: 1px solid var(--line);
    padding: 3px 9px;
    text-align: left;
  }
  .mdview th { background: var(--panel-2); }
  .mdview a { color: var(--codex); }
  .mdview img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin: 4px 0; }
  .cb-bar {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    margin: 6px 0 2px;
  }
  .cb-svg {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    max-width: 100%;
    max-height: 280px;
    display: block;
    margin: 6px 0 0;
  }
  .msg-media { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .msg-media img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid var(--line); }
  .msg-media a {
    color: var(--codex);
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
    text-decoration: none;
    word-break: break-all;
  }
  .msg-media a:hover { text-decoration: underline; }
  .mdview hr { border: none; border-top: 1px solid var(--line); margin: 0.6em 0; }
  /* メッセージのアクションはホバー時のみ右上にオーバーレイ表示（縦の圧迫を防ぐ） */
  .msg .actions {
    display: none;
    position: absolute;
    top: 4px;
    right: 6px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 5px;
    z-index: 2;
  }
  .msg:hover .actions, .msg:focus-within .actions { display: flex; }
  .empty { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 24px; }

  /* エージェント返答入力 */
  .agent-input {
    border-top: 1px solid var(--line);
    padding: 7px 14px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
  }
  .agent-input textarea { flex: 1; min-height: 32px; max-height: 120px; resize: vertical; }

  /* タスクキュー（Canvas 下段）: 折りたたみ式 */
  .task-zone {
    border-top: 1px solid var(--line);
    padding: 4px 16px 8px;
    max-height: 30vh;
    overflow-y: auto;
    flex: none;
  }
  .task-zone h2 {
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 4px 0 6px;
    cursor: pointer;
    user-select: none;
  }
  .task-zone h2:hover { color: var(--text); }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
  }
  .task .t-head { display: flex; gap: 8px; align-items: center; }
  .task .t-title { font-weight: 600; flex: 1; word-break: break-word; }
  .task .t-detail { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .task .t-result { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .task .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .status {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .status[data-s="queued"]   { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="working"]  { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="returned"] { color: var(--claude); border-color: #ffab5e55; }
  .status[data-s="done"]     { color: var(--user); border-color: #7bd88f55; }

  /* 共有タスクプール（右半分・縦フル） */
  #pool-zone {
    border-left: 2px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  body.pool-collapsed #pool-zone .sub { display: none; }
  #pool-head {
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
    row-gap: 4px;
    flex: none;
  }
  #pool-head .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  #pool-head button { margin-left: auto; }
  /* ファイルビューワー: 左リスト + 右詳細 */
  #pool-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #pool-list-wrap {
    width: 270px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    padding: 4px 6px 0;
    min-height: 0;
  }
  #pool-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  body.pool-collapsed #pool-list-wrap { border-right: none; }
  body.pool-collapsed #pool-detail { display: none; }
  #pool-tools { display: flex; gap: 4px; align-items: center; margin-bottom: 2px; }
  #pool-search {
    flex: 1;
    min-width: 0;
    padding: 4px 10px;
    font-size: 12.5px;
    border-radius: 6px;
  }
  #pool-clip { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); padding: 1px 8px 3px; }
  #pool-clip[hidden] { display: none; }
  #pool-clip #pool-clip-name {
    font-family: ui-monospace, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  .pf-row.dragover { background: var(--panel-2); outline: 1px solid var(--user); }
  #pool-list.dragover { outline: 1px dashed var(--user); outline-offset: -2px; border-radius: 6px; }
  #pool-create-row { display: flex; gap: 4px; align-items: center; margin: 2px 0 4px; }
  #pool-create-row[hidden] { display: none; }
  #pool-create-row input { flex: 1; min-width: 0; padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  button.small.danger { color: var(--danger); border-color: #ff7b7b55; }
  #pool-cwd {
    font-size: 10.5px;
    color: var(--dim);
    font-family: ui-monospace, monospace;
    padding: 1px 8px 3px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #pool-cwd:hover { color: var(--text); }
  .pf-row.folder .pf-name { font-family: inherit; color: var(--dim); font-weight: 600; }
  .pf-row.folder.cwd .pf-name { color: var(--user); }
  .pf-row .chev { flex: none; width: 10px; color: var(--dim); font-size: 10px; }
  .pf-row {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .pf-row:hover { background: var(--panel-2); }
  .pf-row.sel { background: var(--panel-2); outline: 1px solid var(--line); }
  .pf-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .pf-dot[data-s="submitted"] { background: #d8c56f; }
  .pf-dot[data-s="reviewing"] { background: var(--codex); }
  .pf-dot[data-s="approved"] { background: var(--user); }
  .pf-dot[data-s="rejected"] { background: var(--danger); }
  .pf-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
  }
  .pf-size { color: var(--dim); font-size: 10.5px; flex: none; }
  #pool-detail {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 10px 14px 14px;
  }
  #pool-detail .p-body { max-height: none; }
  /* 狭い画面では従来の上下配置に戻す */
  @media (max-width: 1100px) {
    #content { display: flex; flex-direction: column; }
    main { flex: 1; }
    #pool-zone { border-left: none; border-top: 2px solid var(--line); flex: none; max-height: 40vh; }
    #pool-list-wrap { width: 210px; }
    #pool-detail .p-body { max-height: 180px; }
  }
  .p-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .p-title { font-weight: 600; flex: 1; min-width: 120px; word-break: break-word; }
  .origin {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .origin[data-o="user"] { color: var(--user); border-color: #7bd88f55; }
  .origin[data-o="claude"] { color: var(--claude); border-color: #ffab5e55; }
  .origin[data-o="codex"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="submitted"] { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="reviewing"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="approved"] { color: var(--user); border-color: #7bd88f55; }
  .status[data-s="rejected"] { color: var(--danger); border-color: #ff7b7b55; }
  .p-file {
    margin-top: 5px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .p-file a { color: var(--codex); text-decoration: none; word-break: break-all; }
  .p-file a:hover { text-decoration: underline; }
  .p-file .p-size { color: var(--dim); flex: none; }
  .p-body {
    margin-top: 6px;
    overflow-y: auto;
    word-break: break-word;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .p-body:empty { display: none; }
  .p-body img { max-width: 100%; max-height: 340px; border-radius: 6px; }
  .review {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--panel);
  }
  .review .r-head {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .review .r-head:hover .reviewer { text-decoration: underline; }
  .review .r-head .chev { flex: none; }
  .review .r-body { margin-top: 4px; }
  .review .r-head .reviewer { font-weight: 600; }
  .review .r-head .reviewer[data-o="claude"] { color: var(--claude); }

<script>
const NAMES = { user: "ユーザー", claude: "Claude Code", codex: "Codex" };
const OTHER = { claude: "codex", codex: "claude" };
const STATUS_LABEL = { queued: "キュー", working: "作業中", returned: "結果あり", done: "完了" };
let state = { messages: [], tasks: [], pool: [], topics: [], agents: {}, running: {}, reviewPending: {}, fixPending: {}, activity: {} };

// ---- トピック（スレッド）----
let currentTopicId = localStorage.getItem("u2a2a-topic") || null;
let renamingTopicId = null;

function currentTopic() {
  return (state.topics || []).find((t) => t.id === currentTopicId) || (state.topics || [])[0] || null;
}

function ensureTopic() {
  const t = currentTopic();
  if (t && t.id !== currentTopicId) {
    currentTopicId = t.id;
    try { localStorage.setItem("u2a2a-topic", t.id); } catch {}
  }
  return t;
}

function switchTopic(id) {
  currentTopicId = id;
  renamingTopicId = null;
  try { localStorage.setItem("u2a2a-topic", id); } catch {}
  render();
}

function renderTopicBar() {
  const bar = $("#topic-bar");
  bar.replaceChildren();
  const topics = state.topics || [];
  for (const t of topics) {
    const active = t.id === (currentTopic() || {}).id;
    const tab = el("div", { class: "topic-tab" + (active ? " active" : ""), onclick: () => { if (!active) switchTopic(t.id); } });
    // ブラウザライクなドラッグ入れ替え
    tab.setAttribute("draggable", "true");
    tab.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/u2a2a-topic", t.id));
    tab.addEventListener("dragover", (e) => {
      if ([...e.dataTransfer.types].includes("text/u2a2a-topic")) e.preventDefault();
    });
    tab.addEventListener("drop", (e) => {
      const src = e.dataTransfer.getData("text/u2a2a-topic");
      if (!src || src === t.id) return;
      e.preventDefault();
      const order = topics.map((x) => x.id).filter((tid) => tid !== src);
      order.splice(order.indexOf(t.id), 0, src);
      api("/api/topics/reorder", "POST", { order });
    });
    if (renamingTopicId === t.id) {
      const input = el("input", { value: t.title });
      const commit = () => {
        renamingTopicId = null;
        const v = input.value.trim();
        if (v && v !== t.title) api("/api/topics/" + t.id, "PATCH", { title: v });
        else render();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { renamingTopicId = null; render(); }
      });
      input.addEventListener("blur", commit);
      tab.appendChild(input);
      bar.appendChild(tab);
      setTimeout(() => input.focus(), 0);
      continue;
    }
    const count = (state.messages || []).filter((m) => m.topicId === t.id).length;
    tab.appendChild(el("span", { text: t.title + (count ? "（" + count + "）" : "") }));
    if (active) {
      tab.appendChild(el("button", {
        class: "t-btn", text: "✏", title: "名前を変更",
        onclick: (e) => { e.stopPropagation(); renamingTopicId = t.id; renderTopicBar(); },
      }));
      if (topics.length > 1) {
        tab.appendChild(el("button", {
          class: "t-btn", text: "✕", title: "スレッドを削除（メッセージも消えます）",
          onclick: (e) => { e.stopPropagation(); armedDelete(e.target, () => api("/api/topics/" + t.id, "DELETE").then(() => { currentTopicId = null; })); },
        }));
      }
    }
    bar.appendChild(tab);
  }
  bar.appendChild(el("button", {
    id: "topic-add", text: "＋ 新規スレッド",
    onclick: () => api("/api/topics", "POST", {}).then((t) => { switchTopic(t.id); renamingTopicId = t.id; render(); }),
  }));
}
const POOL_STATUS_LABEL = { submitted: "持ち込み", reviewing: "レビュー", approved: "承認", rejected: "差し戻し" };

const $ = (s) => document.querySelector(s);

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    toast(err.error || "エラーが発生しました");
    throw new Error(err.error || res.status);
  }
  return res.json();
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// 実行中 CLI の実況ボックス
function activityEl(a) {
  const box = el("div", { class: "activity" }, [
    el("div", { class: "a-head" }, [
      el("span", { class: "a-label", text: "⏳ " + a.label + " 実行中" }),
      el("span", { class: "elapsed", "data-started": a.startedAt, text: fmtElapsed(Date.now() - a.startedAt) }),
    ]),
    el("div", { class: "a-step", text: a.step || "" }),
  ]);
  const past = (a.steps || []).slice(0, -1).slice(-3);
  if (past.length) box.appendChild(el("div", { class: "a-log", text: past.join("　→　") }));
  return box;
}

// ---- 転送ペアの対応線 ----
// 原文（送信元スレッド）と折りたたみ表示（受信側）を薄緑の線でつなぎ、
// 左右スレッドのスクロール差をひと目で分かるようにする
let linkRaf = 0;

function scheduleLinks() {
  cancelAnimationFrame(linkRaf);
  linkRaf = requestAnimationFrame(updateRelayLinks);
}

function updateRelayLinks() {
  const svg = $("#link-layer");
  const mainEl = document.querySelector("main");
  if (!svg || !mainEl) return;
  const mr = mainEl.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + mr.width + " " + mr.height);
  const t = currentTopic();
  if (!t) {
    svg.replaceChildren();
    return;
  }
  const parts = [];
  for (const m of state.messages) {
    if (m.topicId !== t.id || !m.relayedFrom) continue;
    const tgt = document.querySelector('.msg[data-mid="' + m.id + '"]');
    if (!tgt) continue;
    let srcMsg = m.sourceId ? state.messages.find((o) => o.id === m.sourceId) : null;
    if (!srcMsg) {
      // 旧データ用フォールバック: 同一トピック・送信元スレッド・同著者・同文の直前メッセージ
      srcMsg = state.messages.find(
        (o) => o.topicId === t.id && o.thread === m.relayedFrom && o.author === m.author && o.text === m.text && o.ts <= m.ts
      );
    }
    const src = srcMsg && document.querySelector('.msg[data-mid="' + srcMsg.id + '"]');
    if (!src) continue;
    // 各メッセージの中心Yを、所属スレッドの表示範囲内にクランプ
    // （画面外へスクロールした分は端に張り付き、線の傾きがズレ量を示す）
    const anchor = (el2) => {
      const cr = el2.closest(".messages").getBoundingClientRect();
      const r = el2.getBoundingClientRect();
      return {
        r,
        y: Math.min(Math.max(r.top + r.height / 2, cr.top + 6), cr.bottom - 6),
        visible: r.bottom > cr.top && r.top < cr.bottom, // 可読領域に一部でも見えているか
      };
    };
    const s = anchor(src);
    const g = anchor(tgt);
    if (!s.visible && !g.visible) continue; // 両方とも画面外のペアは描かない
    const leftFirst = s.r.left < g.r.left;
    const x1 = (leftFirst ? s.r.right : s.r.left) - mr.left;
    const x2 = (leftFirst ? g.r.left : g.r.right) - mr.left;
    const y1 = s.y - mr.top;
    const y2 = g.y - mr.top;
    const dx = (x2 - x1) / 2;
    parts.push(
      `<path d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}" />` +
      `<circle cx="${x1}" cy="${y1}" r="2" /><circle cx="${x2}" cy="${y2}" r="2" />`
    );
  }
  svg.innerHTML = parts.join("");
}

for (const boxId of ["messages-claude", "messages-codex"]) {
  document.getElementById(boxId).addEventListener("scroll", scheduleLinks, { passive: true });
}
window.addEventListener("resize", scheduleLinks);

// 経過時間だけ毎秒更新（全再描画はしない）
setInterval(() => {
  for (const e2 of document.querySelectorAll(".elapsed[data-started]")) {
    e2.textContent = fmtElapsed(Date.now() - Number(e2.dataset.started));
  }
}, 1000);

// ---- 軽量 Markdown レンダラー（HTML はすべてエスケープ＝無害化した上で装飾のみ付与） ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineMd(raw) {
  let s = escapeHtml(raw);
  // 画像: ![alt](http(s)://… | u2a2a/pool/… | /api/pool/file/…)
  s = s.replace(
    /!\[([^\]]*)\]\((?:(https?:[^)\s]+)|(?:\/api\/pool\/file\/|u2a2a\/pool\/)([^)\s]+))\)/g,
    (_, alt, abs, rel) => {
      const src = abs || "/api/pool/file/" + rel;
      return '<img src="' + src + '" alt="' + alt + '" loading="lazy">';
    }
  );
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

// コードブロックの実体ストア（保存・コピー用。event delegation から参照）
const cbStore = {};
let cbSeq = 0;

function renderMarkdown(src, ctx) {
  const lines = src.split("\n");
  const out = [];
  let para = [];
  const flushPara = () => {
    if (para.length) out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>");
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // フェンス付きコードブロック（SVG はインライン描画＋プール保存ボタン付き）
    const fence = line.match(/^\s*```([\w+-]*)/);
    if (fence) {
      flushPara();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; // 閉じフェンス
      const code = buf.join("\n");
      const lang = (fence[1] || "").toLowerCase();
      const cid = "cb" + ++cbSeq;
      cbStore[cid] = { code, lang, author: (ctx || {}).author || "user" };
      const isSvg = lang === "svg" || code.trimStart().startsWith("<svg");
      let html = "";
      if (isSvg) {
        // <img> + data URI 描画なのでスクリプトは実行されない
        html += '<img class="cb-svg" alt="SVG" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(code) + '">';
      }
      html +=
        '<div class="cb-bar"><span>' + (lang || "code") + "</span>" +
        '<button class="small cb-save" data-cid="' + cid + '">プールへ保存</button>' +
        '<button class="small cb-copy" data-cid="' + cid + '">コピー</button></div>' +
        "<pre><code>" + escapeHtml(code) + "</code></pre>";
      out.push(html);
      continue;
    }
    // 見出し
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      const level = Math.min(h[1].length, 4);
      out.push(`<h${level}>` + inlineMd(h[2]) + `</h${level}>`);
      i++;
      continue;
    }
    // 水平線
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushPara();
      out.push("<hr>");
      i++;
      continue;
    }
    // 引用
    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + buf.map(inlineMd).join("<br>") + "</blockquote>");
      continue;
    }
    // 表（ヘッダ行 + 区切り行）
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara();
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => inlineMd(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
      out.push(
        "<table><thead><tr>" + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    // リスト（箇条書き／番号。ネストは1段のみ対応）
    const isUl = (l) => /^\s*[-*+]\s+/.test(l);
    const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
    if (isUl(line) || isOl(line)) {
      flushPara();
      const ordered = isOl(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length && (isUl(lines[i]) || isOl(lines[i]))) {
        let item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        i++;
        // 継続行（インデントされた通常行）を取り込む
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) {
          item += "\n" + lines[i++].trim();
        }
        items.push("<li>" + item.split("\n").map(inlineMd).join("<br>") + "</li>");
      }
      out.push(`<${tag}>` + items.join("") + `</${tag}>`);
      continue;
    }
    // 空行 = 段落区切り
    if (!line.trim()) {
      flushPara();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join("\n");
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

const TEXT_EXTS_UI = ["md", "txt", "log", "json", "js", "mjs", "ts", "tsx", "jsx", "py", "rs", "html", "css", "csv", "yaml", "yml", "toml", "sh", "diff", "patch"];
const IMAGE_EXTS_UI = ["png", "jpg", "jpeg", "gif", "svg", "webp"];
const VIDEO_EXTS_UI = ["mp4", "webm", "mov"];
const AUDIO_EXTS_UI = ["mp3", "wav", "ogg", "m4a"];
const extOf = (name) => (name.split(".").pop() || "").toLowerCase();
const isTextExt = (name) => TEXT_EXTS_UI.includes(extOf(name));
const isImageExt = (name) => IMAGE_EXTS_UI.includes(extOf(name));
const isVideoExt = (name) => VIDEO_EXTS_UI.includes(extOf(name));
const isAudioExt = (name) => AUDIO_EXTS_UI.includes(extOf(name));

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

// ファイルプレビューのキャッシュ（file+mtime をキーに再取得を抑制）
const poolPreview = {};
// 展開中のレビュー id（既定は折りたたみ・判定チップのみ表示）
const openReviews = new Set();

function poolPreviewEl(p) {
  const body = el("div", { class: "p-body mdview" });
  if (p.body) {
    body.innerHTML = renderMarkdown(p.body); // 旧形式
    return body;
  }
  if (!p.file || p.missing) {
    body.appendChild(el("div", { class: "empty", text: p.missing ? "ファイルが見つかりません" : "" }));
    return body;
  }
  const url = "/api/pool/file/" + encodeURIComponent(p.file);
  if (isImageExt(p.file)) {
    body.appendChild(el("img", { src: url + "?v=" + (p.mtime || 0), alt: p.title }));
    return body;
  }
  if (isVideoExt(p.file)) {
    body.appendChild(el("video", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;max-height:360px;border-radius:8px;" }));
    return body;
  }
  if (isAudioExt(p.file)) {
    body.appendChild(el("audio", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;" }));
    return body;
  }
  if (extOf(p.file) === "html" || extOf(p.file) === "htm") {
    // HTML は iframe でその場実行（ゲーム・デモ対応）。
    // allow-same-origin がないと localStorage 等で成果物側が停止するため付与
    // （ローカル単一ユーザーのツールで、プール内容は自分のエージェント由来という前提）
    body.appendChild(el("iframe", {
      src: url + "?v=" + (p.mtime || 0),
      sandbox: "allow-scripts allow-same-origin allow-pointer-lock",
      style: "width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#0e1116;",
    }));
    return body;
  }
  if (!isTextExt(p.file) || (p.size || 0) > 300_000) {
    body.appendChild(el("div", { class: "empty", text: "プレビューなし — リンクから開いてください" }));
    return body;
  }
  const key = p.file + ":" + (p.mtime || 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    if (extOf(p.file) === "md") body.innerHTML = renderMarkdown(cached.text);
    else body.innerHTML = "<pre><code>" + escapeHtml(cached.text) + "</code></pre>";
    return body;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch(url).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
  return body;
}

// ドラッグ＆ドロップ（アプリ内の移動 + OS からのファイルドロップ）
function wireDropTarget(node, destDirFn) {
  node.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.add("dragover");
  });
  node.addEventListener("dragleave", () => node.classList.remove("dragover"));
  node.addEventListener("drop", async (e) => {
    e.preventDefault();
    e.stopPropagation();
    node.classList.remove("dragover");
    const destDir = destDirFn();
    const payload = e.dataTransfer.getData("text/u2a2a");
    if (payload) {
      const { src } = JSON.parse(payload);
      if (src === destDir || destDir.startsWith(src + "/")) return;
      return poolMove(src, destDir);
    }
    // Finder 等からの OS ファイルドロップはアップロードとして受ける
    for (const f of e.dataTransfer.files || []) {
      const buf = await f.arrayBuffer();
      let bin = "";
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      await api("/api/pool/upload", "POST", { origin: "user", filename: f.name, dataBase64: btoa(bin), dir: destDir, autoReview: false });
      toast("アップロードしました: " + f.name);
    }
  });
}

function wireDragSource(node, relPath) {
  node.setAttribute("draggable", "true");
  node.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/u2a2a", JSON.stringify({ src: relPath }));
    e.dataTransfer.effectAllowed = "copyMove";
  });
}

function fileRowEl(p, depth) {
  const pending = (state.reviewPending || {})[p.id] || [];
  const busy = pending.length || (state.fixPending || {})[p.id];
  const base = (p.file || p.title).split("/").pop();
  const row = el("div", {
    class: "pf-row" + (p.id === poolSelectedId ? " sel" : ""),
    style: "padding-left:" + (8 + depth * 14) + "px",
    onclick: () => {
      poolSelectedId = p.id;
      poolCurrentDir = (p.file || "").includes("/") ? p.file.slice(0, p.file.lastIndexOf("/")) : "";
      if (p.file) poolFocus = { kind: "file", path: p.file };
      if (document.body.classList.contains("pool-collapsed")) togglePool(false);
      renderPool();
    },
  }, [
    el("span", { class: "pf-dot", "data-s": p.status, title: POOL_STATUS_LABEL[p.status] || p.status }),
    el("span", { class: "pf-name", text: base + (busy ? " …" : ""), title: p.title }),
    el("span", { class: "pf-size", text: fmtSize(p.size) }),
  ]);
  if (p.file) wireDragSource(row, p.file);
  return row;
}

function renderPool() {
  const listBox = $("#pool-list");
  const detailBox = $("#pool-detail");
  const all = [...(state.pool || [])].reverse(); // 新しい順
  const q = $("#pool-search").value.trim().toLowerCase();
  const items = q
    ? all.filter((p) => (p.title + " " + (p.file || "") + " " + NAMES[p.origin]).toLowerCase().includes(q))
    : all;
  $("#pool-count").textContent = all.length ? (q ? items.length + "/" + all.length : all.length) + " 件" : "";
  // 移動などでフォルダが消えていたら作成先をルートへ戻す
  if (poolCurrentDir && !(state.poolDirs || []).includes(poolCurrentDir)) poolCurrentDir = "";
  $("#pool-cwd").textContent = "作成先: pool/" + (poolCurrentDir ? poolCurrentDir + "/" : "");
  renderClipBar();

  listBox.replaceChildren();
  const isTopicSel = typeof poolSelectedId === "string" && poolSelectedId.startsWith("topic:");
  if (!isTopicSel && !items.some((p) => p.id === poolSelectedId)) poolSelectedId = items.length ? items[0].id : null;

  // 🧵 スレッド履歴（トピック一覧を DAS の一部としてブラウズ）
  const topics = state.topics || [];
  const topicRow = (t, depth) => {
    const active = t.id === (currentTopic() || {}).id;
    return el("div", {
      class: "pf-row" + (poolSelectedId === "topic:" + t.id ? " sel" : ""),
      style: "padding-left:" + (8 + depth * 14) + "px",
      onclick: () => {
        poolSelectedId = "topic:" + t.id;
        if (document.body.classList.contains("pool-collapsed")) togglePool(false);
        renderPool();
      },
    }, [
      el("span", { class: "pf-dot", style: active ? "background:var(--user)" : "", title: active ? "表示中" : "" }),
      el("span", { class: "pf-name", text: "🧵 " + t.title }),
      el("span", { class: "pf-size", text: (state.messages || []).filter((m) => m.topicId === t.id).length + " msg" }),
    ]);
  };
  const qTopics = q ? topics.filter((t) => t.title.toLowerCase().includes(q)) : [];

  if (q) {
    // 検索中はフラット表示（パス付き・スレッドも横断）
    for (const t of qTopics) listBox.appendChild(topicRow(t, 0));
    if (!items.length && !qTopics.length) listBox.appendChild(el("div", { class: "empty", text: "検索に一致なし" }));
    for (const p of items) {
      const row = fileRowEl(p, 0);
      row.querySelector(".pf-name").textContent = p.file || p.title;
      listBox.appendChild(row);
    }
  } else {
    const thOpen = !closedDirs.has("threads");
    listBox.appendChild(el("div", {
      class: "pf-row folder",
      title: "スレッド履歴（自動生成ミラー: pool/threads/）",
      onclick: () => {
        thOpen ? closedDirs.add("threads") : closedDirs.delete("threads");
        renderPool();
      },
    }, [
      el("span", { class: "chev", text: thOpen ? "▾" : "▸" }),
      el("span", { class: "pf-name", text: "🧵 スレッド履歴" }),
      el("span", { class: "pf-size", text: topics.length + " 件" }),
    ]));
    if (thOpen) for (const t of topics) listBox.appendChild(topicRow(t, 1));
  }
  if (!q) {
    // Finder 風ツリー（フォルダ＋ファイル）
    const dirs = state.poolDirs || [];
    const byDir = (dir) => items.filter((p) => {
      const f = p.file || "";
      const parent = f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "";
      return parent === dir;
    });
    const childDirs = (dir) => dirs.filter((d) => {
      const parent = d.includes("/") ? d.slice(0, d.lastIndexOf("/")) : "";
      return parent === dir && d !== dir;
    });
    const renderDir = (dir, depth) => {
      for (const d of childDirs(dir)) {
        const open = !closedDirs.has(d);
        const name = d.split("/").pop();
        const folderRow = el("div", {
          class: "pf-row folder" + (poolCurrentDir === d ? " cwd" : ""),
          style: "padding-left:" + (8 + depth * 14) + "px",
          title: "クリックで作成先に指定 ／ ドロップで移動先に",
          onclick: () => {
            if (poolCurrentDir === d) {
              closedDirs.has(d) ? closedDirs.delete(d) : closedDirs.add(d);
            }
            poolCurrentDir = d;
            poolFocus = { kind: "dir", path: d };
            renderPool();
          },
        }, [
          el("span", { class: "chev", text: open ? "▾" : "▸" }),
          el("span", { class: "pf-name", text: "📁 " + name }),
        ]);
        wireDragSource(folderRow, d);
        wireDropTarget(folderRow, () => d);
        listBox.appendChild(folderRow);
        if (open) renderDir(d, depth + 1);
      }
      for (const p of byDir(dir)) listBox.appendChild(fileRowEl(p, depth));
    };
    renderDir("", 0);
    if (!items.length && !dirs.length) {
      listBox.appendChild(el("div", { class: "empty", text: "成果物なし — u2a2a/pool/ に置くか「＋持ち込み」" }));
    }
  }

  // 詳細
  detailBox.replaceChildren();
  if (isTopicSel) {
    const t = topics.find((x) => "topic:" + x.id === poolSelectedId);
    if (t) {
      renderTopicDetail(detailBox, t);
      return;
    }
  }
  const sel = items.find((p) => p.id === poolSelectedId);
  if (!sel) {
    detailBox.appendChild(el("div", { class: "empty", text: "ファイルを選択してください" }));
    return;
  }
  renderPoolDetail(detailBox, sel);
}

function renderTopicDetail(box, t) {
  const msgs = (state.messages || []).filter((m) => m.topicId === t.id);
  const active = t.id === (currentTopic() || {}).id;
  box.appendChild(el("div", { class: "p-head" }, [
    el("span", { class: "origin", text: "🧵 スレッド履歴" }),
    el("span", { class: "p-title", text: t.title }),
    el("span", { class: "pf-size", text: msgs.length + " メッセージ" }),
  ]));
  if (t.mirrorFile) {
    const url = "/api/pool/file/" + encodeURIComponent(t.mirrorFile);
    box.appendChild(el("div", { class: "p-file" }, [
      el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + t.mirrorFile }),
      el("span", { class: "p-size", text: "自動生成ミラー（エージェントもこのパスで参照可）" }),
    ]));
  }
  const actions = el("div", { class: "actions" }, [
    el("button", { class: "small", text: active ? "表示中のスレッドです" : "このスレッドを開く", onclick: () => { if (!active) switchTopic(t.id); } }),
    el("button", {
      class: "small",
      text: "履歴をコピー",
      onclick: async () => {
        if (!t.mirrorFile) return;
        const r = await fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile));
        copy(await r.text());
      },
    }),
  ]);
  box.appendChild(actions);
  // 履歴プレビュー（ミラーファイルを取得して Markdown 表示）
  const body = el("div", { class: "p-body mdview" });
  box.appendChild(body);
  if (!t.mirrorFile) return;
  const key = t.mirrorFile + ":" + msgs.length + ":" + (msgs.length ? msgs[msgs.length - 1].ts : 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    body.innerHTML = renderMarkdown(cached.text);
    return;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch("/api/pool/file/" + encodeURIComponent(t.mirrorFile)).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
}

function renderPoolDetail(box, p) {
  {
    const pending = (state.reviewPending || {})[p.id] || [];
    const head = el("div", { class: "p-head" }, [
      el("span", { class: "status", "data-s": p.status, text: POOL_STATUS_LABEL[p.status] || p.status }),
      el("span", { class: "origin", "data-o": p.origin, text: "持ち込み: " + NAMES[p.origin] }),
      el("span", { class: "p-title", text: p.title }),
    ]);
    if (p.via === "folder") head.appendChild(el("span", { class: "origin", text: "フォルダ投入" }));
    if (p.via === "upload") head.appendChild(el("span", { class: "origin", text: "アップロード" }));

    const kids = [head];
    if (p.file) {
      const fileUrl = "/api/pool/file/" + encodeURIComponent(p.file);
      const fileRow = el("div", { class: "p-file" }, [
        el("a", { href: fileUrl, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + p.file }),
        el("span", { class: "p-size", text: fmtSize(p.size) + (p.missing ? "（ファイルが見つかりません）" : "") }),
      ]);
      kids.push(fileRow);
    }
    kids.push(poolPreviewEl(p));
    for (const r of p.reviews || []) {
      const rOpen = openReviews.has(r.id);
      const rHead = el("div", {
        class: "r-head",
        onclick: () => {
          rOpen ? openReviews.delete(r.id) : openReviews.add(r.id);
          renderPool();
        },
      }, [
        el("span", { class: "chev", text: rOpen ? "▾" : "▸" }),
        el("span", { class: "reviewer", "data-o": r.reviewer, text: "🔎 " + NAMES[r.reviewer] + " のレビュー" }),
      ]);
      if (r.verdict) rHead.appendChild(el("span", { class: "verdict", "data-v": r.verdict, text: "【判定】" + r.verdict }));
      const reviewKids = [rHead];
      if (rOpen) {
        const rBody = el("div", { class: "r-body mdview" });
        rBody.innerHTML = renderMarkdown(r.text);
        reviewKids.push(rBody);
      }
      kids.push(el("div", { class: "review" }, reviewKids));
    }
    // 修正履歴（レビューと同じ折りたたみ UI）
    for (const f of p.fixes || []) {
      const fOpen = openReviews.has(f.id);
      const fHead = el("div", {
        class: "r-head",
        onclick: () => {
          fOpen ? openReviews.delete(f.id) : openReviews.add(f.id);
          renderPool();
        },
      }, [
        el("span", { class: "chev", text: fOpen ? "▾" : "▸" }),
        el("span", { class: "reviewer", "data-o": f.agent, text: "🔧 " + NAMES[f.agent] + " の修正" + (f.error ? "（失敗）" : "") }),
        el("span", { class: "pf-size", text: fmtTime(f.ts) }),
      ]);
      const fixKids = [fHead];
      if (fOpen) {
        const fBody = el("div", { class: "r-body mdview" });
        fBody.innerHTML = renderMarkdown(f.text);
        fixKids.push(fBody);
      }
      kids.push(el("div", { class: "review" }, fixKids));
    }
    for (const r of pending) {
      const act = (state.activity || {})["review:" + p.id + ":" + r];
      kids.push(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[r] + " がレビュー中" }));
    }
    const fixer = (state.fixPending || {})[p.id];
    if (fixer) {
      const act = (state.activity || {})["fix:" + p.id];
      kids.push(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[fixer] + " が修正中" }));
    }

    const actions = el("div", { class: "actions" });
    for (const agent of ["claude", "codex"]) {
      if (!pending.includes(agent)) {
        actions.appendChild(el("button", {
          class: "small",
          text: NAMES[agent] + " にレビュー依頼",
          onclick: () => api("/api/pool/" + p.id + "/review", "POST", { reviewer: agent }),
        }));
      }
    }
    if (p.file && !(state.fixPending || {})[p.id]) {
      for (const agent of ["claude", "codex"]) {
        actions.appendChild(el("button", {
          class: "small",
          text: NAMES[agent] + " に修正依頼",
          onclick: () => api("/api/pool/" + p.id + "/fix", "POST", { agent })
            .then(() => toast(NAMES[agent] + " が修正を開始しました（完了後、自動で再レビュー）")),
        }));
      }
    }
    if (p.status !== "approved")
      actions.appendChild(el("button", { class: "small", text: "承認", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "approved" }) }));
    if (p.status !== "rejected")
      actions.appendChild(el("button", { class: "small", text: "差し戻し", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "rejected" }) }));
    actions.appendChild(el("button", {
      class: "small",
      text: "コピー",
      onclick: async () => {
        if (p.body) return copy(p.body);
        if (p.file && isTextExt(p.file)) {
          const r = await fetch("/api/pool/file/" + encodeURIComponent(p.file));
          return copy(await r.text());
        }
        copy("u2a2a/pool/" + (p.file || ""));
      },
    }));
    actions.appendChild(el("button", {
      class: "small",
      text: "削除",
      onclick: (e) => armedDelete(e.target, () => api("/api/pool/" + p.id, "DELETE").then(() => toast(".trash へ退避しました"))),
    }));
    kids.push(actions);
    for (const k of kids) box.appendChild(k);
  }
}

function renderThread(agent) {
  const box = $("#messages-" + agent);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const topic = currentTopic();
  const msgs = state.messages.filter((m) => m.thread === agent && topic && m.topicId === topic.id);
  $("#count-" + agent).textContent = msgs.length ? msgs.length + " 件" : "";
  box.replaceChildren();
  if (!msgs.length) {
    if (isRunning(agent)) {
      const act = threadActivity(agent);
      box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
    } else {
      box.appendChild(el("div", { class: "empty", text: "まだメッセージがありません" }));
    }
    return;
  }
  for (const m of msgs) {
    const meta = el("div", { class: "meta" }, [
      el("span", { class: "who", text: NAMES[m.author] }),
      el("span", { text: fmtTime(m.ts) }),
    ]);
    if (m.relayedFrom) meta.appendChild(el("span", { text: "（" + NAMES[m.relayedFrom] + "スレッドから転送）" }));
    if (m.taskId) meta.appendChild(el("span", { text: "（タスク結果）" }));
    if (m.auto) meta.appendChild(el("span", { text: "（自動応答）" }));
    if (m.qa) meta.appendChild(el("span", { text: "（質疑）" }));
    if (m.external) meta.appendChild(el("span", { text: "（外部セッションから同期）" }));

    const isRaw = rawView.has(m.id);
    const actions = el("div", { class: "actions" }, [
      el("button", { class: "small", text: "タスク化", onclick: () => openTaskDialog(agent, m) }),
      el("button", {
        class: "small",
        text: NAMES[OTHER[agent]] + " へ転送",
        onclick: () => relay(agent, m),
      }),
      el("button", { class: "small", text: "コピー", onclick: () => copy(m.text) }),
      el("button", { class: "small", text: "プールへ", onclick: () => openPoolDialog(m.author, m.text, m.id) }),
      el("button", {
        class: "small",
        text: isRaw ? "MD表示" : "生表示",
        onclick: () => {
          rawView.has(m.id) ? rawView.delete(m.id) : rawView.add(m.id);
          renderThread(agent);
        },
      }),
    ]);

    // 転送・質疑中継で届いた内容は送信元に原文があるため、受信側では折りたたみ表示
    let body;
    if (m.relayedFrom && !expandedRelays.has(m.id)) {
      body = el("div", {
        class: "relay-collapsed",
        text: "📨 " + NAMES[m.relayedFrom] + " 側からの送信テキスト（" + m.text.length + " 文字）— クリックで展開",
        onclick: () => {
          expandedRelays.add(m.id);
          renderThread(agent);
        },
      });
    } else {
      body = el("div", { class: "mdview" + (isRaw ? " raw" : "") });
      if (isRaw) body.textContent = m.text;
      else body.innerHTML = renderMarkdown(m.text, { author: m.author });
      if (m.relayedFrom) {
        meta.appendChild(el("span", {
          class: "relay-fold",
          text: "（折りたたむ）",
          onclick: () => {
            expandedRelays.delete(m.id);
            renderThread(agent);
          },
        }));
      }
    }

    const kids = [meta, body];
    // 本文中の pool パスを検出し、画像はインライン・その他はリンクで自動プレビュー
    if (!(m.relayedFrom && !expandedRelays.has(m.id))) {
      const paths = [...new Set(m.text.match(/u2a2a\/pool\/[^\s)"'`」()）]+/g) || [])].slice(0, 4);
      const mediaKids = [];
      for (const full of paths) {
        const rel = full.slice("u2a2a/pool/".length);
        // Markdown 記法で既に本文中に埋め込まれているものは重複させない
        if (new RegExp("\\]\\([^)]*" + rel.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\)").test(m.text)) continue;
        const url = "/api/pool/file/" + encodeURI(rel);
        if (isImageExt(rel)) mediaKids.push(el("img", { src: url, alt: rel, loading: "lazy" }));
        else if (isVideoExt(rel)) mediaKids.push(el("video", { src: url, controls: "", style: "max-width:100%;max-height:260px;border-radius:6px;" }));
        else if (isAudioExt(rel)) mediaKids.push(el("audio", { src: url, controls: "", style: "width:100%;" }));
        else mediaKids.push(el("a", { href: url, target: "_blank", rel: "noopener", text: "📄 " + full }));
      }
      if (mediaKids.length) kids.push(el("div", { class: "msg-media" }, mediaKids));
    }
    kids.push(actions);
    box.appendChild(el("div", { class: "msg" + (m.external ? " external" : ""), "data-author": m.author, "data-mid": m.id }, kids));
  }
  if (isRunning(agent)) {
    const act = threadActivity(agent);
    box.appendChild(act ? activityEl(act) : el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function taskPrompt(t) {
  return [
    "【U2A2A タスク】" + t.title,
    t.detail ? "\n" + t.detail : "",
    "\n\n完了したら結果テキストを U2A2A アプリのタスク「" + t.title + "」に再入力してください。",
  ].join("");
}

// タスクキューの開閉。null = 自動（未完了タスクがあれば開く）
const taskZoneOpen = { claude: null, codex: null };

function renderTasks(agent) {
  const box = $("#tasks-" + agent);
  const head = $("#tasks-head-" + agent);
  box.replaceChildren();
  const topic = currentTopic();
  const tasks = state.tasks.filter((t) => t.agent === agent && topic && (t.topicId === topic.id || !t.topicId));
  const active = tasks.filter((t) => t.status !== "done").length;
  const open = taskZoneOpen[agent] != null ? taskZoneOpen[agent] : active > 0;
  head.textContent =
    (open ? "▾ " : "▸ ") + agent.toUpperCase() + " タスクキュー" +
    (tasks.length ? `（${active} 件${tasks.length - active ? " / 完了 " + (tasks.length - active) : ""}）` : "（なし）") +
    " — " + NAMES[agent] + " アプリ内で作業";
  head.onclick = () => {
    taskZoneOpen[agent] = !open;
    renderTasks(agent);
  };
  box.hidden = !open;
  if (!open) return;
  if (!tasks.length) {
    box.appendChild(el("div", { class: "empty", text: "タスクなし" }));
    return;
  }
  for (const t of tasks) {
    const actions = el("div", { class: "actions" });
    actions.appendChild(el("button", { class: "small", text: "プロンプトをコピー", onclick: () => copy(taskPrompt(t)) }));
    if (t.status === "queued")
      actions.appendChild(el("button", { class: "small", text: "作業開始", onclick: () => patchTask(t.id, "working") }));
    if (t.status === "queued" || t.status === "working")
      actions.appendChild(el("button", { class: "small", text: "結果を入力", onclick: () => openResultDialog(t) }));
    if (t.status === "returned")
      actions.appendChild(el("button", { class: "small", text: "完了にする", onclick: () => patchTask(t.id, "done") }));
    if (t.result)
      actions.appendChild(el("button", {
        class: "small",
        text: "プールへ",
        onclick: () => openPoolDialog(t.agent, t.result, null, t.title),
      }));
    actions.appendChild(el("button", { class: "small", text: "削除", onclick: (e) => armedDelete(e.target, () => delTask(t)) }));

    const kids = [
      el("div", { class: "t-head" }, [
        el("span", { class: "status", "data-s": t.status, text: STATUS_LABEL[t.status] }),
        el("span", { class: "t-title", text: t.title }),
      ]),
    ];
    if (t.detail) kids.push(el("div", { class: "t-detail", text: t.detail }));
    if (t.result) kids.push(el("div", { class: "t-result", text: "結果: " + t.result }));
    kids.push(actions);
    box.appendChild(el("div", { class: "task" }, kids));
  }
}

const CB_EXT = { svg: "svg", html: "html", htm: "html", javascript: "js", js: "js", mjs: "mjs", ts: "ts", python: "py", py: "py", json: "json", css: "css", markdown: "md", md: "md", diff: "diff", patch: "patch", sh: "sh", bash: "sh", yaml: "yaml", yml: "yml" };

  if (!cid || !cbStore[cid]) return;
  const { code, lang, author } = cbStore[cid];
  if (e.target.classList.contains("cb-copy")) copy(code);

  const body = $("#pool-body").value.trim();
  const file = $("#pool-file").files[0];
  if (file) {
    // ファイル添付はアップロードとして登録
    const buf = await file.arrayBuffer();
    let bin = "";
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    await api("/api/pool/upload", "POST", {
      origin: $("#pool-origin").value,
      title: title || file.name,
      filename: file.name,
      dataBase64: btoa(bin),
      dir: poolCurrentDir,
      autoReview: $("#pool-autoreview").checked,
    });
  } else {
    if (!title || !body) return toast("タイトルと成果物を入力してください");
    await api("/api/pool", "POST", {
      origin: $("#pool-origin").value,
      title,
      body,
      dir: poolCurrentDir,
      filename: $("#pool-filename").value.trim() || undefined,

      autoReview: $("#pool-autoreview").checked,

});

// confirm() の代替: 1度目のクリックで「本当に削除？」に変わり、2.5秒以内の再クリックで実行
function armedDelete(btn, action) {
  if (btn.dataset.armed) {
    action();
    return;
  }
  btn.dataset.armed = "1";
  const orig = btn.textContent;
  btn.textContent = "本当に削除？";
  btn.classList.add("danger");
  setTimeout(() => {
    btn.dataset.armed = "";
    btn.textContent = orig;
    btn.classList.remove("danger");
  }, 2500);
}

// ---- 添付: プールの attachments/ に保存し、メッセージに参照を挿入 ----
async function fileToBase64(f) {
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

    api("/api/agents/" + agent, "PATCH", { auto: e.target.checked });
  });
  $("#reset-" + agent).addEventListener("click", (e) => {
    const t = currentTopic();
    if (!t) return;
    api("/api/topics/" + t.id, "PATCH", { resetAgent: agent })
      .then(() => toast(NAMES[agent] + " は次の応答から新しい CLI セッションになります（文脈はリセット）"));
  });
  const modelInput = $("#model-" + agent);
  const commitModel = () => {
    const cur = ((state.agents || {})[agent] || {}).modelOverride || "";
    if (modelInput.value.trim() === cur) return;
    api("/api/agents/" + agent, "PATCH", { model: modelInput.value })
      .then(() => toast(modelInput.value.trim() ? "モデルを " + modelInput.value.trim() + " に設定しました" : "モデルを CLI 既定に戻しました"));
  };
  modelInput.addEventListener("change", commitModel);
  modelInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { commitModel(); modelInput.blur(); } });
}
for (const btn of document.querySelectorAll("[data-agent-send]")) {
  const agent = btn.getAttribute("data-agent-send");
  btn.addEventListener("click", () => sendAgent(agent));
  $("#input-" + agent).addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendAgent(agent);
  });
}

// ---- live sync ----
const es = new EventSource("/api/events");
es.onmessage = (e) => {
  state = JSON.parse(e.data);
  render();
};
render();
</script>
</body>
</html>
