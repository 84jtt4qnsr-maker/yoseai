<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U2A2A Orchestration</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c232e;
    --line: #2a3341;
    --text: #dce3ec;
    --dim: #8a96a6;
    --user: #7bd88f;
    --claude: #ffab5e;
    --codex: #6fd7ff;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  header {
    padding: 6px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--dim); font-size: 12px; }

  /* ユーザー帯（Canvas 上段・緑） */
  #user-band {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-band .role-dot { background: var(--user); }
  #user-band textarea {
    flex: 1;
    min-height: 38px;
    max-height: 140px;
    resize: vertical;
  }
  #qa-hops { width: 64px; }
  #qa-bar[hidden] { display: none; }
  #qa-bar {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    color: var(--codex);
  }
  .role-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; flex: none;
    align-self: center;
  }
  textarea, select, input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: 1px solid var(--dim); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--dim); }
  button.small { padding: 2px 8px; font-size: 11.5px; color: var(--dim); border-radius: 6px; }
  button.small:hover { color: var(--text); }

  /* 左=会話系（スレッド2列） / 右=共有タスクプール */
  #content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  body.pool-collapsed #content { grid-template-columns: 1fr auto; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 0;
    min-width: 0;
  }
  .thread-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .thread-col + .thread-col { border-left: 1px solid var(--line); }
  .thread-head {
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 4px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .thread-col[data-agent="claude"] .thread-head .role-dot { background: var(--claude); }
  .thread-col[data-agent="codex"] .thread-head .role-dot { background: var(--codex); }
  .thread-head .count { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .thread-head .auto-ctl {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .thread-head .auto-ctl input { accent-color: var(--user); }
  .agent-status { font-size: 11.5px; margin-left: 10px; font-weight: 400; }
  .model-chip {
    font-size: 11px;
    font-weight: 400;
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 10px;
    width: 92px;
    transition: width 0.15s;
  }
  .model-chip::placeholder { color: var(--dim); }
  .model-chip:focus { outline: 1px solid var(--dim); width: 180px; }
  .agent-status[data-s="running"] { color: var(--codex); }
  .agent-status[data-s="error"] { color: var(--danger); cursor: help; }
  .typing {
    color: var(--dim);
    font-size: 12.5px;
    padding: 2px 4px;
  }
  .typing::after {
    content: "…";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 8px;
    padding: 6px 11px;
    position: relative;
  }
  .msg[data-author="user"] { border-left-color: var(--user); }
  .msg[data-author="claude"] { border-left-color: var(--claude); }
  .msg[data-author="codex"] { border-left-color: var(--codex); }
  .msg.external { border-style: dashed; border-left-style: solid; }
  .msg .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .msg .meta .who { font-weight: 600; }
  .msg[data-author="user"] .who { color: var(--user); }
  .msg[data-author="claude"] .who { color: var(--claude); }
  .msg[data-author="codex"] .who { color: var(--codex); }
  .mdview { word-break: break-word; overflow-x: auto; }
  .mdview.raw { white-space: pre-wrap; }
  .mdview p { margin: 0.35em 0; }
  .mdview h1, .mdview h2, .mdview h3, .mdview h4 {
    margin: 0.6em 0 0.3em;
    font-size: 1.05em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .mdview h1 { font-size: 1.15em; }
  .mdview h2 { font-size: 1.1em; }
  .mdview ul, .mdview ol { margin: 0.35em 0; padding-left: 1.5em; }
  .mdview li { margin: 0.15em 0; }
  .mdview code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.92em;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
  .mdview pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0.4em 0;
  }
  .mdview pre code { background: none; border: none; padding: 0; }
  .mdview blockquote {
    margin: 0.4em 0;
    padding: 2px 10px;
    border-left: 3px solid var(--dim);
    color: var(--dim);
  }
  .mdview table {
    border-collapse: collapse;
    margin: 0.4em 0;
    font-size: 0.95em;
  }
  .mdview th, .mdview td {
    border: 1px solid var(--line);
    padding: 3px 9px;
    text-align: left;
  }
  .mdview th { background: var(--panel-2); }
  .mdview a { color: var(--codex); }
  .mdview hr { border: none; border-top: 1px solid var(--line); margin: 0.6em 0; }
  /* メッセージのアクションはホバー時のみ右上にオーバーレイ表示（縦の圧迫を防ぐ） */
  .msg .actions {
    display: none;
    position: absolute;
    top: 4px;
    right: 6px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 5px;
    z-index: 2;
  }
  .msg:hover .actions, .msg:focus-within .actions { display: flex; }
  .empty { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 24px; }

  /* エージェント返答入力 */
  .agent-input {
    border-top: 1px solid var(--line);
    padding: 7px 14px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
  }
  .agent-input textarea { flex: 1; min-height: 32px; max-height: 120px; resize: vertical; }

  /* タスクキュー（Canvas 下段）: 折りたたみ式 */
  .task-zone {
    border-top: 1px solid var(--line);
    padding: 4px 16px 8px;
    max-height: 30vh;
    overflow-y: auto;
    flex: none;
  }
  .task-zone h2 {
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 4px 0 6px;
    cursor: pointer;
    user-select: none;
  }
  .task-zone h2:hover { color: var(--text); }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
  }
  .task .t-head { display: flex; gap: 8px; align-items: center; }
  .task .t-title { font-weight: 600; flex: 1; word-break: break-word; }
  .task .t-detail { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .task .t-result { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .task .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .status {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .status[data-s="queued"]   { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="working"]  { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="returned"] { color: var(--claude); border-color: #ffab5e55; }
  .status[data-s="done"]     { color: var(--user); border-color: #7bd88f55; }

  /* 共有タスクプール（右半分・縦フル） */
  #pool-zone {
    border-left: 2px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  body.pool-collapsed #pool-zone .sub { display: none; }
  #pool-head {
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
    row-gap: 4px;
    flex: none;
  }
  #pool-head .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  #pool-head button { margin-left: auto; }
  /* ファイルビューワー: 左リスト + 右詳細 */
  #pool-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #pool-list-wrap {
    width: 270px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    padding: 4px 6px 0;
    min-height: 0;
  }
  #pool-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  body.pool-collapsed #pool-list-wrap { border-right: none; }
  body.pool-collapsed #pool-detail { display: none; }
  #pool-search {
    width: 100%;
    padding: 4px 10px;
    font-size: 12.5px;
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .pf-row {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .pf-row:hover { background: var(--panel-2); }
  .pf-row.sel { background: var(--panel-2); outline: 1px solid var(--line); }
  .pf-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .pf-dot[data-s="submitted"] { background: #d8c56f; }
  .pf-dot[data-s="reviewing"] { background: var(--codex); }
  .pf-dot[data-s="approved"] { background: var(--user); }
  .pf-dot[data-s="rejected"] { background: var(--danger); }
  .pf-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
  }
  .pf-size { color: var(--dim); font-size: 10.5px; flex: none; }
  #pool-detail {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 10px 14px 14px;
  }
  #pool-detail .p-body { max-height: none; }
  /* 狭い画面では従来の上下配置に戻す */
  @media (max-width: 1100px) {
    #content { display: flex; flex-direction: column; }
    main { flex: 1; }
    #pool-zone { border-left: none; border-top: 2px solid var(--line); flex: none; max-height: 40vh; }
    #pool-list-wrap { width: 210px; }
    #pool-detail .p-body { max-height: 180px; }
  }
  .p-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .p-title { font-weight: 600; flex: 1; min-width: 120px; word-break: break-word; }
  .origin {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .origin[data-o="user"] { color: var(--user); border-color: #7bd88f55; }
  .origin[data-o="claude"] { color: var(--claude); border-color: #ffab5e55; }
  .origin[data-o="codex"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="submitted"] { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="reviewing"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="approved"] { color: var(--user); border-color: #7bd88f55; }
  .status[data-s="rejected"] { color: var(--danger); border-color: #ff7b7b55; }
  .p-file {
    margin-top: 5px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .p-file a { color: var(--codex); text-decoration: none; word-break: break-all; }
  .p-file a:hover { text-decoration: underline; }
  .p-file .p-size { color: var(--dim); flex: none; }
  .p-body {
    margin-top: 6px;
    overflow-y: auto;
    word-break: break-word;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .p-body:empty { display: none; }
  .p-body img { max-width: 100%; max-height: 340px; border-radius: 6px; }
  .review {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--panel);
  }
  .review .r-head {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .review .r-head:hover .reviewer { text-decoration: underline; }
  .review .r-head .chev { flex: none; }
  .review .r-body { margin-top: 4px; }
  .review .r-head .reviewer { font-weight: 600; }
  .review .r-head .reviewer[data-o="claude"] { color: var(--claude); }
  .review .r-head .reviewer[data-o="codex"] { color: var(--codex); }
  .verdict {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    flex: none;
  }
  .verdict[data-v="承認"] { color: var(--user); border-color: #7bd88f55; }
  .verdict[data-v="条件付き承認"] { color: #d8c56f; border-color: #d8c56f55; }
  .verdict[data-v="差し戻し"] { color: var(--danger); border-color: #ff7b7b55; }
  .review .r-body { max-height: 200px; overflow-y: auto; word-break: break-word; font-size: 13px; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    width: min(520px, 92vw);
  }
  dialog::backdrop { background: #0009; }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog .field { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  dialog label { font-size: 12px; color: var(--dim); }
  dialog input, dialog textarea { width: 100%; }
  dialog textarea { min-height: 90px; resize: vertical; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  #toast {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--dim);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>U2A2A Orchestration</h1>
  <span class="sub">ユーザー ⇄ Claude Code ⇄ Codex ／ やり取りから生まれたタスクを各アプリで作業し、結果を再入力する</span>
</header>

<!-- ユーザー側（閲覧・回答・質問） -->
<div id="user-band">
  <span class="role-dot" title="ユーザー"></span>
  <textarea id="user-text" placeholder="ユーザーとして発言（回答・質問）— Cmd+Enter で送信"></textarea>
  <select id="user-target" title="送信先スレッド">
    <option value="claude">→ Claude Code</option>
    <option value="codex">→ Codex</option>
    <option value="both">→ 両方</option>
    <option value="qa-claude">🗨 質疑（Claude先手）</option>
    <option value="qa-codex">🗨 質疑（Codex先手）</option>
  </select>
  <input id="qa-hops" type="number" min="1" max="20" value="6" title="自動中継の上限手数" hidden />
  <button id="user-send">送信</button>
</div>
<div id="qa-bar" hidden>
  <span id="qa-status"></span>
  <button id="qa-stop" class="small">質疑を停止</button>
</div>

<div id="content">
<main>
  <!-- Claude Code 側スレッド -->
  <section class="thread-col" data-agent="claude">
    <div class="thread-head"><span class="role-dot"></span>Claude Code 側スレッド<input class="model-chip" id="model-claude" list="models-claude" title="使用モデルを指定（空欄=CLI既定）。プレースホルダは直近の実使用モデル" /><datalist id="models-claude"><option value="opus"></option><option value="sonnet"></option><option value="haiku"></option></datalist><span class="count" id="count-claude"></span><span class="agent-status" id="status-claude"></span>
      <label class="auto-ctl"><input type="checkbox" id="auto-claude" />自動応答</label>
    </div>
    <div class="messages" id="messages-claude"></div>
    <div class="agent-input">
      <textarea id="input-claude" placeholder="Claude Code の返答・質問を貼り付け／入力 — Cmd+Enter で追加"></textarea>
      <button data-agent-send="claude">Claude として追加</button>
    </div>
    <div class="task-zone">
      <h2 id="tasks-head-claude"></h2>
      <div id="tasks-claude"></div>
    </div>
  </section>

  <!-- Codex 側スレッド -->
  <section class="thread-col" data-agent="codex">
    <div class="thread-head"><span class="role-dot"></span>Codex 側スレッド<input class="model-chip" id="model-codex" list="models-codex" title="使用モデルを指定（空欄=CLI既定）。プレースホルダは直近の実使用モデル" /><datalist id="models-codex"></datalist><span class="count" id="count-codex"></span><span class="agent-status" id="status-codex"></span>
      <label class="auto-ctl"><input type="checkbox" id="auto-codex" />自動応答</label>
    </div>
    <div class="messages" id="messages-codex"></div>
    <div class="agent-input">
      <textarea id="input-codex" placeholder="Codex の返答・質問を貼り付け／入力 — Cmd+Enter で追加"></textarea>
      <button data-agent-send="codex">Codex として追加</button>
    </div>
    <div class="task-zone">
      <h2 id="tasks-head-codex"></h2>
      <div id="tasks-codex"></div>
    </div>
  </section>
</main>

<!-- 共有タスクプール -->
<section id="pool-zone">
  <div id="pool-head">
    共有タスクプール
    <span class="sub" id="pool-count"></span>
    <button id="pool-add">＋ 持ち込み</button>
    <button id="pool-toggle" class="small">折りたたむ</button>
  </div>
  <div id="pool-body">
    <div id="pool-list-wrap">

<script>
const NAMES = { user: "ユーザー", claude: "Claude Code", codex: "Codex" };

const STATUS_LABEL = { queued: "キュー", working: "作業中", returned: "結果あり", done: "完了" };
let state = { messages: [], tasks: [], pool: [], agents: {}, running: {}, relay: {}, reviewPending: {} };
const POOL_STATUS_LABEL = { submitted: "持ち込み", reviewing: "レビュー", approved: "承認", rejected: "差し戻し" };

const $ = (s) => document.querySelector(s);

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    toast(err.error || "エラーが発生しました");
    throw new Error(err.error || res.status);
  }
  return res.json();
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

// ---- 軽量 Markdown レンダラー（HTML はすべてエスケープ＝無害化した上で装飾のみ付与） ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineMd(raw) {
  let s = escapeHtml(raw);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function renderMarkdown(src) {
  const lines = src.split("\n");
  const out = [];
  let para = [];
  const flushPara = () => {
    if (para.length) out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>");
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // フェンス付きコードブロック
    const fence = line.match(/^\s*```/);
    if (fence) {
      flushPara();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; // 閉じフェンス
      out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
      continue;
    }
    // 見出し
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      const level = Math.min(h[1].length, 4);
      out.push(`<h${level}>` + inlineMd(h[2]) + `</h${level}>`);
      i++;
      continue;
    }
    // 水平線
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushPara();
      out.push("<hr>");
      i++;
      continue;
    }
    // 引用
    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + buf.map(inlineMd).join("<br>") + "</blockquote>");
      continue;
    }
    // 表（ヘッダ行 + 区切り行）
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara();
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => inlineMd(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
      out.push(
        "<table><thead><tr>" + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    // リスト（箇条書き／番号。ネストは1段のみ対応）
    const isUl = (l) => /^\s*[-*+]\s+/.test(l);
    const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
    if (isUl(line) || isOl(line)) {
      flushPara();
      const ordered = isOl(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length && (isUl(lines[i]) || isOl(lines[i]))) {
        let item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        i++;
        // 継続行（インデントされた通常行）を取り込む
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) {
          item += "\n" + lines[i++].trim();
        }
        items.push("<li>" + item.split("\n").map(inlineMd).join("<br>") + "</li>");
      }
      out.push(`<${tag}>` + items.join("") + `</${tag}>`);
      continue;
    }
    // 空行 = 段落区切り
    if (!line.trim()) {
      flushPara();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join("\n");
}

const rawView = new Set(); // 「生表示」に切り替えたメッセージ id（クライアント側のみ）

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

// ---- render ----
function render() {
  for (const agent of ["claude", "codex"]) {
    renderThread(agent);
    renderTasks(agent);
    renderAgentStatus(agent);
  }
  renderQaBar();
  renderPool();
}

const TEXT_EXTS_UI = ["md", "txt", "log", "json", "js", "mjs", "ts", "tsx", "jsx", "py", "rs", "html", "css", "csv", "yaml", "yml", "toml", "sh", "diff", "patch"];
const IMAGE_EXTS_UI = ["png", "jpg", "jpeg", "gif", "svg", "webp"];
const extOf = (name) => (name.split(".").pop() || "").toLowerCase();
const isTextExt = (name) => TEXT_EXTS_UI.includes(extOf(name));
const isImageExt = (name) => IMAGE_EXTS_UI.includes(extOf(name));

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

// ファイルプレビューのキャッシュ（file+mtime をキーに再取得を抑制）
const poolPreview = {};
// 展開中のレビュー id（既定は折りたたみ・判定チップのみ表示）
const openReviews = new Set();

function poolPreviewEl(p) {
  const body = el("div", { class: "p-body mdview" });
  if (p.body) {
    body.innerHTML = renderMarkdown(p.body); // 旧形式
    return body;
  }
  if (!p.file || p.missing) {
    body.appendChild(el("div", { class: "empty", text: p.missing ? "ファイルが見つかりません" : "" }));
    return body;
  }
  const url = "/api/pool/file/" + encodeURIComponent(p.file);
  if (isImageExt(p.file)) {
    body.appendChild(el("img", { src: url + "?v=" + (p.mtime || 0), alt: p.title }));
    return body;
  }
  if (!isTextExt(p.file) || (p.size || 0) > 300_000) {
    body.appendChild(el("div", { class: "empty", text: "プレビューなし — リンクから開いてください" }));
    return body;
  }
  const key = p.file + ":" + (p.mtime || 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    if (extOf(p.file) === "md") body.innerHTML = renderMarkdown(cached.text);
    else body.innerHTML = "<pre><code>" + escapeHtml(cached.text) + "</code></pre>";
    return body;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch(url).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
  return body;
}

let poolSelectedId = null;

function renderPool() {
  const listBox = $("#pool-list");
  const detailBox = $("#pool-detail");
  const all = [...(state.pool || [])].reverse(); // 新しい順
  const q = $("#pool-search").value.trim().toLowerCase();
  const items = q
    ? all.filter((p) => (p.title + " " + (p.file || "") + " " + NAMES[p.origin]).toLowerCase().includes(q))
    : all;
  $("#pool-count").textContent = all.length ? (q ? items.length + "/" + all.length : all.length) + " 件" : "";

  // ファイルリスト
  listBox.replaceChildren();
  if (!all.length) {
    listBox.appendChild(el("div", { class: "empty", text: "成果物なし — u2a2a/pool/ に置くか「＋持ち込み」" }));
  } else if (!items.length) {
    listBox.appendChild(el("div", { class: "empty", text: "検索に一致なし" }));
  }
  if (!items.some((p) => p.id === poolSelectedId)) poolSelectedId = items.length ? items[0].id : null;
  for (const p of items) {
    const pending = (state.reviewPending || {})[p.id] || [];
    listBox.appendChild(el("div", {
      class: "pf-row" + (p.id === poolSelectedId ? " sel" : ""),
      onclick: () => {
        poolSelectedId = p.id;
        if (document.body.classList.contains("pool-collapsed")) togglePool(false);
        renderPool();
      },
    }, [
      el("span", { class: "pf-dot", "data-s": p.status, title: POOL_STATUS_LABEL[p.status] || p.status }),
      el("span", { class: "pf-name", text: (p.file || p.title) + (pending.length ? " …" : ""), title: p.title }),
      el("span", { class: "pf-size", text: fmtSize(p.size) }),
    ]));
  }

  // 詳細
  detailBox.replaceChildren();
  const sel = items.find((p) => p.id === poolSelectedId);
  if (!sel) {
    detailBox.appendChild(el("div", { class: "empty", text: "ファイルを選択してください" }));
    return;
  }
  renderPoolDetail(detailBox, sel);
}

function renderPoolDetail(box, p) {
  {
    const pending = (state.reviewPending || {})[p.id] || [];
    const head = el("div", { class: "p-head" }, [
      el("span", { class: "status", "data-s": p.status, text: POOL_STATUS_LABEL[p.status] || p.status }),
      el("span", { class: "origin", "data-o": p.origin, text: "持ち込み: " + NAMES[p.origin] }),
      el("span", { class: "p-title", text: p.title }),
    ]);
    if (p.via === "folder") head.appendChild(el("span", { class: "origin", text: "フォルダ投入" }));
    if (p.via === "upload") head.appendChild(el("span", { class: "origin", text: "アップロード" }));

    const kids = [head];
    if (p.file) {
      const fileUrl = "/api/pool/file/" + encodeURIComponent(p.file);
      const fileRow = el("div", { class: "p-file" }, [
        el("a", { href: fileUrl, target: "_blank", rel: "noopener", text: "📄 u2a2a/pool/" + p.file }),
        el("span", { class: "p-size", text: fmtSize(p.size) + (p.missing ? "（ファイルが見つかりません）" : "") }),
      ]);
      kids.push(fileRow);
    }
    kids.push(poolPreviewEl(p));
    for (const r of p.reviews || []) {
      const rOpen = openReviews.has(r.id);
      const rHead = el("div", {
        class: "r-head",
        onclick: () => {
          rOpen ? openReviews.delete(r.id) : openReviews.add(r.id);
          renderPool();
        },
      }, [
        el("span", { class: "chev", text: rOpen ? "▾" : "▸" }),
        el("span", { class: "reviewer", "data-o": r.reviewer, text: "🔎 " + NAMES[r.reviewer] + " のレビュー" }),
      ]);
      if (r.verdict) rHead.appendChild(el("span", { class: "verdict", "data-v": r.verdict, text: "【判定】" + r.verdict }));
      const reviewKids = [rHead];
      if (rOpen) {
        const rBody = el("div", { class: "r-body mdview" });
        rBody.innerHTML = renderMarkdown(r.text);
        reviewKids.push(rBody);
      }
      kids.push(el("div", { class: "review" }, reviewKids));
    }
    for (const r of pending) {
      kids.push(el("div", { class: "typing", text: NAMES[r] + " がレビュー中" }));
    }

    const actions = el("div", { class: "actions" });
    for (const agent of ["claude", "codex"]) {
      if (!pending.includes(agent)) {
        actions.appendChild(el("button", {
          class: "small",
          text: NAMES[agent] + " にレビュー依頼",
          onclick: () => api("/api/pool/" + p.id + "/review", "POST", { reviewer: agent }),
        }));
      }
    }
    if (p.status !== "approved")
      actions.appendChild(el("button", { class: "small", text: "承認", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "approved" }) }));
    if (p.status !== "rejected")
      actions.appendChild(el("button", { class: "small", text: "差し戻し", onclick: () => api("/api/pool/" + p.id, "PATCH", { status: "rejected" }) }));
    actions.appendChild(el("button", {
      class: "small",
      text: "コピー",
      onclick: async () => {
        if (p.body) return copy(p.body);
        if (p.file && isTextExt(p.file)) {
          const r = await fetch("/api/pool/file/" + encodeURIComponent(p.file));
          return copy(await r.text());
        }
        copy("u2a2a/pool/" + (p.file || ""));
      },
    }));
    actions.appendChild(el("button", {
      class: "small",
      text: "削除",
      onclick: () => { if (confirm("「" + p.title + "」をプールから削除しますか？")) api("/api/pool/" + p.id, "DELETE"); },
    }));
    kids.push(actions);
    for (const k of kids) box.appendChild(k);
  }
}

function renderQaBar() {
  const r = state.relay || {};
  const bar = $("#qa-bar");
  bar.hidden = !r.active;
  if (r.active) {
    $("#qa-status").textContent = "🗨 質疑モード進行中 — 残り自動中継 " + r.remaining + " 手（各応答の完了を待って相手へ中継します）";
  }
}

function renderAgentStatus(agent) {
  const a = (state.agents || {})[agent] || {};
  const status = $("#status-" + agent);
  const checkbox = $("#auto-" + agent);
  checkbox.checked = !!a.auto;
  const modelInput = $("#model-" + agent);
  modelInput.placeholder = a.model || "model（既定）";
  // 入力中に SSE 更新で上書きしない
  if (document.activeElement !== modelInput) modelInput.value = a.modelOverride || "";
  // 実使用モデルを候補に含める
  const dl = $("#models-" + agent);
  if (a.model && ![...dl.options].some((o) => o.value === a.model)) {
    dl.appendChild(el("option", { value: a.model }));
  }
  if (state.running && state.running[agent]) {
    status.dataset.s = "running";
    status.textContent = "応答中…";
    status.title = "";
  } else if (a.lastError) {
    status.dataset.s = "error";
    status.textContent = "エラー（ホバーで詳細）";
    status.title = a.lastError;
  } else {
    status.dataset.s = "";
    status.textContent = a.auto ? "CLI 自動応答" : "手動（貼り付け）";
    status.title = "";
  }
}

function renderThread(agent) {
  const box = $("#messages-" + agent);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const msgs = state.messages.filter((m) => m.thread === agent);
  $("#count-" + agent).textContent = msgs.length ? msgs.length + " 件" : "";
  box.replaceChildren();
  if (!msgs.length) {
    if (state.running && state.running[agent]) {
      box.appendChild(el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
    } else {
      box.appendChild(el("div", { class: "empty", text: "まだメッセージがありません" }));
    }
    return;
  }
  for (const m of msgs) {
    const meta = el("div", { class: "meta" }, [
      el("span", { class: "who", text: NAMES[m.author] }),
      el("span", { text: fmtTime(m.ts) }),
    ]);
    if (m.relayedFrom) meta.appendChild(el("span", { text: "（" + NAMES[m.relayedFrom] + "スレッドから転送）" }));
    if (m.taskId) meta.appendChild(el("span", { text: "（タスク結果）" }));
    if (m.auto) meta.appendChild(el("span", { text: "（自動応答）" }));
    if (m.qa) meta.appendChild(el("span", { text: "（質疑）" }));
    if (m.external) meta.appendChild(el("span", { text: "（外部セッションから同期）" }));

    const isRaw = rawView.has(m.id);
    const actions = el("div", { class: "actions" }, [
      el("button", { class: "small", text: "タスク化", onclick: () => openTaskDialog(agent, m) }),
      el("button", {
        class: "small",
        text: NAMES[OTHER[agent]] + " へ転送",
        onclick: () => relay(agent, m),
      }),
      el("button", { class: "small", text: "コピー", onclick: () => copy(m.text) }),
      el("button", { class: "small", text: "プールへ", onclick: () => openPoolDialog(m.author, m.text, m.id) }),
      el("button", {
        class: "small",
        text: isRaw ? "MD表示" : "生表示",
        onclick: () => {
          rawView.has(m.id) ? rawView.delete(m.id) : rawView.add(m.id);
          renderThread(agent);
        },
      }),
    ]);

    const body = el("div", { class: "mdview" + (isRaw ? " raw" : "") });
    if (isRaw) body.textContent = m.text;
    else body.innerHTML = renderMarkdown(m.text);

    box.appendChild(el("div", { class: "msg" + (m.external ? " external" : ""), "data-author": m.author }, [
      meta,
      body,
      actions,
    ]));
  }
  if (state.running && state.running[agent]) {
    box.appendChild(el("div", { class: "typing", text: NAMES[agent] + " が応答中" }));
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function taskPrompt(t) {
  return [
    "【U2A2A タスク】" + t.title,
    t.detail ? "\n" + t.detail : "",
    "\n\n完了したら結果テキストを U2A2A アプリのタスク「" + t.title + "」に再入力してください。",
  ].join("");
}

// タスクキューの開閉。null = 自動（未完了タスクがあれば開く）
const taskZoneOpen = { claude: null, codex: null };

function renderTasks(agent) {
  const box = $("#tasks-" + agent);
  const head = $("#tasks-head-" + agent);
  box.replaceChildren();
  const tasks = state.tasks.filter((t) => t.agent === agent);
  const active = tasks.filter((t) => t.status !== "done").length;
  const open = taskZoneOpen[agent] != null ? taskZoneOpen[agent] : active > 0;
  head.textContent =
    (open ? "▾ " : "▸ ") + agent.toUpperCase() + " タスクキュー" +
    (tasks.length ? `（${active} 件${tasks.length - active ? " / 完了 " + (tasks.length - active) : ""}）` : "（なし）") +
    " — " + NAMES[agent] + " アプリ内で作業";
  head.onclick = () => {
    taskZoneOpen[agent] = !open;
    renderTasks(agent);
  };
  box.hidden = !open;
  if (!open) return;
  if (!tasks.length) {
    box.appendChild(el("div", { class: "empty", text: "タスクなし" }));
    return;
  }
  for (const t of tasks) {
    const actions = el("div", { class: "actions" });
    actions.appendChild(el("button", { class: "small", text: "プロンプトをコピー", onclick: () => copy(taskPrompt(t)) }));
    if (t.status === "queued")
      actions.appendChild(el("button", { class: "small", text: "作業開始", onclick: () => patchTask(t.id, "working") }));
    if (t.status === "queued" || t.status === "working")
      actions.appendChild(el("button", { class: "small", text: "結果を入力", onclick: () => openResultDialog(t) }));
    if (t.status === "returned")
      actions.appendChild(el("button", { class: "small", text: "完了にする", onclick: () => patchTask(t.id, "done") }));
    if (t.result)
      actions.appendChild(el("button", {
        class: "small",
        text: "プールへ",
        onclick: () => openPoolDialog(t.agent, t.result, null, t.title),
      }));
    actions.appendChild(el("button", { class: "small", text: "削除", onclick: () => delTask(t) }));

    const kids = [
      el("div", { class: "t-head" }, [
        el("span", { class: "status", "data-s": t.status, text: STATUS_LABEL[t.status] }),
        el("span", { class: "t-title", text: t.title }),
      ]),
    ];
    if (t.detail) kids.push(el("div", { class: "t-detail", text: t.detail }));
    if (t.result) kids.push(el("div", { class: "t-result", text: "結果: " + t.result }));
    kids.push(actions);
    box.appendChild(el("div", { class: "task" }, kids));
  }
}

// ---- actions ----
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("コピーしました");
  } catch {
    toast("コピーできませんでした");
  }
}

async function relay(fromAgent, m) {
  // 発言者本人（エージェント）の言葉として相手スレッドへ届ける
  const author = m.author === "user" ? "user" : m.author;
  await api("/api/messages", "POST", {
    thread: OTHER[fromAgent],
    author,
    text: m.text,
    relayedFrom: fromAgent,
  });
  toast(NAMES[OTHER[fromAgent]] + " スレッドへ転送しました");
}

async function patchTask(id, status) {
  await api("/api/tasks/" + id, "PATCH", { status });
}

async function delTask(t) {
  if (!confirm("タスク「" + t.title + "」を削除しますか？")) return;
  await api("/api/tasks/" + t.id, "DELETE");
}

function sendUser() {
  const text = $("#user-text").value.trim();
  if (!text) return;
  const target = $("#user-target").value;
  const req = target.startsWith("qa-")
    ? api("/api/qa/start", "POST", { first: target.slice(3), text, hops: Number($("#qa-hops").value) || 6 })
    : api("/api/messages", "POST", { thread: target, author: "user", text });
  req.then(() => { $("#user-text").value = ""; });
}

function sendAgent(agent) {
  const input = $("#input-" + agent);
  const text = input.value.trim();
  if (!text) return;
  api("/api/messages", "POST", { thread: agent, author: agent, text })
    .then(() => { input.value = ""; });
}

// ---- dialogs ----
let dialogSourceMessage = null;
function openTaskDialog(agent, m) {
  dialogSourceMessage = m;
  $("#task-agent").value = agent;
  const firstLine = m.text.split("\n")[0];
  $("#task-title").value = firstLine.length > 60 ? firstLine.slice(0, 60) + "…" : firstLine;
  $("#task-detail").value = m.text;
  $("#task-dialog").showModal();
}
$("#task-cancel").addEventListener("click", () => $("#task-dialog").close());
$("#task-create").addEventListener("click", async () => {
  const title = $("#task-title").value.trim();
  if (!title) return toast("タイトルを入力してください");
  await api("/api/tasks", "POST", {
    agent: $("#task-agent").value,
    title,
    detail: $("#task-detail").value.trim(),
    fromMessageId: dialogSourceMessage ? dialogSourceMessage.id : null,
  });
  $("#task-dialog").close();
  toast("タスクをキューに追加しました");
});

let poolSourceMessageId = null;
function openPoolDialog(origin, text, fromMessageId, title) {
  poolSourceMessageId = fromMessageId || null;
  $("#pool-origin").value = origin || "user";
  const firstLine = (title || (text || "").split("\n")[0] || "").trim();
  $("#pool-title").value = firstLine.length > 60 ? firstLine.slice(0, 60) + "…" : firstLine;
  $("#pool-body").value = text || "";
  $("#pool-autoreview").checked = true;
  $("#pool-dialog").showModal();
}
$("#pool-add").addEventListener("click", () => openPoolDialog("user", "", null));
$("#pool-cancel").addEventListener("click", () => $("#pool-dialog").close());
$("#pool-create").addEventListener("click", async () => {
  const title = $("#pool-title").value.trim();
  const body = $("#pool-body").value.trim();
  const file = $("#pool-file").files[0];
  if (file) {
    // ファイル添付はアップロードとして登録
    const buf = await file.arrayBuffer();
    let bin = "";
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    await api("/api/pool/upload", "POST", {
      origin: $("#pool-origin").value,
      title: title || file.name,
      filename: file.name,
      dataBase64: btoa(bin),
      autoReview: $("#pool-autoreview").checked,
    });
  } else {
    if (!title || !body) return toast("タイトルと成果物を入力してください");
    await api("/api/pool", "POST", {
      origin: $("#pool-origin").value,
      title,
      body,
      fromMessageId: poolSourceMessageId,
      autoReview: $("#pool-autoreview").checked,
    });
  }
  $("#pool-dialog").close();
  $("#pool-file").value = "";
  toast("プールへ登録しました");
});
function togglePool(collapse) {
  const collapsed = collapse != null ? collapse : !document.body.classList.contains("pool-collapsed");
  document.body.classList.toggle("pool-collapsed", collapsed);
  $("#pool-toggle").textContent = collapsed ? "展開する" : "折りたたむ";
}
$("#pool-toggle").addEventListener("click", () => togglePool());
$("#pool-search").addEventListener("input", () => renderPool());

let resultTask = null;
function openResultDialog(t) {
  resultTask = t;
  $("#result-task-label").textContent = "タスク: " + t.title;
  $("#result-text").value = "";
  $("#result-dialog").showModal();
}
$("#result-cancel").addEventListener("click", () => $("#result-dialog").close());
$("#result-save").addEventListener("click", async () => {
  const text = $("#result-text").value.trim();
  if (!text) return toast("結果テキストを入力してください");
  await api("/api/tasks/" + resultTask.id + "/result", "POST", { text });
  $("#result-dialog").close();
  toast("結果をスレッドへ戻しました");
});

// ---- wiring ----
$("#user-send").addEventListener("click", sendUser);
$("#user-target").addEventListener("change", () => {
  $("#qa-hops").hidden = !$("#user-target").value.startsWith("qa-");
});
$("#qa-stop").addEventListener("click", () => api("/api/qa/stop", "POST", {}));
$("#user-text").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendUser();
});
for (const agent of ["claude", "codex"]) {
  $("#auto-" + agent).addEventListener("change", (e) => {
    api("/api/agents/" + agent, "PATCH", { auto: e.target.checked });
  });
  const modelInput = $("#model-" + agent);
  const commitModel = () => {
    const cur = ((state.agents || {})[agent] || {}).modelOverride || "";
    if (modelInput.value.trim() === cur) return;
    api("/api/agents/" + agent, "PATCH", { model: modelInput.value })
      .then(() => toast(modelInput.value.trim() ? "モデルを " + modelInput.value.trim() + " に設定しました" : "モデルを CLI 既定に戻しました"));
  };
  modelInput.addEventListener("change", commitModel);
  modelInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { commitModel(); modelInput.blur(); } });
}
for (const btn of document.querySelectorAll("[data-agent-send]")) {
  const agent = btn.getAttribute("data-agent-send");
  btn.addEventListener("click", () => sendAgent(agent));
  $("#input-" + agent).addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendAgent(agent);
  });
}

// ---- live sync ----
const es = new EventSource("/api/events");
es.onmessage = (e) => {
  state = JSON.parse(e.data);
  render();
};
render();
</script>
</body>
</html>
