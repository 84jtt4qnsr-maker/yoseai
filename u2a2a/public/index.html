<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U2A2A Orchestration</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b23;
    --panel-2: #1c232e;
    --line: #2a3341;
    --text: #dce3ec;
    --dim: #8a96a6;
    --user: #7bd88f;
    --claude: #ffab5e;
    --codex: #6fd7ff;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  header {
    flex-wrap: wrap;
    padding: 6px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--dim); font-size: 12px; }

  /* トピックタブバー */
  #topic-bar {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 5px 14px 0;
    background: var(--panel);
    overflow-x: auto;
    flex: none;
  }
  .topic-tab {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
    background: var(--bg);
    user-select: none;
  }
  .topic-tab.active { color: var(--text); background: var(--panel-2); font-weight: 600; }
  /* 実行中トピックの緑パルスドット（別トピックの活動もタブで分かる） */
  .topic-tab .run-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--user); animation: dot-pulse 1.6s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.35; box-shadow: 0 0 0 0 rgba(123, 216, 143, 0); }
    50% { opacity: 1; box-shadow: 0 0 6px 1px rgba(123, 216, 143, 0.4); }
  }
  .topic-tab .t-btn {
    border: none;
    background: none;
    color: var(--dim);
    cursor: pointer;
    padding: 0 2px;
    font-size: 11px;
  }
  .topic-tab .t-btn:hover { color: var(--text); }
  .topic-tab input {
    padding: 0 4px;
    font-size: 12px;
    width: 110px;
    border-radius: 4px;
  }
  #topic-add {
    border: 1px dashed var(--line);
    background: none;
    border-radius: 8px 8px 0 0;
    padding: 4px 10px;
    font-size: 12.5px;
    color: var(--dim);
  }

  /* ユーザー帯（Canvas 上段・緑） */
  #user-band {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-band .role-dot { background: var(--user); }
  #user-band textarea {
    flex: 1;
    min-height: 38px;
    max-height: 140px;
    resize: vertical;
  }
  #qa-hops { width: 64px; }
  #qa-bar[hidden] { display: none; }
  #budget-bar[hidden] { display: none; }
  #budget-bar {
    border-bottom: 1px solid #ff7b7b55;
    background: #2a1518;
    color: var(--danger);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
  }
  #qa-bar {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    color: var(--codex);
  }
  .role-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; flex: none;
    align-self: center;
  }
  textarea, select, input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  textarea:focus, select:focus, input:focus { outline: 1px solid var(--dim); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--dim); }
  button.small { padding: 2px 8px; font-size: 11.5px; color: var(--dim); border-radius: 6px; }
  button.small:hover { color: var(--text); }

  /* 左=会話系（スレッド2列） / 右=共有タスクプール */
  #content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  body.pool-collapsed #content { grid-template-columns: 1fr auto; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 0;
    min-width: 0;
    position: relative;
  }
  /* 転送ペア（原文⇄折りたたみ）をつなぐ対応線 */
  #link-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: visible;
  }
  #link-layer path {
    stroke: rgba(123, 216, 143, 0.55);
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 7 5;
    stroke-linecap: round;
    animation: relay-flow 0.8s linear infinite;
  }
  /* 破線が送り元 → 受け取り側へ流れる（パスは常に送り元始点で描かれる） */
  @keyframes relay-flow {
    to { stroke-dashoffset: -12; }
  }
  #link-layer circle { fill: rgba(123, 216, 143, 0.7); }
  .thread-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .thread-col + .thread-col { border-left: 1px solid var(--line); }
  .thread-head {
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 4px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .thread-col[data-agent="claude"] .thread-head .role-dot { background: var(--claude); }
  .thread-col[data-agent="codex"] .thread-head .role-dot { background: var(--codex); }
  .thread-head .count { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .thread-head .auto-ctl {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .thread-head .auto-ctl input { accent-color: var(--user); }
  .agent-status { font-size: 11.5px; margin-left: 10px; font-weight: 400; }
  .model-chip {
    font-size: 11px;
    font-weight: 400;
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 10px;
    width: 92px;
    transition: width 0.15s;
  }
  .model-chip::placeholder { color: var(--dim); }
  .model-chip:focus { outline: 1px solid var(--dim); width: 180px; }
  .agent-status[data-s="running"] { color: var(--codex); }
  .agent-status[data-s="error"] { color: var(--danger); cursor: help; }
  .typing {
    color: var(--dim);
    font-size: 12.5px;
    padding: 2px 4px;
  }
  /* CLI 実況 */
  .activity {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--dim);
    margin-top: 6px;
  }
  .activity .a-head { display: flex; gap: 8px; align-items: baseline; }
  .activity .a-label { color: var(--codex); font-weight: 600; }
  .activity .elapsed { font-family: ui-monospace, monospace; }
  .activity .a-step { color: var(--text); margin-top: 2px; }
  .activity .a-log { margin-top: 2px; opacity: 0.65; font-size: 11px; }
  .typing::after {
    content: "…";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    transition: box-shadow 0.8s ease;
  }
  /* 状態発光: 実行中=淡緑の呼吸グラデ、正常完了=青、対応待ち=黄、エラー等=赤（1pxリング＋内側グラデ）*/
  .thread-col[data-glow="run"] .messages { animation: glow-breath 2.6s ease-in-out infinite; }
  @keyframes glow-breath {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.22), inset 0 0 10px rgba(123, 216, 143, 0.08), inset 0 0 34px rgba(123, 216, 143, 0.04); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.75), inset 0 0 22px rgba(123, 216, 143, 0.35), inset 0 0 64px rgba(123, 216, 143, 0.12); }
  }
  .thread-col[data-glow="ok"] .messages { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.55), inset 0 0 16px rgba(110, 168, 254, 0.28), inset 0 0 48px rgba(110, 168, 254, 0.08); }
  .thread-col[data-glow="wait"] .messages { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0.55), inset 0 0 16px rgba(231, 200, 107, 0.28), inset 0 0 48px rgba(231, 200, 107, 0.08); }
  .thread-col[data-glow="err"] .messages { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0.6), inset 0 0 16px rgba(255, 123, 123, 0.3), inset 0 0 48px rgba(255, 123, 123, 0.1); }
  /* 質疑リレー中: 流線（relay-flow 0.8s）の2倍周期・同色で枠を明滅させ、光の律動を揃える */
  .thread-col[data-glow="relay"] .messages { animation: relay-pulse 1.6s linear infinite; }
  @keyframes relay-pulse {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.5), inset 0 0 12px rgba(123, 216, 143, 0.16); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.18), inset 0 0 12px rgba(123, 216, 143, 0.05); }
  }
  /* プール側も同じ発光言語: レビュー/修正の実行中は緑の呼吸、判定確定時は色を一瞬点灯して減衰 */
  .pf-row.glow-run { animation: row-breath 2.6s ease-in-out infinite; border-radius: 6px; }
  @keyframes row-breath {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.10); }
    50% { box-shadow: inset 0 0 0 1px rgba(123, 216, 143, 0.55), inset 0 0 10px rgba(123, 216, 143, 0.16); }
  }
  #pool-detail { transition: box-shadow 0.8s ease; }
  #pool-detail[data-glow="run"] { animation: glow-breath 2.6s ease-in-out infinite; }
  #pool-detail[data-flash="ok"] { animation: flash-ok 2.2s ease-out 1; }
  #pool-detail[data-flash="wait"] { animation: flash-wait 2.2s ease-out 1; }
  #pool-detail[data-flash="err"] { animation: flash-err 2.2s ease-out 1; }
  @keyframes flash-ok {
    0% { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0.85), inset 0 0 24px rgba(110, 168, 254, 0.45), inset 0 0 64px rgba(110, 168, 254, 0.14); }
    100% { box-shadow: inset 0 0 0 1px rgba(110, 168, 254, 0), inset 0 0 24px rgba(110, 168, 254, 0), inset 0 0 64px rgba(110, 168, 254, 0); }
  }
  @keyframes flash-wait {
    0% { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0.85), inset 0 0 24px rgba(231, 200, 107, 0.45), inset 0 0 64px rgba(231, 200, 107, 0.14); }
    100% { box-shadow: inset 0 0 0 1px rgba(231, 200, 107, 0), inset 0 0 24px rgba(231, 200, 107, 0), inset 0 0 64px rgba(231, 200, 107, 0); }
  }
  @keyframes flash-err {
    0% { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0.9), inset 0 0 24px rgba(255, 123, 123, 0.5), inset 0 0 64px rgba(255, 123, 123, 0.16); }
    100% { box-shadow: inset 0 0 0 1px rgba(255, 123, 123, 0), inset 0 0 24px rgba(255, 123, 123, 0), inset 0 0 64px rgba(255, 123, 123, 0); }
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    border-radius: 8px;
    padding: 6px 11px;
    position: relative;
  }
  .msg[data-author="user"] { border-left-color: var(--user); }
  .msg[data-author="claude"] { border-left-color: var(--claude); }
  .msg[data-author="codex"] { border-left-color: var(--codex); }
  .msg.external { border-style: dashed; border-left-style: solid; }
  .relay-collapsed {
    color: var(--dim);
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  .relay-collapsed:hover { color: var(--text); }
  .relay-fold { cursor: pointer; }
  .relay-fold:hover { color: var(--text); }
  .msg .meta {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .msg .meta .who { font-weight: 600; }
  .msg[data-author="user"] .who { color: var(--user); }
  .msg[data-author="claude"] .who { color: var(--claude); }
  .msg[data-author="codex"] .who { color: var(--codex); }
  .mdview { word-break: break-word; overflow-x: auto; }
  .mdview.raw { white-space: pre-wrap; }
  .mdview p { margin: 0.35em 0; }
  .mdview h1, .mdview h2, .mdview h3, .mdview h4 {
    margin: 0.6em 0 0.3em;
    font-size: 1.05em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .mdview h1 { font-size: 1.15em; }
  .mdview h2 { font-size: 1.1em; }
  .mdview ul, .mdview ol { margin: 0.35em 0; padding-left: 1.5em; }
  .mdview li { margin: 0.15em 0; }
  .mdview code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 0.92em;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
  .mdview pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0.4em 0;
  }
  .mdview pre code { background: none; border: none; padding: 0; }
  .mdview blockquote {
    margin: 0.4em 0;
    padding: 2px 10px;
    border-left: 3px solid var(--dim);
    color: var(--dim);
  }
  .mdview table {
    border-collapse: collapse;
    margin: 0.4em 0;
    font-size: 0.95em;
  }
  .mdview th, .mdview td {
    border: 1px solid var(--line);
    padding: 3px 9px;
    text-align: left;
  }
  .mdview th { background: var(--panel-2); }
  .mdview a { color: var(--codex); }
  .mdview img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin: 4px 0; }
  .cb-bar {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 11px;
    color: var(--dim);
    margin: 6px 0 2px;
  }
  .cb-svg {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    max-width: 100%;
    max-height: 280px;
    display: block;
    margin: 6px 0 0;
  }
  .msg-meta {
    margin-top: 5px;
    font-size: 10.5px;
    color: var(--dim);
    font-family: ui-monospace, "SF Mono", monospace;
    border-top: 1px solid var(--line);
    padding-top: 3px;
  }
  .r-head .msg-meta { border: none; margin: 0; padding: 0; margin-left: auto; }
  .msg-media { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .msg-media img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid var(--line); }
  .msg-media a {
    color: var(--codex);
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
    text-decoration: none;
    word-break: break-all;
  }
  .msg-media a:hover { text-decoration: underline; }
  .mdview hr { border: none; border-top: 1px solid var(--line); margin: 0.6em 0; }
  /* メッセージのアクションはホバー時のみ右上にオーバーレイ表示（縦の圧迫を防ぐ） */
  .msg .actions {
    display: none;
    position: absolute;
    top: 4px;
    right: 6px;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 5px;
    z-index: 2;
  }
  .msg:hover .actions, .msg:focus-within .actions { display: flex; }
  .empty { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 24px; }

  /* エージェント返答入力 */
  /* 手動貼り付け欄は普段使わないため既定は非表示（スレッドの右クリック→手動で発言を追加）*/
  .agent-input[hidden] { display: none; }
  .agent-input {
    border-top: 1px solid var(--line);
    padding: 7px 14px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
  }
  .agent-input textarea { flex: 1; min-height: 32px; max-height: 120px; resize: vertical; }

  /* タスクキュー（Canvas 下段）: 折りたたみ式 */
  .task-zone {
    border-top: 1px solid var(--line);
    padding: 4px 16px 8px;
    max-height: 30vh;
    overflow-y: auto;
    flex: none;
  }
  .task-zone h2 {
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: 0.06em;
    margin: 4px 0 6px;
    cursor: pointer;
    user-select: none;
  }
  .task-zone h2:hover { color: var(--text); }
  .task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
  }
  .task .t-head { display: flex; gap: 8px; align-items: center; }
  .task .t-title { font-weight: 600; flex: 1; word-break: break-word; }
  .task .t-detail { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .task .t-result { font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .task .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .status {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .status[data-s="queued"]   { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="working"]  { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="returned"] { color: var(--claude); border-color: #ffab5e55; }
  .status[data-s="done"]     { color: var(--user); border-color: #7bd88f55; }

  /* 共有タスクプール（右半分・縦フル） */
  #pool-zone {
    border-left: 2px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  body.pool-collapsed #pool-zone .sub { display: none; }
  #pool-head {
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    flex-wrap: wrap;
    row-gap: 4px;
    flex: none;
  }
  #pool-head .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  #pool-head button { margin-left: auto; }
  /* ファイルビューワー: 左リスト + 右詳細 */
  #pool-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #pool-list-wrap {
    width: 270px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    padding: 4px 6px 0;
    min-height: 0;
  }
  #pool-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  body.pool-collapsed #pool-list-wrap { border-right: none; }
  body.pool-collapsed #pool-detail { display: none; }
  #pool-tools { display: flex; gap: 4px; align-items: center; margin-bottom: 2px; }
  #pool-search {
    flex: 1;
    min-width: 0;
    padding: 4px 10px;
    font-size: 12.5px;
    border-radius: 6px;
  }
  #pool-clip { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); padding: 1px 8px 3px; }
  #pool-clip[hidden] { display: none; }
  #pool-clip #pool-clip-name {
    font-family: ui-monospace, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  .pf-row.dragover { background: var(--panel-2); outline: 1px solid var(--user); }
  #pool-list.dragover { outline: 1px dashed var(--user); outline-offset: -2px; border-radius: 6px; }
  #pool-create-row { display: flex; gap: 4px; align-items: center; margin: 2px 0 4px; }
  #pool-create-row[hidden] { display: none; }
  #pool-create-row input { flex: 1; min-width: 0; padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  button.small.danger { color: var(--danger); border-color: #ff7b7b55; }
  #pool-cwd {
    font-size: 10.5px;
    color: var(--dim);
    font-family: ui-monospace, monospace;
    padding: 1px 8px 3px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #pool-cwd:hover { color: var(--text); }
  .pf-row.folder .pf-name { font-family: inherit; color: var(--dim); font-weight: 600; }
  .pf-row.folder.cwd .pf-name { color: var(--user); }
  .pf-row .chev { flex: none; width: 10px; color: var(--dim); font-size: 10px; }
  .pf-row {
    display: flex;
    gap: 7px;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .pf-row:hover { background: var(--panel-2); }
  .pf-row.sel { background: var(--panel-2); outline: 1px solid var(--line); }
  .pf-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .pf-dot[data-s="submitted"] { background: #d8c56f; }
  .pf-dot[data-s="reviewing"] { background: var(--codex); }
  .pf-dot[data-s="approved"] { background: var(--user); }
  .pf-dot[data-s="rejected"] { background: var(--danger); }
  .pf-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
  }
  .pf-size { color: var(--dim); font-size: 10.5px; flex: none; }
  #pool-detail {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 10px 14px 14px;
  }
  #pool-detail .p-body { max-height: none; }
  /* 狭い画面では従来の上下配置に戻す */
  @media (max-width: 1100px) {
    #content { display: flex; flex-direction: column; }
    main { flex: 1; }
    #pool-zone { border-left: none; border-top: 2px solid var(--line); flex: none; max-height: 40vh; }
    #pool-list-wrap { width: 210px; }
    #pool-detail .p-body { max-height: 180px; }
  }
  .p-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .p-title { font-weight: 600; flex: 1; min-width: 120px; word-break: break-word; }
  .origin {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    color: var(--dim);
    flex: none;
  }
  .origin[data-o="user"] { color: var(--user); border-color: #7bd88f55; }
  .origin[data-o="claude"] { color: var(--claude); border-color: #ffab5e55; }
  .origin[data-o="codex"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="submitted"] { color: #d8c56f; border-color: #d8c56f55; }
  .status[data-s="reviewing"] { color: var(--codex); border-color: #6fd7ff55; }
  .status[data-s="approved"] { color: var(--user); border-color: #7bd88f55; }
  .status[data-s="rejected"] { color: var(--danger); border-color: #ff7b7b55; }
  .p-file {
    margin-top: 5px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .p-file a { color: var(--codex); text-decoration: none; word-break: break-all; }
  .p-file a:hover { text-decoration: underline; }
  .p-file .p-size { color: var(--dim); flex: none; }
  .p-body {
    margin-top: 6px;
    overflow-y: auto;
    word-break: break-word;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .p-body:empty { display: none; }
  .p-body img { max-width: 100%; max-height: 340px; border-radius: 6px; }
  .review {
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--panel);
  }
  .review .r-head {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .review .r-head:hover .reviewer { text-decoration: underline; }
  .review .r-head .chev { flex: none; }
  .review .r-body { margin-top: 4px; }
  .review .r-head .reviewer { font-weight: 600; }
  .review .r-head .reviewer[data-o="claude"] { color: var(--claude); }
  .review .r-head .reviewer[data-o="codex"] { color: var(--codex); }
  .verdict {
    font-size: 11px;
    border-radius: 999px;
    padding: 1px 9px;
    border: 1px solid var(--line);
    flex: none;
  }
  .verdict[data-v="承認"] { color: var(--user); border-color: #7bd88f55; }
  .verdict[data-v="条件付き承認"] { color: #d8c56f; border-color: #d8c56f55; }
  .verdict[data-v="差し戻し"] { color: var(--danger); border-color: #ff7b7b55; }
  .review .r-body { max-height: 200px; overflow-y: auto; word-break: break-word; font-size: 13px; }

  /* 成果物の版履歴 */
  .p-history { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .history-head, .history-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .history-head { justify-content: space-between; }
  .history-note { margin: 8px 0; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .history-warning { color: #e7c86b; font-size: 12px; overflow-wrap: anywhere; }
  .history-list { list-style: none; margin: 8px 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .history-row { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .history-row strong { color: var(--text); }
  .history-row button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
  .history-diff-title { display: block; margin-top: 10px; font-size: 12px; }
  .history-diff { margin: 8px 0 0; padding: 8px; max-height: 320px; overflow: auto; white-space: pre; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  /* 行はブロック要素。横スクロール時も背景が行末まで届くよう内容幅に合わせて伸ばす */
  .diff-line { display: block; width: fit-content; min-width: 100%; }
  .diff-line:empty::before { content: " "; white-space: pre; }
  .history-diff .diff-add { color: #a0e5ad; background: #7bd88f15; }
  .history-diff .diff-remove { color: #ffabab; background: #ff7b7b15; }
  #pool-detail .review .r-head { flex-wrap: wrap; }
  .review-version { font-size: 11px; color: var(--dim); }
  #pool-detail .actions button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* コンテキストメニュー */
  #ctx-menu[hidden] { display: none; }
  #ctx-menu {
    position: fixed;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    min-width: 200px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 8px 24px #000a;
  }
  .ctx-item {
    background: none;
    border: none;
    text-align: left;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    white-space: nowrap;
  }
  .ctx-item:hover { background: var(--panel); border: none; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    width: min(520px, 92vw);
  }
  dialog::backdrop { background: #0009; }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog .field { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  dialog label { font-size: 12px; color: var(--dim); }
  dialog input, dialog textarea { width: 100%; }
  dialog textarea { min-height: 90px; resize: vertical; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  /* プロジェクトの登録・対象選択 */
  #project-context { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
  #project-context[hidden], #project-stop[hidden], #project-topic-title-field[hidden] { display: none; }
  .project-chip { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .project-unregistered { color: var(--dim); }
  .project-hint, .project-probe { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .project-error, #project-stop { color: var(--danger); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #project-stop { padding: 7px 14px; border-bottom: 1px solid #ff7b7b55; }
  #projects-dialog { width: min(720px, 92vw); max-height: 85vh; overflow-y: auto; }
  #projects-list { max-height: 40vh; overflow-y: auto; margin: 10px 0; }
  .project-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .project-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .project-card-head input { flex: 1 1 150px; width: auto; min-width: 0; padding: 4px 8px; }
  .project-path { font: 12px ui-monospace, monospace; overflow-wrap: anywhere; margin: 6px 0; }
  .project-details { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
  .project-details button { margin-left: 8px; }
  #projects-add-fields { border: 0; padding: 0; margin: 0; min-width: 0; }
  #project-choice-select { width: 100%; min-width: 0; }
  #projects-dialog button:disabled, #project-choice-dialog button:disabled { opacity: 0.45; cursor: not-allowed; }

  #toast {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--dim);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>U2A2A Orchestration</h1>
  <span class="sub">ユーザー ⇄ Claude Code ⇄ Codex ／ やり取りから生まれたタスクを各アプリで作業し、結果を再入力する</span>
  <button id="budget-btn" class="small" style="margin-left:auto" title="実行の上限設定（コスト・回数・時間）">⚙ 上限</button>
  <button id="projects-btn" class="small">📁 プロジェクト</button>
  <button id="health-btn" class="small" title="運用イベント（失敗ログ）とストレージ計測">🩺</button>
</header>

<!-- トピック（スレッド）タブ -->
<div id="topic-bar"></div>
<div id="project-context" hidden></div>
<div id="project-stop" role="status" hidden></div>

<!-- ユーザー側（閲覧・回答・質問） -->
<div id="user-band">
  <span class="role-dot" title="ユーザー"></span>
  <textarea id="user-text" placeholder="ユーザーとして発言（回答・質問）— Cmd+Enter で送信"></textarea>
  <select id="user-target" title="送信先スレッド">
    <option value="claude">→ Claude Code</option>
    <option value="codex">→ Codex</option>
    <option value="both">→ 両方</option>
    <option value="qa-claude">🗨 質疑（Claude先手）</option>
    <option value="qa-codex">🗨 質疑（Codex先手）</option>
  </select>
  <input id="qa-agenda" placeholder="今回決めること（空欄=先手が起案）" title="質疑の論点。空欄ならリレー開始側のエージェントが起案し、進行中にバーから修正できます" hidden style="width:220px" />
  <input id="qa-hops" type="number" min="1" max="20" value="6" title="自動中継の上限手数" hidden />
  <label class="auto-ctl" id="test-mark-wrap" title="テスト送信: エージェントは明示された生成・操作は行うが、追加調査・実装へは広げない"><input type="checkbox" id="test-mark" />🧪</label>
  <button id="user-attach" title="ファイルを添付（プールの attachments/ に保存されます）">📎</button>
  <input id="attach-input" type="file" multiple hidden />
  <button id="user-send">送信</button>
</div>
<div id="budget-bar" hidden>
  <span id="budget-reason"></span>
  <button id="budget-resume" class="small">解除して自動応答を再開</button>
</div>
<div id="qa-bar" hidden>
  <span id="qa-status"></span>
  <input id="qa-agenda-edit" title="今回決めること（編集すると次の中継から反映）" style="width:260px;padding:2px 8px;font-size:12px" />
  <button id="qa-stop" class="small">質疑を停止</button>
</div>

<div id="content">
<main>
  <svg id="link-layer"></svg>
  <!-- Claude Code 側スレッド -->
  <section class="thread-col" data-agent="claude">
    <div class="thread-head"><span class="role-dot"></span>Claude Code 側スレッド<input class="model-chip" id="model-claude" list="models-claude" title="使用モデルを指定（空欄=CLI既定）。プレースホルダは直近の実使用モデル" /><datalist id="models-claude"><option value="opus"></option><option value="sonnet"></option><option value="haiku"></option></datalist><span class="count" id="count-claude"></span><span class="agent-status" id="status-claude"></span>
      <button class="small" id="reset-claude" title="このスレッドの Claude CLI セッションをリセット（次の応答から新セッション・文脈もリセット）">⟳</button>
      <label class="auto-ctl"><input type="checkbox" id="auto-claude" />自動応答</label>
    </div>
    <div class="messages" id="messages-claude"></div>
    <div class="agent-input" hidden>
      <textarea id="input-claude" placeholder="Claude Code の返答・質問を貼り付け／入力 — Cmd+Enter で追加・Esc で閉じる"></textarea>
      <button data-agent-send="claude">Claude として追加</button>
    </div>
    <div class="task-zone">
      <h2 id="tasks-head-claude"></h2>
      <div id="tasks-claude"></div>
    </div>
  </section>

  <!-- Codex 側スレッド -->
  <section class="thread-col" data-agent="codex">
    <div class="thread-head"><span class="role-dot"></span>Codex 側スレッド<input class="model-chip" id="model-codex" list="models-codex" title="使用モデルを指定（空欄=CLI既定）。プレースホルダは直近の実使用モデル" /><datalist id="models-codex"></datalist><span class="count" id="count-codex"></span><span class="agent-status" id="status-codex"></span>
      <button class="small" id="reset-codex" title="このスレッドの Codex CLI セッションをリセット（次の応答から新セッション・文脈もリセット。メディア生成対応の新方式に切替）">⟳</button>
      <label class="auto-ctl"><input type="checkbox" id="auto-codex" />自動応答</label>
    </div>
    <div class="messages" id="messages-codex"></div>
    <div class="agent-input" hidden>
      <textarea id="input-codex" placeholder="Codex の返答・質問を貼り付け／入力 — Cmd+Enter で追加・Esc で閉じる"></textarea>
      <button data-agent-send="codex">Codex として追加</button>
    </div>
    <div class="task-zone">
      <h2 id="tasks-head-codex"></h2>
      <div id="tasks-codex"></div>
    </div>
  </section>
</main>

<!-- 共有タスクプール -->
<section id="pool-zone">
  <div id="pool-head">
    共有タスクプール
    <span class="sub" id="pool-count"></span>
    <button id="pool-add">＋ 持ち込み</button>
    <button id="pool-toggle" class="small">折りたたむ</button>
  </div>
  <div id="pool-body">
    <div id="pool-list-wrap">
      <div id="pool-tools">
        <input id="pool-search" placeholder="🔍 ファイル検索" />
        <button class="small" id="pool-newdir" title="新規フォルダ">📁+</button>
        <button class="small" id="pool-newfile" title="新規ファイル">📄+</button>
        <button class="small" id="pool-copy" title="選択中のファイル/フォルダをコピー（Cmd+C）">⧉</button>
      </div>
      <div id="pool-clip" hidden>
        <span id="pool-clip-name"></span>
        <button class="small" id="pool-paste" title="作成先へ複製（Cmd+V）">ペースト</button>
        <button class="small" id="pool-clip-clear">✕</button>
      </div>
      <div id="pool-create-row" hidden>
        <input id="pool-create-name" />
        <button id="pool-create-ok" class="small">作成</button>
        <button id="pool-create-cancel" class="small">✕</button>
      </div>
      <div id="pool-cwd" title="クリックでルートに戻る"></div>
      <div id="pool-list"></div>
    </div>
    <div id="pool-detail"></div>
  </div>
</section>
</div>

<!-- ヘルス（イベントログ・ストレージ計測）ダイアログ -->
<dialog id="projects-dialog" aria-labelledby="projects-heading">
  <h3 id="projects-heading">📁 プロジェクト</h3>
  <p class="project-hint">既存のローカルフォルダを参照先として登録します。トピックの対象は実行前に選択できます。</p>
  <button id="projects-reload" class="small" type="button">一覧・状態を再取得</button>
  <div id="projects-list-state" class="project-hint" role="status"></div>
  <div id="projects-list"></div>
  <form id="projects-add-form">
    <fieldset id="projects-add-fields">
      <legend>プロジェクトを追加</legend>
      <div class="field"><label for="projects-path">フォルダの絶対パス</label><input id="projects-path" required placeholder="/Users/your-name/projects/example" autocomplete="off" /></div>
      <div class="field"><label for="projects-name">表示名（任意・60文字以内）</label><input id="projects-name" maxlength="60" autocomplete="off" /></div>
      <button id="projects-add" type="submit">登録</button>
    </fieldset>
    <div id="projects-error" class="project-error" role="status"></div>
  </form>
  <div class="buttons"><button id="projects-close" type="button">閉じる</button></div>
</dialog>

<dialog id="project-choice-dialog" aria-labelledby="project-choice-title">
  <h3 id="project-choice-title">対象プロジェクトを選択</h3>
  <form id="project-choice-form">
    <div id="project-topic-title-field" class="field"><label for="project-topic-title">スレッド名（任意）</label><input id="project-topic-title" maxlength="60" autocomplete="off" /></div>
    <div class="field"><label for="project-choice-select">プロジェクト</label><select id="project-choice-select"></select></div>
    <div id="project-choice-preview"></div>
    <p id="project-choice-note" class="project-hint"></p>
    <div id="project-choice-error" class="project-error" role="status"></div>
    <div class="buttons"><button id="project-choice-cancel" type="button">キャンセル</button><button id="project-choice-save" type="submit">保存</button></div>
  </form>
</dialog>

<dialog id="health-dialog">
  <h3>🩺 運用イベント</h3>
  <div class="field"><label id="health-storage"></label></div>
  <div id="health-events" style="max-height:40vh;overflow-y:auto;font-size:12px;"></div>
  <div class="buttons">
    <button id="health-clear">ログをクリア</button>
    <button id="health-close">閉じる</button>
  </div>
</dialog>

<!-- 上限設定ダイアログ -->
<dialog id="budget-dialog">
  <h3>実行の上限設定</h3>
  <div class="field">
    <label>トピックごとのコスト上限（USD・metered実測。空欄=無効）</label>
    <input id="budget-usd" type="number" min="0" step="0.5" placeholder="例: 5" />
  </div>
  <div class="field">
    <label>1日の実行回数上限（全エージェント共通。空欄=無効）</label>
    <input id="budget-count" type="number" min="0" step="1" placeholder="例: 100" />
  </div>
  <div class="field">
    <label>1日の累計実行時間上限（分・走行中も含む。空欄=無効）</label>
    <input id="budget-minutes" type="number" min="0" step="5" placeholder="例: 120" />
  </div>
  <div class="field">
    <label id="budget-today"></label>
  </div>
  <div class="buttons">
    <button id="budget-cancel">キャンセル</button>
    <button id="budget-save">保存</button>
  </div>
</dialog>

<!-- プール持ち込みダイアログ -->
<dialog id="pool-dialog">
  <h3>共有タスクプールへ持ち込み</h3>
  <div class="field">
    <label>持ち込み元</label>
    <select id="pool-origin">
      <option value="user">ユーザー</option>
      <option value="claude">Claude Code</option>
      <option value="codex">Codex</option>
    </select>
  </div>
  <div class="field">
    <label>タイトル</label>
    <input id="pool-title" />
  </div>
  <div class="field">
    <label>成果物テキスト（Markdown 可。`u2a2a/pool/` に .md として保存されます）</label>
    <textarea id="pool-body"></textarea>
  </div>
  <div class="field">

// ---- トピック（スレッド）----
let currentTopicId = localStorage.getItem("u2a2a-topic") || null;
let renamingTopicId = null;

function currentTopic() {
  return (state.topics || []).find((t) => t.id === currentTopicId) || (state.topics || [])[0] || null;
}

function ensureTopic() {
  const t = currentTopic();
  if (t && t.id !== currentTopicId) {
    currentTopicId = t.id;
    try { localStorage.setItem("u2a2a-topic", t.id); } catch {}
  }
  return t;
}

function switchTopic(id) {
  currentTopicId = id;
  renamingTopicId = null;
  try { localStorage.setItem("u2a2a-topic", id); } catch {}
  render();
}

// 実行中ランが属するトピック集合（スレッド応答は topicId、レビュー/修正/要約は成果物経由で解決）
function busyTopicIds() {
  const ids = new Set();
  for (const r of state.runs || []) {
    if (r.topicId) ids.add(r.topicId);
    else if (r.itemId) {
      const p = (state.pool || []).find((x) => x.id === r.itemId);
      if (p && p.topicId) ids.add(p.topicId);
    }
  }
  return ids;
}

function renderTopicBar() {
  const bar = $("#topic-bar");
  bar.replaceChildren();
  const topics = state.topics || [];
  for (const t of topics) {
    const active = t.id === (currentTopic() || {}).id;
    const tab = el("div", { class: "topic-tab" + (active ? " active" : ""), "data-topic": t.id, onclick: () => { if (!active) switchTopic(t.id); } });
    // ブラウザライクなドラッグ入れ替え
    tab.setAttribute("draggable", "true");
    tab.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/u2a2a-topic", t.id));
    tab.addEventListener("dragover", (e) => {
      if ([...e.dataTransfer.types].includes("text/u2a2a-topic")) e.preventDefault();
    });
    tab.addEventListener("drop", (e) => {
      const src = e.dataTransfer.getData("text/u2a2a-topic");
      if (!src || src === t.id) return;
      e.preventDefault();
      const order = topics.map((x) => x.id).filter((tid) => tid !== src);
      order.splice(order.indexOf(t.id), 0, src);
      api("/api/topics/reorder", "POST", { order });
    });
    if (renamingTopicId === t.id) {
      const input = el("input", { value: t.title });
      const commit = () => {
        renamingTopicId = null;
        const v = input.value.trim();
        if (v && v !== t.title) api("/api/topics/" + t.id, "PATCH", { title: v });
        else render();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { renamingTopicId = null; render(); }
      });
      input.addEventListener("blur", commit);
      tab.appendChild(input);
      bar.appendChild(tab);
      setTimeout(() => input.focus(), 0);
      continue;
    }
    const count = (state.messages || []).filter((m) => m.topicId === t.id).length;
    if (busyTopicIds().has(t.id)) tab.appendChild(el("span", { class: "run-dot", title: "このトピックで実行中" }));
    tab.appendChild(el("span", { text: t.title + (count ? "（" + count + "）" : "") }));
    if (active) {
      tab.appendChild(el("button", {
        class: "t-btn", text: "✏", title: "名前を変更",

        tab.appendChild(el("button", {
          class: "t-btn", text: "✕", title: "スレッドを削除（メッセージも消えます）",
          onclick: (e) => { e.stopPropagation(); armedDelete(e.target, () => api("/api/topics/" + t.id, "DELETE").then(() => { currentTopicId = null; })); },
        }));
      }
    }
    bar.appendChild(tab);
  }
  bar.appendChild(el("button", {
    id: "topic-add", text: "＋ 新規スレッド",

  }));
}

function toast(text) {

async function api(path, method = "GET", body, { silent = false } = {}) {
  const res = await fetch(path, {
    method,
    ...(silent ? { cache: "no-store" } : {}),
    headers: body === undefined ? undefined : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (!silent) toast(err.error || "エラーが発生しました");
    throw Object.assign(new Error(err.error || "取得に失敗しました（HTTP " + res.status + "）"), { status: res.status, data: err });
  }
  return silent ? res.json().catch(() => ({})) : res.json();
}

function fmtTime(ts) {

// ---- 転送ペアの対応線 ----
// 原文（送信元スレッド）と折りたたみ表示（受信側）を薄緑の線でつなぎ、
// 左右スレッドのスクロール差をひと目で分かるようにする
let linkRaf = 0;

function scheduleLinks() {
  cancelAnimationFrame(linkRaf);
  linkRaf = requestAnimationFrame(updateRelayLinks);
}

function updateRelayLinks() {
  const svg = $("#link-layer");
  const mainEl = document.querySelector("main");
  if (!svg || !mainEl) return;
  const mr = mainEl.getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + mr.width + " " + mr.height);
  const t = currentTopic();
  if (!t) {
    svg.replaceChildren();
    return;
  }
  const parts = [];
  for (const m of state.messages) {
    const pvm = provOf(m);
    if (m.topicId !== t.id || !pvm.source) continue;
    const tgt = document.querySelector('.msg[data-mid="' + m.id + '"]');
    if (!tgt) continue;
    let srcMsg = pvm.source.messageId ? state.messages.find((o) => o.id === pvm.source.messageId) : null;
    if (!srcMsg) {
      // ID なしの旧中継用フォールバック: 同一トピック・送信元スレッド・同著者・同文の直前メッセージ
      srcMsg = state.messages.find(
        (o) => o.topicId === t.id && o.thread === pvm.source.agent && o.author === m.author && o.text === m.text && o.ts <= m.ts
      );
    }
    const src = srcMsg && document.querySelector('.msg[data-mid="' + srcMsg.id + '"]');
    if (!src) continue;
    // 各メッセージの中心Yを、所属スレッドの表示範囲内にクランプ
    // （画面外へスクロールした分は端に張り付き、線の傾きがズレ量を示す）
    const anchor = (el2) => {
      const cr = el2.closest(".messages").getBoundingClientRect();
      const r = el2.getBoundingClientRect();
      return {
        r,
        y: Math.min(Math.max(r.top + r.height / 2, cr.top + 6), cr.bottom - 6),
        visible: r.bottom > cr.top && r.top < cr.bottom, // 可読領域に一部でも見えているか
      };
    };
    const s = anchor(src);
    const g = anchor(tgt);
    if (!s.visible && !g.visible) continue; // 両方とも画面外のペアは描かない
    const leftFirst = s.r.left < g.r.left;
    const x1 = (leftFirst ? s.r.right : s.r.left) - mr.left;
    const x2 = (leftFirst ? g.r.left : g.r.right) - mr.left;
    const y1 = s.y - mr.top;
    const y2 = g.y - mr.top;
    const dx = (x2 - x1) / 2;
    parts.push(
      `<path d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}" />` +
      `<circle cx="${x1}" cy="${y1}" r="2" /><circle cx="${x2}" cy="${y2}" r="2" />`
    );
  }
  svg.innerHTML = parts.join("");
}

for (const boxId of ["messages-claude", "messages-codex"]) {

// ---- 応答メタ（コスト・トークン・所要時間）表示 ----
function fmtTok(n) {

function metaText(meta) {

  return parts.join("　");
}

// ---- 軽量 Markdown レンダラー（HTML はすべてエスケープ＝無害化した上で装飾のみ付与） ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inlineMd(raw) {
  let s = escapeHtml(raw);
  // 画像: ![alt](http(s)://… | u2a2a/pool/… | /api/pool/file/…)
  s = s.replace(
    /!\[([^\]]*)\]\((?:(https?:[^)\s]+)|(?:\/api\/pool\/file\/|u2a2a\/pool\/)([^)\s]+))\)/g,
    (_, alt, abs, rel) => {
      const src = abs || "/api/pool/file/" + rel;
      return '<img src="' + src + '" alt="' + alt + '" loading="lazy">';
    }
  );
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

// コードブロックの実体ストア（保存・コピー用。event delegation から参照）
const cbStore = {};
let cbSeq = 0;

function renderMarkdown(src, ctx) {
  const lines = src.split("\n");
  const out = [];
  let para = [];
  const flushPara = () => {
    if (para.length) out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>");
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // フェンス付きコードブロック（SVG はインライン描画＋プール保存ボタン付き）
    const fence = line.match(/^\s*```([\w+-]*)/);
    if (fence) {
      flushPara();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; // 閉じフェンス
      const code = buf.join("\n");
      const lang = (fence[1] || "").toLowerCase();
      const cid = "cb" + ++cbSeq;
      cbStore[cid] = { code, lang, author: (ctx || {}).author || "user" };
      const isSvg = lang === "svg" || code.trimStart().startsWith("<svg");
      let html = "";
      if (isSvg) {
        // <img> + data URI 描画なのでスクリプトは実行されない
        html += '<img class="cb-svg" alt="SVG" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(code) + '">';
      }
      html +=
        '<div class="cb-bar"><span>' + (lang || "code") + "</span>" +
        '<button class="small cb-save" data-cid="' + cid + '">プールへ保存</button>' +
        '<button class="small cb-copy" data-cid="' + cid + '">コピー</button></div>' +
        "<pre><code>" + escapeHtml(code) + "</code></pre>";
      out.push(html);
      continue;
    }
    // 見出し
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      const level = Math.min(h[1].length, 4);
      out.push(`<h${level}>` + inlineMd(h[2]) + `</h${level}>`);
      i++;
      continue;
    }
    // 水平線
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushPara();
      out.push("<hr>");
      i++;
      continue;
    }
    // 引用
    if (/^\s*>\s?/.test(line)) {
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + buf.map(inlineMd).join("<br>") + "</blockquote>");
      continue;
    }
    // 表（ヘッダ行 + 区切り行）
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara();
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => inlineMd(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(cells(lines[i++]));
      out.push(
        "<table><thead><tr>" + head.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    // リスト（箇条書き／番号。ネストは1段のみ対応）
    const isUl = (l) => /^\s*[-*+]\s+/.test(l);
    const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
    if (isUl(line) || isOl(line)) {
      flushPara();
      const ordered = isOl(line);
      const tag = ordered ? "ol" : "ul";
      const items = [];
      while (i < lines.length && (isUl(lines[i]) || isOl(lines[i]))) {
        let item = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        i++;
        // 継続行（インデントされた通常行）を取り込む
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) {
          item += "\n" + lines[i++].trim();
        }
        items.push("<li>" + item.split("\n").map(inlineMd).join("<br>") + "</li>");
      }
      out.push(`<${tag}>` + items.join("") + `</${tag}>`);
      continue;
    }
    // 空行 = 段落区切り
    if (!line.trim()) {
      flushPara();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flushPara();
  return out.join("\n");
}

const rawView = new Set(); // 「生表示」に切り替えたメッセージ id（クライアント側のみ）
// メッセージ由来（provenance）ヘルパー。source があれば転送/中継コピー
const provOf = (m) => m.provenance || {};
const isRelayCopy = (m) => !!provOf(m).source;

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

// ---- ローカルプロジェクト（実体は移動せず、参照先だけを登録）----
const projectProbes = new Map();
const projectProbeQueue = [];
let projectProbeRunning = 0;
let projectCatalogKey = "";
let projectCatalogEpoch = 0;
let projectListRequest = 0;
let projectListLoading = false;

function projectErrorText(error) {
  let text = error.message || "通信に失敗しました";
  for (const [key, label, collection] of [["topics", "参照トピック", state.topics], ["items", "参照成果物", state.pool]]) {
    const ids = error.data?.[key];
    if (Array.isArray(ids) && ids.length) {
      const names = ids.slice(0, 8).map((id) => (collection || []).find((x) => x.id === id)?.title || id);
      text += "\n" + label + ": " + names.join("、") + (ids.length > 8 ? " 他 " + (ids.length - 8) + " 件" : "");
    }

  return text;
}

function projectProbeLabel(id) {
  if (!id) return { text: "既定の参照先", blocked: false };
  if (!findProject(id)) return { text: "登録解除済み — 対象を確認できません（実行不可）", blocked: true };
  const entry = projectProbes.get(id);
  if (!entry || entry.pending) return { text: "確認中…", blocked: false };
  if (entry.error) return { text: "確認不可: " + entry.error, blocked: false };
  const probe = entry.data;
  const notes = { missing: "フォルダが見つかりません", unreadable: "フォルダを読み取れません", unregistered: "登録解除済み" };
  if (notes[probe.status]) return { text: notes[probe.status] + "（実行不可）" + (probe.note ? " — " + probe.note : ""), blocked: true };
  if (probe.status === "not-git") return { text: "通常フォルダ（Git情報なし）", blocked: false };
  if (probe.status !== "ok") return { text: "確認不可" + (probe.note ? ": " + probe.note : ""), blocked: false };
  return { text: (probe.branch || "ブランチ不明") + "@" + (probe.head || "HEAD不明") + "・変更 " + (probe.dirty ?? "不明") + " 件", blocked: false };
}

function pumpProjectProbes() {
  // 管理一覧を開いても、登録件数分のGit確認を一斉に起動しない。
  while (projectProbeRunning < 3 && projectProbeQueue.length) {
    const { id, entry } = projectProbeQueue.shift();
    if (projectProbes.get(id) !== entry || findProject(id)?.path !== entry.path) continue;
    projectProbeRunning++;
    projectRequest(projectUrl(id) + "/probe")
      .then((data) => {
        if (typeof data.status !== "string") throw new Error("確認結果の形式が不正です");
        entry.data = data;
      })
      .catch((e) => { entry.error = e.message; })
      .finally(() => {
        entry.pending = false;
        projectProbeRunning--;
        if (projectProbes.get(id) === entry) {
          if (entry.recheck) ensureProjectProbe(id, true);
          refreshProjectProbeViews();
        }
        pumpProjectProbes();
      });
  }
}

function ensureProjectProbe(id, force = false) {
  const project = findProject(id);
  if (!project) return;
  const old = projectProbes.get(id);
  if (old?.path === project.path) {
    if (!force) return;
    // 実行状態が取得中に変わった場合も、完了後に最新の状態を確認する。
    if (old.pending) { old.recheck = true; return; }
  }
  const entry = { path: project.path, pending: true };
  projectProbes.set(id, entry);
  projectProbeQueue.push({ id, entry });
  pumpProjectProbes();
}

function projectProbeEl(id) {

function renderProjectUI() {
  const key = JSON.stringify(state.projects || []);
  if (projectCatalogKey !== key) {
    projectCatalogKey = key;
    projectCatalogEpoch++;
    for (const [id, entry] of projectProbes) if (findProject(id)?.path !== entry.path) projectProbes.delete(id);
    if ($("#projects-dialog").open) renderProjectList();
  }
  const topic = currentTopic();
  const errors = ["claude", "codex"].map((agent) => topic?.agents?.[agent]?.lastError ?? state.agents?.[agent]?.lastError ?? "");
  const blockedMessage = (state.messages || []).findLast((m) => m.topicId === topic?.id && m.blocked);
  const errorKey = JSON.stringify([topic?.id, topic?.projectId, errors, blockedMessage?.id]);
  if (projectExecutionErrorKey !== errorKey) {
    projectExecutionErrorKey = errorKey;
    // 停止通知とエラー解消のどちらでも更新する。サーバの文言には依存しない。
    // トピック切替時の確認は renderProjectContext に任せる。
    const project = findProject(topic?.projectId);
    if (project && projectContextKey === JSON.stringify([topic.id, topic.projectId])) ensureProjectProbe(project.id, true);
  }
  renderProjectContext();
  syncProjectChoice();

async function loadProjectList(forceProbe = false) {
  const request = ++projectListRequest, epoch = projectCatalogEpoch;
  projectListLoading = true;
  $("#projects-list-state").classList.remove("project-error");
  $("#projects-list-state").textContent = "登録一覧を読み込み中…";
  $("#projects-reload").disabled = true;
  try {
    const data = await projectRequest("/api/projects");
    if (!Array.isArray(data.projects)) throw new Error("登録一覧の形式が不正です");
    if (request !== projectListRequest) return;
    // 後から届いた一覧で、SSEや登録操作による新しい一覧を巻き戻さない。
    if (epoch === projectCatalogEpoch) { state.projects = data.projects; render(); }
    for (const p of state.projects || []) ensureProjectProbe(p.id, forceProbe);
    $("#projects-list-state").textContent = "";
    renderProjectList();
  } catch (e) {
    if (request === projectListRequest) {
      $("#projects-list-state").classList.add("project-error");
      $("#projects-list-state").textContent = "一覧の取得失敗: " + projectErrorText(e);
    }
  } finally {
    if (request === projectListRequest) { projectListLoading = false; $("#projects-reload").disabled = false; }
  }
}

async function mutateProject(project, method, body) {
  if (projectMutating.has(project.id)) return;
  projectMutating.add(project.id);
  projectCatalogEpoch++;
  renderProjectList();
  let error;
  try {
    await projectRequest(projectUrl(project.id), method, body);
    if (method === "DELETE") state.projects = (state.projects || []).filter((p) => p.id !== project.id);
    else state.projects = (state.projects || []).map((p) => p.id === project.id ? { ...p, name: body.name } : p);
    projectNameDrafts.delete(project.id);
    toast(method === "DELETE" ? "登録を解除しました（ファイルは保持）" : "表示名を保存しました");
  } catch (e) { error = e; }
  finally { projectMutating.delete(project.id); projectCatalogEpoch++; render(); renderProjectList(); }
  if (error) {
    const row = [...$("#projects-list").querySelectorAll("[data-project-row-error]")].find((node) => node.dataset.projectRowError === project.id);
    if ($("#projects-dialog").open && row) row.textContent = projectErrorText(error);
    else toast(projectErrorText(error));
  }
}

async function openProjectChoice(mode, topic, messageId = null) {
  if (mode === "new" && topic === undefined) topic = currentTopic();
  if (mode === "bind" && topic?.projectLocked) return toast("実行後は変更できません。🌿 分岐で別プロジェクトのトピックを作れます");
  if (mode !== "new" && !topic) return toast("対象トピックが見つかりません");
  // 登録ゼロ・未紐付けなら従来の1クリック作成を維持する。
  // 未登録IDが残るトピックは、勝手に既定へ戻さず選択を求める。
  if (mode !== "bind" && !(state.projects || []).length && !topic?.projectId) {
    try {
      const path = mode === "new" ? "/api/topics" : "/api/topics/" + encodeURIComponent(topic.id) + "/branch";
      const created = await projectRequest(path, "POST", mode === "new" ? {} : { messageId });
      if (!created.id) throw new Error("トピックの応答形式が不正です。再操作前に一覧を確認してください。");
      state.topics = [...(state.topics || []).filter((t) => t.id !== created.id), created];
      switchTopic(created.id);
      renamingTopicId = created.id;
      render();
      if (mode === "branch") toast("この地点までの履歴で分岐しました（セッションは新規・要約を引き継ぎ）");
    } catch (e) { toast(projectErrorText(e)); }
    return;
  }
  projectChoice = { mode, topicId: topic?.id, messageId, selected: topic?.projectId || "", busy: false };
  $("#project-choice-title").textContent = mode === "new" ? "新規スレッド" : mode === "branch" ? "この地点から分岐" : "対象プロジェクトを選択";
  $("#project-topic-title-field").hidden = mode !== "new";
  $("#project-topic-title").value = "";
  $("#project-choice-error").textContent = "";
  $("#project-choice-save").textContent = mode === "new" ? "作成" : mode === "branch" ? "分岐を作成" : "対象を保存";
  $("#project-choice-dialog").showModal();
  syncProjectChoice();
}

function syncProjectChoice() {
  const choice = projectChoice;
  if (!choice || !$("#project-choice-dialog").open) return;
  const topic = (state.topics || []).find((t) => t.id === choice.topicId);
  const select = $("#project-choice-select");
  const key = JSON.stringify([(state.projects || []).map((p) => [p.id, p.name]), choice.selected]);
  if (choice.optionsKey !== key) {
    choice.optionsKey = key;
    select.replaceChildren(el("option", { value: "", text: "Kometa（既定）" }));
    for (const p of state.projects || []) select.appendChild(el("option", { value: p.id, text: p.name }));
    if (choice.selected && !findProject(choice.selected)) select.appendChild(el("option", { value: choice.selected, text: "登録解除済み（別の対象を選択してください）", disabled: "" }));
    select.value = choice.selected;
  }
  const locked = choice.mode === "bind" && topic?.projectLocked;
  const missingTopic = choice.mode !== "new" && !topic;
  const invalidProject = choice.selected && !findProject(choice.selected);
  $("#project-choice-save").disabled = !!(choice.busy || locked || missingTopic || invalidProject);
  select.disabled = choice.busy || !!locked;
  $("#project-topic-title").disabled = choice.busy;
  $("#project-choice-cancel").disabled = choice.busy;
  const note = locked ? "実行後は変更できません。新規スレッドまたは分岐を作成してください。"
    : missingTopic ? "対象トピックが削除されました。"
    : choice.mode === "branch" ? "この地点までの履歴と要約を引き継ぎ、CLIセッションは新規で開始します。" + ((topic.projectId || "") !== choice.selected ? " 引き継ぐ履歴・要約は「" + projectName(topic.projectId) + "」を対象にした内容です。" : "")
    : "プロジェクトは閲覧のみです。最初の実行後は対象を変更できません。";
  $("#project-choice-note").textContent = note;
  const preview = $("#project-choice-preview");
  preview.replaceChildren();
  if (findProject(choice.selected)) preview.appendChild(el("div", { class: "project-path", text: findProject(choice.selected).path }));
  preview.appendChild(projectProbeEl(choice.selected));
}

async function submitProjectChoice(event) {
  event.preventDefault();
  const choice = projectChoice;
  if (!choice || choice.busy || $("#project-choice-save").disabled) return;
  choice.busy = true;
  $("#project-choice-error").textContent = "";
  syncProjectChoice();
  try {
    const projectId = choice.selected || null;
    const path = choice.mode === "new" ? "/api/topics" : "/api/topics/" + encodeURIComponent(choice.topicId) + (choice.mode === "branch" ? "/branch" : "");
    const body = choice.mode === "new" ? { title: $("#project-topic-title").value.trim() || undefined, projectId }
      : choice.mode === "branch" ? { messageId: choice.messageId, projectId } : { projectId };
    const topic = await projectRequest(path, choice.mode === "bind" ? "PATCH" : "POST", body);
    if (!topic.id) throw new Error("トピックの応答形式が不正です。再操作前に一覧を確認してください。");
    const old = (state.topics || []).find((t) => t.id === topic.id);
    state.topics = old ? state.topics.map((t) => t.id === topic.id ? { ...t, ...topic } : t) : [...(state.topics || []), topic];
    if (projectChoice === choice) {
      $("#project-choice-dialog").close();
      projectChoice = null;
      switchTopic(topic.id);
      if (choice.mode === "branch" || (choice.mode === "new" && !body.title)) {
        renamingTopicId = topic.id;
        render();
      }
    } else render();
    toast(choice.mode === "branch" ? "選択したプロジェクトで分岐しました" : choice.mode === "new" ? "スレッドを作成しました" : "対象プロジェクトを保存しました");
  } catch (e) {
    if (e.status === 409 && e.data?.reason === "locked") {
      const topic = (state.topics || []).find((t) => t.id === choice.topicId);
      if (topic) topic.projectLocked = true;
    }
    if (projectChoice === choice) $("#project-choice-error").textContent = projectErrorText(e);
    else toast(projectErrorText(e));
  } finally { choice.busy = false; renderProjectUI(); }
}

const TEXT_EXTS_UI = ["md", "txt", "log", "json", "js", "mjs", "ts", "tsx", "jsx", "py", "rs", "html", "css", "csv", "yaml", "yml", "toml", "sh", "diff", "patch"];
const IMAGE_EXTS_UI = ["png", "jpg", "jpeg", "gif", "svg", "webp"];
const VIDEO_EXTS_UI = ["mp4", "webm", "mov"];
const AUDIO_EXTS_UI = ["mp3", "wav", "ogg", "m4a"];
const extOf = (name) => (name.split(".").pop() || "").toLowerCase();
const isTextExt = (name) => TEXT_EXTS_UI.includes(extOf(name));
const isImageExt = (name) => IMAGE_EXTS_UI.includes(extOf(name));
const isVideoExt = (name) => VIDEO_EXTS_UI.includes(extOf(name));
const isAudioExt = (name) => AUDIO_EXTS_UI.includes(extOf(name));

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

// ファイルプレビューのキャッシュ（file+mtime をキーに再取得を抑制）
const poolPreview = {};
// 存在しないメディア参照（再描画のたびに404を出さないための失敗キャッシュ）
const mediaFailed = new Set();
// 展開中のレビュー id（既定は折りたたみ・判定チップのみ表示）
const openReviews = new Set();

// 選択中の成果物だけを保持。SSE の再描画では再取得せず、履歴・実行状態の変化で更新する。
let poolHistory = null;
const VERSION_REASONS = { "fix-before": "修正前", "fix-after": "修正後", review: "レビュー開始" };
const HISTORY_UNSUPPORTED = { binary: "UTF-8テキスト以外", "too-large": "256 KiB超", "no-file": "ファイル実体なし" };

async function readPoolHistory(url) {
  const res = await fetch(url, { cache: "no-store" });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "履歴を取得できません（HTTP " + res.status + "）");
  return data;
}

function poolHistoryState(p) {
  const key = JSON.stringify([p.id, p.file, p.mtime, p.size, p.missing, p.versions, p.versionsUnsupported,
    (p.reviews || []).length, (p.fixes || []).length,
    (state.reviewPending || {})[p.id], (state.fixPending || {})[p.id]]);
  if (poolHistory && poolHistory.key === key) return poolHistory;
  const previous = poolHistory && poolHistory.itemId === p.id ? poolHistory : null;
  // 再取得中も保存済み一覧を維持し、SSEで届いた新しい版を補う。
  const versions = new Map((previous ? previous.versions : []).map((v) => [v.id, v]));
  for (const version of p.versions || []) versions.set(version.id, version);
  const history = poolHistory = {
    itemId: p.id, key, pending: true, versions: [...versions.values()].sort((a, b) => a.n - b.n),
    unsupportedReason: p.versionsUnsupported !== undefined ? p.versionsUnsupported : previous?.unsupportedReason,
    selectedToId: previous ? previous.selectedToId : null,
    diff: previous ? previous.diff : null,
  };
  // ファイル実体のない旧形式はサーバに聞くまでもなく対象外（選択のたびの往復を省く）
  if (!p.file) {
    history.pending = false;
    history.unsupportedReason = "no-file";
    return history;
  }
  readPoolHistory("/api/pool/" + encodeURIComponent(p.id) + "/versions")
    .then((data) => {
      if (!Array.isArray(data.versions)) throw new Error("履歴の応答形式を確認してください");
      history.versions = [...data.versions].sort((a, b) => a.n - b.n);
      history.unsupportedReason = data.unsupportedReason;
    })
    .catch((e) => { history.error = e.message; })
    .finally(() => {
      history.pending = false;
      if (poolHistory === history && poolSelectedId === p.id) renderPool();
    });
  return history;
}

function versionLabel(versions, id) {
  if (!id) return "版未記録";
  const version = versions.find((v) => v.id === id);
  return version ? "v" + version.n : "保存版（番号不明）";
}

function poolHistoryEl(p, history) {
  const section = el("section", { class: "p-history", "aria-label": "成果物の履歴" });
  section.appendChild(el("div", { class: "history-head" }, [
    el("strong", { text: "履歴" }),
    el("button", { class: "small", text: "再取得", onclick: () => {
      // 比較先の選択は維持する（失敗からの復旧のたびに選び直させない）
      history.key = null; history.diff = null; renderPool();
    } }),
  ]));
  const note = (text, warning = false) => el("div", { class: "history-note" + (warning ? " history-warning" : ""), text });
  if (history.pending) section.appendChild(note("履歴を読み込み中…"));
  if (history.error) section.appendChild(note("履歴の読み込み失敗: " + history.error + "。「再取得」で再試行できます。", true));
  if (history.unsupportedReason) {
    section.appendChild(note("履歴対象外（" + (HISTORY_UNSUPPORTED[history.unsupportedReason] || history.unsupportedReason) + "）"));
  }
  if (!history.versions.length) {
    if (!history.pending && !history.error && !history.unsupportedReason) section.appendChild(note("保存版はまだありません。レビュー開始・修正時に保存されます。"));
    return section;
  }
  section.appendChild(note("修正・レビュー開始時の保存版です。外部編集の全履歴は保存しません。"));
  const list = el("ol", { class: "history-list" });
  for (let i = history.versions.length - 1; i >= 0; i--) {
    const version = history.versions[i];
    const savedAt = new Date(version.ts);
    const row = el("li", { class: "history-row" }, [
      el("strong", { text: "v" + version.n }),
      el("span", { text: VERSION_REASONS[version.reason] || version.reason || "理由未記録" }),
      el("span", { text: NAMES[version.agent] || "担当未記録" }),
      el("time", { text: savedAt.toLocaleString("ja-JP"),
        ...(Number.isNaN(savedAt.getTime()) ? {} : { datetime: savedAt.toISOString() }) }),
      el("span", { text: fmtSize(version.size) }),
    ]);
    if (version.partial) row.appendChild(el("span", { class: "history-warning", text: "途中失敗", title: "修正は失敗しましたが、変更された内容を保存しました" }));
    if (i > 0) {
      const from = history.versions[i - 1];
      row.appendChild(el("button", {
        class: "small", text: "v" + from.n + " → v" + version.n + " の差分",
        "aria-pressed": String(history.selectedToId === version.id),
        onclick: () => { history.selectedToId = version.id; renderPool(); },
      }));
    }
    list.appendChild(row);
  }
  section.appendChild(list);
  const index = history.versions.findIndex((v) => v.id === history.selectedToId);
  if (index < 1) {
    section.appendChild(note(history.versions.length === 1 ? "比較には2版以上必要です。" : "一覧の「差分」から直前の版と比較できます。"));
    return section;
  }
  const from = history.versions[index - 1], to = history.versions[index];
  const diffKey = JSON.stringify([from.id, to.id]);
  if (!history.diff || history.diff.key !== diffKey) {
    const diff = history.diff = { key: diffKey, pending: true, scrollTop: 0, scrollLeft: 0 };
    const query = new URLSearchParams({ from: from.id, to: to.id });
    readPoolHistory("/api/pool/" + encodeURIComponent(p.id) + "/diff?" + query)
      .then((data) => {
        if (typeof data.diff !== "string") throw new Error("差分の応答形式を確認してください");
        diff.data = data;
      })
      .catch((e) => { diff.error = e.message; })
      .finally(() => {
        diff.pending = false;
        // 項目・比較先を切り替えた後に古い応答で表示を戻さない。
        if (poolHistory && poolHistory.itemId === p.id && poolHistory.diff === diff && poolSelectedId === p.id) renderPool();
      });
  }
  section.appendChild(el("strong", { class: "history-diff-title", text: "v" + from.n + " → v" + to.n + " の差分" }));
  const diff = history.diff;
  if (diff.pending) section.appendChild(note("差分を読み込み中…"));
  else if (diff.error) {
    section.appendChild(note("差分の読み込み失敗: " + diff.error, true));
    section.appendChild(el("button", { class: "small", text: "差分を再試行", onclick: () => { history.diff = null; renderPool(); } }));
  } else {
    if (diff.data.truncated) section.appendChild(note("差分は一部のみ表示しています（256 KiB上限）。全文ではありません。", true));
    if (!diff.data.diff) section.appendChild(note(diff.data.truncated ? "表示できる差分がありません。" : "内容の差分はありません。"));
    else {
      // 数千ノードになり得るため一度だけ構築し、SSE再描画では同じ要素を使い回す
      if (!diff.el) {
        const pre = diff.el = el("pre", {
          class: "history-diff", tabindex: "0", "aria-label": "v" + from.n + " から v" + to.n + " の差分",
          onscroll: (e) => { diff.scrollTop = e.target.scrollTop; diff.scrollLeft = e.target.scrollLeft; },
        });
        // 成果物由来の差分は必ず textContent 経由。HTML/Markdown として解釈しない。
        // 行は display:block（コピー時は要素境界が改行になる）
        const lines = diff.data.diff.split("\n");
        if (lines[lines.length - 1] === "") lines.pop();
        lines.forEach((line, i) => {
          const header = i < 2 && /^(---|\+\+\+) v\d+$/.test(line);
          const kind = !header && line.startsWith("+") ? " diff-add"
            : !header && line.startsWith("-") ? " diff-remove" : "";
          pre.appendChild(el("span", { class: "diff-line" + kind, text: line }));
        });
      }
      const pre = diff.el;
      section.appendChild(pre);
      requestAnimationFrame(() => { if (pre.isConnected) { pre.scrollTop = diff.scrollTop; pre.scrollLeft = diff.scrollLeft; } });
    }
  }
  return section;
}

// api() の409表示を維持し、失敗時に成功トーストや未処理のPromiseを残さない。
async function poolAction(path, method, body, successMessage) {
  try {
    await api(path, method, body);
    if (successMessage) toast(successMessage);
  } catch (e) {
    // HTTPエラーはapi()が通知済み。fetchのネットワーク例外だけ補う。
    if (e instanceof TypeError) toast(e.message || "通信に失敗しました");
  }
}

function poolPreviewEl(p) {
  const body = el("div", { class: "p-body mdview" });
  if (p.body) {
    body.innerHTML = renderMarkdown(p.body); // 旧形式
    return body;
  }
  if (!p.file || p.missing) {
    body.appendChild(el("div", { class: "empty", text: p.missing ? "ファイルが見つかりません" : "" }));
    return body;
  }
  const url = "/api/pool/file/" + encodeURIComponent(p.file);
  if (isImageExt(p.file)) {
    body.appendChild(el("img", { src: url + "?v=" + (p.mtime || 0), alt: p.title }));
    return body;
  }
  if (isVideoExt(p.file)) {
    body.appendChild(el("video", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;max-height:360px;border-radius:8px;" }));
    return body;
  }
  if (isAudioExt(p.file)) {
    body.appendChild(el("audio", { src: url + "?v=" + (p.mtime || 0), controls: "", style: "width:100%;" }));
    return body;
  }
  if (extOf(p.file) === "html" || extOf(p.file) === "htm") {
    // HTML は iframe でその場実行（ゲーム・デモ対応）。
    // allow-same-origin がないと localStorage 等で成果物側が停止するため付与
    // （ローカル単一ユーザーのツールで、プール内容は自分のエージェント由来という前提）
    body.appendChild(el("iframe", {
      src: url + "?v=" + (p.mtime || 0),
      sandbox: "allow-scripts allow-same-origin allow-pointer-lock",
      style: "width:100%;height:420px;border:1px solid var(--line);border-radius:8px;background:#0e1116;",
    }));
    return body;
  }
  if (!isTextExt(p.file) || (p.size || 0) > 300_000) {
    body.appendChild(el("div", { class: "empty", text: "プレビューなし — リンクから開いてください" }));
    return body;
  }
  const key = p.file + ":" + (p.mtime || 0);
  const cached = poolPreview[key];
  if (cached && cached.text != null) {
    if (extOf(p.file) === "md") body.innerHTML = renderMarkdown(cached.text);
    else body.innerHTML = "<pre><code>" + escapeHtml(cached.text) + "</code></pre>";
    return body;
  }
  body.appendChild(el("div", { class: "empty", text: "読み込み中…" }));
  if (!cached) {
    poolPreview[key] = { pending: true };
    fetch(url).then((r) => r.text()).then((text) => {
      poolPreview[key] = { text };
      renderPool();
    }).catch(() => { poolPreview[key] = { text: "（読み込み失敗）" }; });
  }
  return body;
}

let poolSelectedId = null;
let poolCurrentDir = ""; // 新規作成の対象フォルダ（"" = ルート）
const closedDirs = new Set(); // 閉じているフォルダ（既定は開）
let poolFocus = null; // 直近にクリックした {kind:"file"|"dir", path} — コピー対象
