name: test

# クリーンチェックアウトで u2a2a のテストを通す。
#
# 依存パッケージが 1 つも無いので、インストール段階は置いていない。
#   - package-lock.json が無いので npm ci は使えない
#   - npm install は依存ゼロでも registry へ出る可能性があり、落ちればテストに辿り着けない
#   - package.json が壊れていれば npm test 自体が読めずに落ちるので、検査の役目は果たされる
#
# 注意: このワークフローが緑になるまで、テストスイート全体が CI で通った実績はない。
# 赤になったら、まず u2a2a/test/ の該当スイートを疑うこと（ワークフローの設定より先に）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # サーバ統合テストが基点コミットの確認に git を使うので、コミットできる設定を入れておく
      - name: Configure git for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Test
        working-directory: u2a2a
        run: npm test
